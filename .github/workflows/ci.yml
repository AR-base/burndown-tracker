name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm install
      - run: npm run build
      - run: git diff --exit-code index.html vercel.json _headers || (echo "Run npm run build and commit the result" && exit 1)
      - run: npm test
