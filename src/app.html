<title>Project Burndown Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark "mission control" world from the client palette — frosted header holding the view switcher,
   glass cards on a midnight field, coral reserved for the single thing that matters on each screen. */
:root{
  color-scheme:dark;
  --bg:#070606; --bg-2:#0D0B0C; --navy:#141112; --slate:#2F2B2C; --rose:#4B2FA8; --coral:#8556F7;
  --gold:#CEAE31; --gold-2:#EBCA4C; --gold-3:#AF8F30; --lav:#D3AFFE; --lav-2:#B28DF0; --cyan:#4FD1E8; --pink:#F28DC7;
  --surface:#141112; --sunk:#0E0C0D; --raise:#2F2B2C;
  --glass:rgba(28,25,26,.62); --glass-strong:rgba(14,12,13,.9);
  --line:rgba(249,250,250,.09); --line-strong:#3A3536; --grid:rgba(47,43,44,.62);
  --ink:#F9FAFA; --muted:#ABA6A8; --faint:#716B6D;
  --accent:#8556F7; --accent-2:#D3AFFE; --accent-soft:rgba(133,86,247,.17); --accent-glow:rgba(133,86,247,.45);
  --ideal:#8E888A; --good:#5DD6A6; --warn:#F0A840; --bad:#F25F7A;
  --good-soft:rgba(93,214,166,.14); --warn-soft:rgba(240,168,64,.15); --bad-soft:rgba(242,95,122,.15);
  --f-display:'Sora','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Manrope','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:16px; --r-sm:10px; --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(1100px 620px at 88% -12%,rgba(133,86,247,.20),transparent 60%),radial-gradient(800px 480px at -8% 6%,rgba(206,174,49,.07),transparent 60%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass-strong)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.35;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass-strong);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 220px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,var(--coral),var(--rose));box-shadow:0 6px 18px -6px var(--accent-glow)}
.brand-t{display:flex;flex-direction:column;min-width:0}
.eyebrow{font:600 10.5px/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand h1{font:600 16px/1.25 var(--f-display);margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38ch}
.bar-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(7,6,6,.6);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font:600 13px/1 var(--f-body);color:var(--muted);white-space:nowrap;transition:color .2s,background .25s var(--ease)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--raise);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 4px 14px -6px rgba(0,0,0,.6)}
@media (max-width:1060px){.tabs{order:3;flex:1 1 100%}}
/* signed in: 8 views, so the switcher gets its own row under the brand and actions */
.bar-in:has(#tabs > :nth-child(7)) .tabs{order:3;flex:1 1 100%;width:max-content;max-width:100%}
.bar-in:has(#tabs > :nth-child(7)) .brand{flex:1 1 220px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(7,6,6,.6);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font:600 12px/1 var(--f-body);color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.kbd-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(7,6,6,.5);color:var(--muted);border-radius:999px;padding:6px 10px 6px 12px;cursor:pointer;font-size:12.5px}
.kbd-btn:hover{color:var(--ink);border-color:var(--line-strong)}
kbd{font:500 11px var(--f-mono);padding:2px 6px;border-radius:6px;background:var(--raise);color:var(--muted);border:1px solid var(--line)}

/* page head */
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:18px 0}
.meta{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;font:600 12px/1.2 var(--f-body);letter-spacing:.02em;border:1px solid currentColor}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.st-on{color:var(--good);background:var(--good-soft)} .st-risk{color:var(--warn);background:var(--warn-soft)} .st-late{color:var(--bad);background:var(--bad-soft)}

/* glass surfaces with a cursor spotlight */
.card,.kpi,.wiz-main,.wiz-steps li{position:relative;isolation:isolate}
.card::after,.kpi::after,.wiz-main::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .35s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(133,86,247,.10),transparent 45%)}
.card:hover::after,.kpi:hover::after,.wiz-main:hover::after{opacity:1}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font:600 15px/1.3 var(--f-display);margin:0;letter-spacing:.005em}
.card-b{padding:16px 18px}
.hint{font-size:12.5px;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;box-shadow:var(--shadow);transition:transform .35s var(--ease),border-color .3s}
.kpi:hover{transform:translateY(-2px);border-color:rgba(133,86,247,.35)}
.kpi .k{font:600 10.5px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:600 26px/1.15 var(--f-display);margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v small{font:500 12px var(--f-body);color:var(--muted);letter-spacing:0}
.kpi .s{font-size:12px;color:var(--muted);margin-top:3px}
.meter{height:5px;background:rgba(7,6,6,.8);border-radius:3px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--coral));border-radius:3px;box-shadow:0 0 12px var(--accent-glow)}
.ring{display:flex;align-items:center;gap:12px;margin-top:6px}
.ring svg{flex:none}
.ring .v{margin-top:0}

/* panels */
.panel{padding-block:18px 48px}
.panel:not([hidden]){animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px}

/* chart */
.chart-box{position:relative}
.chart-box svg{display:block;width:100%;height:auto}
.chart-box svg path.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s var(--ease) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top:2px solid}
.tip{position:absolute;pointer-events:none;background:var(--glass-strong);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line-strong);color:var(--ink);font:12px/1.4 var(--f-mono);padding:7px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-110%);box-shadow:var(--shadow)}
.bd-hint{margin:0;padding:0 18px 14px}

/* lists */
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mini li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.mini li:last-child{border-bottom:0}
.tid{font:500 11.5px var(--f-mono);color:var(--faint)}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font:600 11px/1.4 var(--f-body);white-space:nowrap}
.c-done{background:var(--good-soft);color:var(--good)} .c-late{background:var(--bad-soft);color:var(--bad)}
.c-inprog{background:var(--accent-soft);color:var(--accent)} .c-todo{background:rgba(47,43,44,.5);color:var(--muted)}
.sec-t{font:600 10.5px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.sec-t:first-child{margin-top:0}

/* gantt */
.g-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.g-tools label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.gantt{display:grid;grid-template-columns:minmax(150px,var(--lw,300px)) minmax(0,1fr)}
.g-left{border-right:1px solid var(--line);overflow:hidden}
.g-right{overflow-x:auto;scrollbar-color:var(--slate) transparent}
.g-left svg,.g-right svg{display:block}
@media (max-width:640px){.gantt{--lw:150px}}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 10.5px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:rgba(7,6,6,.35)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(47,43,44,.25)}
tr.phase-row td{background:rgba(7,6,6,.4);font:600 12.5px var(--f-display)}
tr.total-row td{font-weight:700;border-top:1px solid var(--line-strong)}
td.r,th.r{text-align:right}
.pbar{width:84px;height:6px;background:rgba(7,6,6,.8);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.pbar i{display:block;height:100%;border-radius:3px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:rgba(47,43,44,.35);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;font:600 13px/1.2 var(--f-body);transition:transform .2s var(--ease),background .2s,border-color .2s,box-shadow .25s}
.btn:hover{background:rgba(47,43,44,.6);border-color:#4A4445}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#9C74FA,var(--coral));border-color:transparent;color:#fff;box-shadow:0 8px 22px -10px var(--accent-glow),0 1px 0 rgba(255,255,255,.25) inset}
.btn.pri:hover{box-shadow:0 10px 28px -8px var(--accent-glow),0 1px 0 rgba(255,255,255,.25) inset;filter:brightness(1.05)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.55;cursor:progress}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.lbl{font:600 10.5px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea,.edit-row input,.extra-row input,.extra-row select,.rate-in{border:1px solid var(--line);background:rgba(7,6,6,.55);border-radius:var(--r-sm);padding:9px 11px;min-width:0;width:100%;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.f input:focus,.f select:focus,.f textarea:focus,.edit-row input:focus,.extra-row input:focus,.extra-row select:focus,.rate-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f input[type=range]{padding:0;accent-color:var(--coral)}
input[type=checkbox]{accent-color:var(--coral)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
.f.wide{grid-column:1/-1}
.f textarea{font:12px/1.55 var(--f-mono);min-height:160px;resize:vertical}
.doc-ta{min-height:96px !important;font:13px/1.55 var(--f-body) !important}
.err{color:var(--bad);font-size:12.5px;min-height:1em}
.ok{color:var(--good);font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.edit-rows{display:flex;flex-direction:column;gap:8px}
.edit-row{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr) 120px auto;gap:8px;align-items:center}
.edit-row input[type=color]{padding:2px;height:36px}
@media (max-width:640px){.edit-row{grid-template-columns:1fr 1fr}}
.doc-lang{margin:0 0 12px;padding:10px 14px;border-radius:var(--r-sm);background:var(--accent-soft);border:1px solid rgba(133,86,247,.3);font-size:13px}

/* download menu */
.dl{position:relative}
.dl-btn{padding:8px 16px}
.dl-menu{position:absolute;right:0;top:calc(100% + 10px);z-index:40;width:300px;max-width:calc(100vw - 32px);background:var(--glass-strong);-webkit-backdrop-filter:saturate(1.4) blur(20px);backdrop-filter:saturate(1.4) blur(20px);border:1px solid var(--line-strong);border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);padding:6px;animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.dl-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left;font-size:13.5px;color:var(--ink)}
.dl-menu button:hover,.dl-menu button:focus-visible{background:rgba(133,86,247,.14)}
.dl-menu small{font:500 11px var(--f-mono);color:var(--muted)}
.dl-h{font:600 10.5px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 12px 4px}
.dl-note{font-size:11.5px;color:var(--muted);margin:6px 12px 2px}
.dl-status{font-size:12px;margin:4px 12px 6px;color:var(--good);overflow-wrap:anywhere}
.dl-status:empty{display:none}
.dl-status.err{color:var(--bad)}

/* assistant */
.wiz{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.wiz{grid-template-columns:minmax(0,1fr)}}
.wiz-main{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow:hidden;box-shadow:var(--shadow)}
.wiz-main::before{content:"";position:absolute;z-index:-2;width:520px;height:520px;right:-180px;top:-260px;border-radius:50%;filter:blur(60px);opacity:.55;
  background:conic-gradient(from 0deg,var(--coral),var(--rose),var(--slate),var(--coral));animation:orb 14s linear infinite}
@keyframes orb{to{transform:rotate(360deg)}}
.wiz-h{font:700 clamp(24px,3.2vw,36px)/1.08 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance;max-width:20ch}
.wiz-h em{font-style:normal;background:linear-gradient(90deg,var(--coral),#EBCA4C);-webkit-background-clip:text;background-clip:text;color:transparent}
.wiz-lead{margin:0;color:var(--muted);max-width:62ch;font-size:15px}
.wiz-input{width:100%;border:1px solid var(--line-strong);border-radius:16px;background:rgba(7,6,6,.6);padding:16px 18px;font:17px/1.5 var(--f-body);resize:vertical;min-height:96px;color:var(--ink);transition:border-color .25s,box-shadow .3s}
.wiz-input::placeholder{color:var(--faint)}
.wiz-input:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 4px var(--accent-soft),0 12px 40px -12px var(--accent-glow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:rgba(7,6,6,.45);border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--muted);transition:all .2s var(--ease)}
.chips button:hover{border-color:var(--coral);color:var(--ink);transform:translateY(-1px)}
.wiz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.wiz-grid .seg{width:100%;display:flex}.wiz-grid .seg button{flex:1 1 0;min-width:0;padding:9px 4px;overflow-wrap:anywhere}
.wiz-detect{margin:0;font-size:13px;color:var(--muted);min-height:1.4em}
.wiz-detect b{color:var(--ink);padding:2px 10px;border-radius:999px;background:var(--accent-soft);border:1px solid rgba(133,86,247,.35);margin-left:4px}
.wiz-go{padding:12px 22px;font-size:15px}
.wiz-ai{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.wiz-steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.wiz-steps li{counter-increment:s;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 16px 58px;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.wiz-steps li::before{content:counter(s);position:absolute;left:16px;top:16px;width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,var(--coral),var(--rose));color:#fff;font:600 13px/28px var(--f-mono);text-align:center;box-shadow:0 6px 16px -6px var(--accent-glow)}
.wiz-steps b{color:var(--ink);font:600 14.5px var(--f-display)}
.wiz-res{margin-top:16px;border-color:rgba(133,86,247,.45);box-shadow:0 0 0 1px rgba(133,86,247,.15),0 24px 60px -24px var(--accent-glow)}
.wiz-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:0 0 4px}
.wiz-stats div{min-width:0;padding:12px 14px;border-radius:12px;background:rgba(7,6,6,.4);border:1px solid var(--line)}
.wiz-stats dt{font:600 10.5px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wiz-stats dd{margin:6px 0 0;font:600 17px/1.3 var(--f-display);overflow-wrap:anywhere}

/* budget */
.bud-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bud-kpis .kpi.total{background:linear-gradient(150deg,rgba(133,86,247,.22),rgba(206,174,49,.18));border-color:rgba(133,86,247,.4)}
.bud-kpis .kpi.total .v{color:#EBCA4C}
.rate-in{width:96px;padding:5px 8px;text-align:right;font:500 13px var(--f-mono)}

.brain-h em,.wiz-h em{font-style:normal;background:linear-gradient(95deg,var(--lav) 5%,var(--gold-2) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brain-lead{color:var(--muted);margin:0 auto;max-width:62ch;font-size:15px}
.brain-stage{position:relative;display:grid;grid-template-columns:minmax(190px,250px) minmax(0,1fr) minmax(190px,250px);min-height:min(620px,74vh);margin-top:8px}
.brain-cv{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.bn-col{list-style:none;margin:0;padding:24px 0;display:flex;flex-direction:column;justify-content:space-around;gap:10px;position:relative;z-index:1}
.bn-l{grid-column:1}.bn-r{grid-column:3}
.bn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;padding:11px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(14,12,13,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);transition:transform .3s var(--ease),border-color .25s,box-shadow .3s,background .25s}
.bn-r .bn{flex-direction:row}.bn-l .bn{flex-direction:row-reverse;text-align:right}
.bn:hover,.bn.on{border-color:rgba(133,86,247,.6);background:rgba(28,22,40,.85);box-shadow:0 0 0 1px rgba(133,86,247,.25),0 14px 36px -14px var(--accent-glow)}
.bn.on{transform:scale(1.03)}
.bn-dot{width:10px;height:10px;border-radius:50%;flex:none;background:currentColor;box-shadow:0 0 12px currentColor}
.bn.st-good,.bn.st-risk,.bn.st-late{background-color:rgba(14,12,13,.7)}
.bn.st-good .bn-dot{color:var(--good)}.bn.st-risk .bn-dot{color:var(--warn)}.bn.st-late .bn-dot{color:var(--bad)}
.bn-t{display:flex;flex-direction:column;min-width:0;gap:2px}
.bn-t b{font:600 14px/1.25 var(--f-display);color:var(--ink);overflow-wrap:anywhere}
.bn-t small{font-size:12px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.brain-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-top:4px}
.brain-detail .bd-in{padding:18px 20px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"pill h btn" "pill p btn" "pill v btn";gap:4px 18px;align-items:center}
.brain-detail .pill{grid-area:pill;align-self:start}.brain-detail h3{grid-area:h;margin:0;font:600 18px var(--f-display)}
.brain-detail .hint{grid-area:p;margin:0}.brain-detail .hint b{color:var(--ink)}
.bd-val{grid-area:v;margin:4px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}.bd-val b{font:600 16px var(--f-display);color:var(--gold-2)}.bd-val span{font-size:13px;color:var(--muted)}
.brain-detail .btn{grid-area:btn}
.brain-legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.brain-legend li{display:flex;align-items:center;gap:8px;background:none !important}.brain-legend li::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
@media (max-width:820px){
  .brain-stage{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;min-height:0}
  .brain-cv{position:relative;grid-column:1/-1;height:300px}
  .bn-col{display:contents}
  .bn,.bn-l .bn{flex-direction:row;text-align:left;padding:10px 12px}
  .brain-foot{grid-template-columns:minmax(0,1fr)}
  .brain-detail .bd-in{grid-template-columns:minmax(0,1fr);grid-template-areas:"pill" "h" "p" "v" "btn"}
  .brain-detail .btn{justify-self:start;margin-top:8px}
  .brain-legend{flex-direction:row;flex-wrap:wrap;gap:12px}
}

/* ---------- PM toolkit ---------- */
.pm-wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.pm-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(var(--bar-h,120px) + 12px);padding:6px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line)}
.pm-nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;color:var(--muted);text-align:left;padding:9px 12px;border-radius:10px;cursor:pointer;font:600 13px/1.3 var(--f-body)}
.pm-nav button:hover{color:var(--ink);background:rgba(47,43,44,.45)}
.pm-nav button[aria-current="true"]{color:var(--ink);background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.pm-nav .n{font:500 11px var(--f-mono);color:var(--faint);background:rgba(7,6,6,.6);border-radius:999px;padding:2px 7px}
.pm-h{min-width:0;flex:1 1 320px}.pm-h h2{font:600 17px/1.3 var(--f-display);margin:0}.pm-h .hint{margin:3px 0 0}
.pm-t td{padding:6px 6px;vertical-align:top}.pm-t th{padding:10px 6px}
.pm-t input,.pm-t select,.pm-t textarea,.pm-roles input{width:100%;min-width:0;border:1px solid transparent;background:rgba(7,6,6,.35);border-radius:8px;padding:7px 9px;color:var(--ink);font:13px/1.4 var(--f-body);transition:border-color .2s,background .2s}
.pm-t textarea{resize:none;min-height:36px;overflow:hidden;field-sizing:content;display:block}
.pm-t textarea.long{min-height:54px}
.pm-t input:hover,.pm-t select:hover,.pm-t textarea:hover{border-color:var(--line)}
.pm-t input:focus,.pm-t select:focus,.pm-t textarea:focus,.pm-roles input:focus{outline:none;border-color:var(--accent);background:rgba(7,6,6,.7);box-shadow:0 0 0 3px var(--accent-soft)}
.pm-t [aria-invalid="true"]{border-color:var(--bad)}
.pm-t .pm-num{width:64px;text-align:center;font-family:var(--f-mono)}
.c-title,.c-name,.c-what,.c-deliverable,.c-item,.c-decision,.c-lesson{min-width:180px}
.c-response,.c-rationale,.c-criteria,.c-notes,.c-actions,.c-action{min-width:210px}
.c-role,.c-audience,.c-method,.c-contact,.c-supplier,.c-channel,.c-requestedBy{min-width:140px}
.c-owner,.c-by{min-width:80px}
.c-date,.c-opened,.c-due{min-width:138px}
.c-strategy,.c-status,.c-severity,.c-freq,.c-type,.c-category{min-width:122px}
.c-score{width:48px;text-align:center}.pm-t td.c-score{padding-top:13px}
@media (max-width:700px){
  .pm-tbl:has(.pm-cards){overflow:visible}
  .pm-cards,.pm-cards tbody{display:block}.pm-cards thead{display:none}
  .pm-cards tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:14px;background:rgba(7,6,6,.3)}
  .pm-cards td{display:flex;flex-direction:column;gap:4px;padding:0;border:0;min-width:0 !important;text-align:left}
  .pm-cards td::before{content:attr(data-label);font:600 10px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .pm-cards td:not([data-label])::before{content:none}
  .pm-cards td.c-title,.pm-cards td.c-name,.pm-cards td.c-what,.pm-cards td.c-deliverable,.pm-cards td.c-item,.pm-cards td.c-decision,.pm-cards td.c-lesson,.pm-cards td.long,.pm-cards td:has(textarea.long){grid-column:1/-1}
  .pm-cards td:last-child{grid-column:1/-1;align-items:flex-end}
  .pm-cards td.c-n{position:absolute;opacity:0;pointer-events:none}
  .pm-cards .pm-num{width:100%}
}
.t-raci td.c,.t-raci th.c{text-align:center;min-width:64px}
.raci-sel{text-align:center;font:600 13px var(--f-mono) !important;min-width:52px}
.rc-R{color:var(--lav)}.rc-A{color:var(--gold-2)}.rc-C{color:var(--cyan)}.rc-I{color:var(--muted)}
.raci-warn{margin-top:6px}
.t-raci td:first-child{min-width:240px}
.pm-roles{max-width:520px;margin:10px 0 14px}
.icon-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1}
.icon-btn:hover{color:var(--bad);border-color:rgba(242,95,122,.5)}
.score{display:inline-block;min-width:34px;text-align:center;padding:3px 8px;border-radius:8px;font:600 12.5px var(--f-mono)}
.sc-low{background:rgba(93,214,166,.16);color:var(--good)}.sc-mid{background:rgba(235,202,76,.16);color:var(--gold-2)}.sc-hi{background:rgba(240,168,64,.2);color:var(--warn)}.sc-bad{background:rgba(242,95,122,.2);color:var(--bad)}
.pm-top{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:center;margin-bottom:18px}
.pm-side{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.pm-side li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border-radius:12px;background:rgba(7,6,6,.35);border:1px solid var(--line)}
.pm-side li>span:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.pm-side b{font:600 13.5px/1.35 var(--f-body);overflow-wrap:anywhere}.pm-side small{color:var(--muted);font-size:12px;line-height:1.4;overflow-wrap:anywhere}
.num-dot{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#141112;font:700 11.5px var(--f-mono);flex:none;box-shadow:0 0 10px rgba(206,174,49,.45)}
.c-n{width:36px;text-align:center}
.heat{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;gap:6px}
.heat-y{writing-mode:vertical-rl;transform:rotate(180deg);font:600 10.5px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.heat-x{grid-column:2;font:600 10.5px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.heat-g{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;aspect-ratio:1}
.hc{border-radius:8px;display:grid;place-items:center;opacity:.55;font:600 13px var(--f-mono)}.hc.has{opacity:1;box-shadow:0 0 0 1px currentColor inset}
.pi-grid{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;gap:6px}
.pi-y{writing-mode:vertical-rl;transform:rotate(180deg);font:600 10.5px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.pi-x{grid-column:2;font:600 10.5px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.pi-box{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:1.05;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pi-q:nth-child(n+3){display:flex;align-items:flex-end}
.pi-q{padding:7px 8px;font:600 10px/1.3 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border:1px solid rgba(249,250,250,.04)}
.pi-q:nth-child(2){background:rgba(133,86,247,.10);color:var(--lav)}
.pi-dot{position:absolute;transform:translate(-50%,50%);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#141112;font:700 11px var(--f-mono);box-shadow:0 0 0 2px rgba(7,6,6,.8),0 0 12px rgba(206,174,49,.5)}
.report-box{width:100%;min-height:380px;border:1px solid var(--line);background:rgba(7,6,6,.55);border-radius:12px;padding:16px;color:var(--ink);font:12.5px/1.6 var(--f-mono);resize:vertical}
.pm-charter{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.pm-charter{grid-template-columns:minmax(0,1fr)}}
.chk input{width:auto !important;flex:none}
.chk{display:inline-flex !important;align-items:center;gap:8px;text-transform:none !important;letter-spacing:0 !important;font:500 13px var(--f-body) !important;color:var(--ink) !important;cursor:pointer}
.empty-row{text-align:center;padding:22px !important}
@media (max-width:980px){.pm-wrap{grid-template-columns:minmax(0,1fr)}.pm-nav{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none}.pm-nav button{white-space:nowrap;flex:none}}
@media (max-width:700px){.pm-top{grid-template-columns:minmax(0,1fr)}.heat,.pi-grid{max-width:300px}}

        <div class="card-b" id="focus"></div>
      </div>
    </div>
  </section>

  <section class="panel" id="tab-gantt" role="tabpanel" hidden>

      <div class="card-h">
        <div class="seg" role="group" id="gMode">
          <button type="button" id="g-summary" data-mode="summary"></button>
          <button type="button" id="g-master" data-mode="master"></button>
        </div>

          <div class="seg" role="group" id="gZoom">
            <button type="button" id="z-s" data-z="8">S</button>

            <button type="button" id="z-l" data-z="26">L</button>
          </div>

          <label><input type="checkbox" id="optCrit" checked> <span data-i="showCrit"></span></label>

      <div class="card-b"><div class="legend" id="gLegend"></div></div>
    </div>
  </section>

  <section class="panel" id="tab-tasks" role="tabpanel" hidden>
    <div class="stack">
      <div class="card" id="tf-card">
        <div class="card-h"><h2 id="edTitle"></h2><span class="hint" data-i="edHint"></span></div>
        <form class="card-b" id="taskForm" novalidate>
          <div class="form">
            <div class="f"><label for="tf-id">ID</label><input id="tf-id" maxlength="16" required></div>
            <div class="f"><label for="tf-phase" data-i="phase"></label><select id="tf-phase"></select></div>
            <div class="f"><label for="tf-owner" data-i="owner"></label><input id="tf-owner" maxlength="24"></div>
            <div class="f"><label for="tf-points" data-i="points"></label><input id="tf-points" type="number" min="0" max="999" step="1" value="3"></div>
            <div class="f wide"><label for="tf-fr" data-i="nameFr"></label><input id="tf-fr" maxlength="120" required></div>
            <div class="f wide"><label for="tf-en" data-i="nameEn"></label><input id="tf-en" maxlength="120"></div>
            <div class="f"><label for="tf-start" data-i="start"></label><input id="tf-start" type="date" required></div>
            <div class="f"><label for="tf-end" data-i="end"></label><input id="tf-end" type="date" required></div>
            <div class="f"><label for="tf-progress"><span data-i="progress"></span> <span id="tf-pv" class="num"></span></label><input id="tf-progress" type="range" min="0" max="100" step="5" value="0"></div>

            <div class="f wide"><label for="tf-deps" data-i="deps"></label><input id="tf-deps" maxlength="200" placeholder="T1, T4"></div>

            <button class="btn" type="button" id="tfCancel" data-i="cancel"></button>
            <span class="err" id="tfErr" role="alert"></span>
          </div>
        </form>
      </div>

        <div class="card-h"><h2 data-i="taskList"></h2><span class="hint" id="taskCount"></span></div>
        <div class="tbl-wrap"><table id="taskTable"></table></div>
      </div>
    </div>
  </section>

            <div class="f"><label for="pf-code" data-i="projCode"></label><input id="pf-code" maxlength="24"></div>

          <div class="actions"><span id="docMsg" role="status"></span></div></div>

        <div class="card-h"><h2 data-i="phases"></h2><button class="btn sm" type="button" id="addPhase" data-i="addPhase"></button></div>
        <div class="card-b"><div class="edit-rows" id="phaseRows"></div>
          <div class="actions"><button class="btn pri" type="button" id="savePhases" data-i="save"></button><span class="err" id="phErr" role="alert"></span></div></div>

      <div class="card">

            <button class="btn danger" type="button" id="btnBlank" data-i="newBlank"></button>
