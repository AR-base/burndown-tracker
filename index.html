<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bilingual FR/EN burndown and Gantt tracker for any project">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Project Burndown Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: planning-office console — sticky command bar, KPI strip, tabbed work surface (charts scroll inside their own frames) */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --sunk:#f7f8fb; --ink:#142033; --muted:#596579; --line:#d7dde6; --grid:#e9edf3;
  --accent:#1f56f0; --accent-soft:rgba(31,86,240,.10); --ideal:#8f9bb0;
  --good:#16865a; --warn:#b86e00; --bad:#c42f3a; --good-soft:rgba(22,134,90,.12); --warn-soft:rgba(184,110,0,.13); --bad-soft:rgba(196,47,58,.12);
  --f-display:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131c; --surface:#141c28; --sunk:#111823; --ink:#e5ebf4; --muted:#93a0b4; --line:#2a3546; --grid:#1d2734;
  --accent:#7097ff; --accent-soft:rgba(112,151,255,.14); --ideal:#6c7a91;
  --good:#3cc489; --warn:#eaa53b; --bad:#f2636f; --good-soft:rgba(60,196,137,.14); --warn-soft:rgba(234,165,59,.15); --bad-soft:rgba(242,99,111,.15);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d131c; --surface:#141c28; --sunk:#111823; --ink:#e5ebf4; --muted:#93a0b4; --line:#2a3546; --grid:#1d2734;
  --accent:#7097ff; --accent-soft:rgba(112,151,255,.14); --ideal:#6c7a91;
  --good:#3cc489; --warn:#eaa53b; --bad:#f2636f; --good-soft:rgba(60,196,137,.14); --warn-soft:rgba(234,165,59,.15); --bad-soft:rgba(242,99,111,.15);
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* command bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 280px}
.eyebrow{font:600 11px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.brand h1{font:700 22px/1.15 var(--f-display);margin:2px 0 0;text-wrap:balance;overflow-wrap:anywhere}
.brand .meta{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font:600 12.5px/1 var(--f-display);letter-spacing:.04em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font:600 12px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-on{color:var(--good);background:var(--good-soft)} .st-risk{color:var(--warn);background:var(--warn-soft)} .st-late{color:var(--bad);background:var(--bad-soft)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:16px}
.kpi{background:var(--surface);padding:12px 14px;min-width:0}
.kpi .k{font:600 11px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:500 24px/1.2 var(--f-mono);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--muted)}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.meter{height:4px;background:var(--grid);border-radius:2px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

/* tabs */
.tabs{display:flex;gap:4px;margin-top:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font:600 14px/1 var(--f-display);letter-spacing:.03em;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{padding-block:16px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-h h2{font:700 16px/1.2 var(--f-display);margin:0;letter-spacing:.01em}
.card-b{padding:14px}
.hint{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* chart */
.chart-box{position:relative}
.chart-box svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top:2px solid}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font:12px/1.4 var(--f-mono);padding:6px 8px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-110%)}
.tip[hidden]{display:none!important}

/* lists */
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mini li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--grid)}
.mini li:last-child{border-bottom:0}
.tid{font:500 12px var(--f-mono);color:var(--muted)}
.chip{display:inline-block;padding:2px 8px;border-radius:4px;font:600 11.5px/1.4 var(--f-display);letter-spacing:.03em;white-space:nowrap}
.c-done{background:var(--good-soft);color:var(--good)} .c-late{background:var(--bad-soft);color:var(--bad)}
.c-inprog{background:var(--accent-soft);color:var(--accent)} .c-todo{background:var(--grid);color:var(--muted)}
.sec-t{font:600 12px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.sec-t:first-child{margin-top:0}

/* gantt */
.g-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.g-tools label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.gantt{display:grid;grid-template-columns:minmax(150px,var(--lw,300px)) minmax(0,1fr)}
.g-left{border-right:1px solid var(--line);overflow:hidden}
.g-right{overflow-x:auto}
.g-left svg,.g-right svg{display:block}
@media (max-width:640px){.gantt{--lw:150px}}

/* table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 11.5px/1.2 var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:middle}
tr.phase-row td{background:var(--sunk);font:600 13px var(--f-display);letter-spacing:.03em}
td.r,th.r{text-align:right}
.pbar{width:80px;height:6px;background:var(--grid);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.pbar i{display:block;height:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;cursor:pointer;font:600 13px/1.2 var(--f-display);letter-spacing:.03em}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font:600 11.5px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:7px 9px;min-width:0;width:100%}
.f.wide{grid-column:1/-1}
.f textarea{font:12px/1.5 var(--f-mono);min-height:160px;resize:vertical}
.err{color:var(--bad);font-size:12.5px;min-height:1em}
.ok{color:var(--good);font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.edit-rows{display:flex;flex-direction:column;gap:8px}
.edit-row{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr) 120px auto;gap:8px;align-items:center}
.edit-row input{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:6px 8px;min-width:0;width:100%}
.edit-row input[type=color]{padding:2px;height:32px}
@media (max-width:640px){.edit-row{grid-template-columns:1fr 1fr}}
/* burndown hint */
.bd-hint{margin:0;padding:0 14px 12px}
.f select{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:7px 9px;min-width:0;width:100%}

/* assistant */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wiz{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.wiz{grid-template-columns:minmax(0,1fr)}}
.wiz-main{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.wiz-h{font:700 26px/1.15 var(--f-display);margin:0;text-wrap:balance}
.wiz-lead{margin:0;color:var(--muted);max-width:62ch}
.wiz-input{width:100%;border:2px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:12px 14px;font:16px/1.5 var(--f-body);resize:vertical;min-height:84px}
.wiz-input:focus{border-color:var(--accent);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.wiz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.wiz-grid .f input,.wiz-grid .f select{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
.lbl{font:600 11.5px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wiz-grid .seg{width:100%}.wiz-grid .seg button{flex:1;padding:8px 6px}
.wiz-detect{margin:0;font-size:13px;color:var(--muted);min-height:1.2em}
.wiz-detect b{color:var(--ink)}
.wiz-go{padding:10px 18px;font-size:15px}
.wiz-ai{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.wiz-steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.wiz-steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 48px;position:relative;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.wiz-steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font:600 12px/22px var(--f-mono);text-align:center}
.wiz-steps b{color:var(--ink);font:600 14px var(--f-display)}
.wiz-res{margin-top:16px;border-color:var(--accent)}
.wiz-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:0 0 4px}
.wiz-stats div{min-width:0}.wiz-stats dt{font:600 11px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wiz-stats dd{margin:4px 0 0;font:500 17px/1.3 var(--f-mono);overflow-wrap:anywhere}

/* download menu */
.dl{position:relative}
.dl-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px}
.dl-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:290px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(20,32,51,.18);padding:6px}
.dl-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;background:none;padding:8px 10px;border-radius:4px;cursor:pointer;text-align:left;font-size:13.5px}
.dl-menu button:hover,.dl-menu button:focus-visible{background:var(--sunk)}
.dl-menu small{font:500 11px var(--f-mono);color:var(--muted)}
.dl-h{font:600 11px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 10px 4px}
.dl-note{font-size:11.5px;color:var(--muted);margin:6px 10px 2px}
.dl-status{font-size:12px;margin:4px 10px 4px;color:var(--good);overflow-wrap:anywhere}
.dl-status:empty{display:none}
.dl-status.err{color:var(--bad)}
.doc-ta{min-height:96px !important;font:12.5px/1.5 var(--f-body) !important}
@media (prefers-reduced-motion:no-preference){.meter i,.pbar i{transition:width .4s ease}}
</style>

<header class="bar">
  <div class="wrap">
    <div class="brand">
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="pName"></h1>
      <span class="meta" id="pMeta"></span>
    </div>
    <span class="pill" id="pStatus"></span>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" id="lang-fr" data-lang="fr">FR</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </div>
    <button class="btn" type="button" id="newBtn"><span aria-hidden="true">+</span> <span data-i="newProject"></span></button>
    <div class="dl" id="dl">
      <button class="btn pri dl-btn" type="button" id="dlBtn" aria-haspopup="true" aria-expanded="false" aria-controls="dlMenu">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1v9m0 0L4.5 6.5M8 10l3.5-3.5M2 12v2h12v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i="download"></span></button>
      <div class="dl-menu" id="dlMenu" role="menu" hidden>
        <p class="dl-h" data-i="dlDocs"></p>
        <button type="button" role="menuitem" data-dl="needs"><span data-i="dlNeeds"></span><small>.docx</small></button>
        <button type="button" role="menuitem" data-dl="technical"><span data-i="dlTech"></span><small>.docx</small></button>
        <button type="button" role="menuitem" data-dl="report"><span data-i="dlReport"></span><small>.docx</small></button>
        <p class="dl-h" data-i="dlImgs"></p>
        <button type="button" role="menuitem" data-dl="gs"><span data-i="dlGs"></span><small>.png</small></button>
        <button type="button" role="menuitem" data-dl="gm"><span data-i="dlGm"></span><small>.png</small></button>
        <button type="button" role="menuitem" data-dl="bd"><span data-i="dlBd"></span><small>.png</small></button>
        <button type="button" role="menuitem" data-dl="csv"><span data-i="dlCsv"></span><small>.csv</small></button>
        <button type="button" role="menuitem" data-dl="json"><span data-i="dlJson"></span><small>.json</small></button>
        <p class="dl-note" data-i="dlLang"></p>
        <p class="dl-note" id="dlFrameNote" data-i="dlFrame" hidden></p>
        <p class="dl-status" id="dlStatus" role="status"></p>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="kpis" id="kpis" aria-live="polite"></section>
  <nav class="tabs" role="tablist" id="tabs"></nav>

  <section class="panel" id="tab-assistant" role="tabpanel" hidden>
    <div class="wiz">
      <div class="wiz-main">
        <p class="eyebrow" data-i="wzEyebrow"></p>
        <h2 class="wiz-h" data-i="wzTitle"></h2>
        <p class="wiz-lead" data-i="wzLead"></p>
        <label class="sr" for="wz-desc" data-i="wzTitle"></label>
        <textarea id="wz-desc" class="wiz-input" rows="3" maxlength="600"></textarea>
        <div class="chips" id="wzChips" aria-label="Examples"></div>
        <div class="wiz-grid">
          <div class="f"><label for="wz-client" data-i="wzClient"></label><input id="wz-client" maxlength="80"></div>
          <div class="f"><label for="wz-start" data-i="start"></label><input id="wz-start" type="date"></div>
          <div class="f"><label for="wz-type" data-i="wzType"></label><select id="wz-type"></select></div>
          <div class="f"><span class="lbl" id="wzSizeLbl" data-i="wzSize"></span>
            <div class="seg" role="group" aria-labelledby="wzSizeLbl" id="wzSize">
              <button type="button" id="sz-small" data-size="small"></button><button type="button" id="sz-medium" data-size="medium"></button><button type="button" id="sz-large" data-size="large"></button>
            </div></div>
        </div>
        <p class="wiz-detect" id="wzDetect" aria-live="polite"></p>
        <div class="actions">
          <button class="btn pri wiz-go" id="wzGo" type="button"></button>
          <label class="wiz-ai" id="wzAiWrap" hidden><input type="checkbox" id="wzAi" checked> <span data-i="wzAi"></span></label>
          <span id="wzMsg" role="status"></span>
        </div>
      </div>
      <ol class="wiz-steps" aria-label="Steps">
        <li><b data-i="wzS1"></b><span data-i="wzS1d"></span></li>
        <li><b data-i="wzS2"></b><span data-i="wzS2d"></span></li>
        <li><b data-i="wzS3"></b><span data-i="wzS3d"></span></li>
      </ol>
    </div>
    <div class="card wiz-res" id="wzResult" hidden>
      <div class="card-h"><h2 id="wzResTitle"></h2><button class="btn" id="wzUndo" type="button" data-i="wzUndo"></button></div>
      <div class="card-b">
        <dl class="wiz-stats" id="wzStats"></dl>
        <div class="actions">
          <button class="btn pri" type="button" data-wdl="needs"><span data-i="dlNeeds"></span> · .docx</button>
          <button class="btn pri" type="button" data-wdl="technical"><span data-i="dlTech"></span> · .docx</button>
          <button class="btn pri" type="button" data-wdl="report"><span data-i="dlReport"></span> · .docx</button>
          <button class="btn" type="button" id="wzSeeGantt" data-i="wzSeeGantt"></button>
          <button class="btn" type="button" id="wzEdit" data-i="wzEdit"></button>
        </div>
        <p class="dl-status" id="wzDlStatus" role="status"></p>
      </div>
    </div>
  </section>

  <section class="panel" id="tab-burndown" role="tabpanel">
    <div class="grid2">
      <div class="card">
        <div class="card-h"><h2 data-i="bdTitle"></h2><div class="legend" id="bdLegend"></div></div>
        <div class="card-b chart-box" id="bdBox"><div class="tip" id="bdTip" hidden></div></div>
        <p class="hint bd-hint" id="bdHint"></p>
      </div>
      <div class="card">
        <div class="card-h"><h2 data-i="focus"></h2></div>
        <div class="card-b" id="focus"></div>
      </div>
    </div>
  </section>

  <section class="panel" id="tab-gantt" role="tabpanel" hidden>
    <div class="card">
      <div class="card-h">
        <div class="seg" role="group" id="gMode">
          <button type="button" id="g-summary" data-mode="summary"></button>
          <button type="button" id="g-master" data-mode="master"></button>
        </div>
        <div class="g-tools">
          <div class="seg" role="group" id="gZoom">

<script>/* Core planning logic — pure functions, no DOM. Tested in core.test.js */
const Core = (() => {
  const DAY = 86400000;
  const ISO = /^\d{4}-\d{2}-\d{2}$/;
  const ID = /^[A-Za-z0-9_-]{1,16}$/;
  const HEX = /^#[0-9a-fA-F]{6}$/;

  function parseDate(s) {
    if (typeof s !== 'string' || !ISO.test(s)) return null;
    const [y, m, d] = s.split('-').map(Number);
    const t = Date.UTC(y, m - 1, d);
    const dt = new Date(t);
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
    return t;
  }
  const fmt = t => new Date(t).toISOString().slice(0, 10);
  const addDays = (t, n) => t + n * DAY;
  const diffDays = (a, b) => Math.round((b - a) / DAY);
  const isWeekend = t => { const w = new Date(t).getUTCDay(); return w === 0 || w === 6; };
  function workDays(a, b) { // working days in (a, b]
    let n = 0;
    for (let t = addDays(a, 1); t <= b; t = addDays(t, 1)) if (!isWeekend(t)) n++;
    return n;
  }
  const str = (v, max) => (typeof v === 'string' ? v.trim().slice(0, max) : '');
  const num = (v, lo, hi, dflt) => { const n = Number(v); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : dflt; };

  /* Validate + normalise an untrusted project object. Returns {ok, errors, project}. */
  function validateProject(raw) {
    const errors = [];
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return { ok: false, errors: ['root'], project: null };
    const p = {
      name: str(raw.name, 120) || 'Untitled project',
      code: str(raw.code, 24),
      start: str(raw.start, 10), end: str(raw.end, 10),
      statusDate: str(raw.statusDate, 10),
      workingDays: raw.workingDays !== false,
      phases: [], milestones: [], tasks: [], docs: {},
      burnMode: raw.burnMode === 'done' ? 'done' : 'progress', history: {}
    };
    if (raw.history && typeof raw.history === 'object' && !Array.isArray(raw.history))
      Object.keys(raw.history).filter(k => parseDate(k) !== null).sort().slice(-1000).forEach(k => {
        const v = Number(raw.history[k]); if (Number.isFinite(v) && v >= 0 && v <= 1e6) p.history[k] = Math.round(v * 10) / 10;
      });
    const DOC_KEYS = ['author', 'sponsor', 'context', 'objectives', 'scope', 'stakeholders', 'functional', 'nonfunctional', 'constraints',
      'architecture', 'stack', 'security', 'testing', 'deployment', 'risks', 'conclusion'];
    if (raw.docs && typeof raw.docs === 'object' && !Array.isArray(raw.docs))
      DOC_KEYS.forEach(k => { if (typeof raw.docs[k] === 'string' && raw.docs[k].trim()) p.docs[k] = raw.docs[k].slice(0, 20000); });
    const ps = parseDate(p.start), pe = parseDate(p.end);
    if (ps === null) errors.push('start');
    if (pe === null) errors.push('end');
    if (ps !== null && pe !== null && pe <= ps) errors.push('range');
    if (p.statusDate && parseDate(p.statusDate) === null) errors.push('statusDate');

    const phases = Array.isArray(raw.phases) ? raw.phases.slice(0, 30) : [];
    const phaseIds = new Set();
    phases.forEach((ph, i) => {
      const id = str(ph && ph.id, 16);
      if (!ID.test(id) || phaseIds.has(id)) { errors.push(`phase:${i}`); return; }
      phaseIds.add(id);
      p.phases.push({ id, fr: str(ph.fr, 80) || id, en: str(ph.en, 80) || str(ph.fr, 80) || id, color: HEX.test(ph.color) ? ph.color : '#5b6cff' });
    });

    const ms = Array.isArray(raw.milestones) ? raw.milestones.slice(0, 50) : [];
    ms.forEach((m, i) => {
      const id = str(m && m.id, 16);
      if (!ID.test(id) || parseDate(m.date) === null) { errors.push(`milestone:${i}`); return; }
      p.milestones.push({ id, fr: str(m.fr, 80) || id, en: str(m.en, 80) || str(m.fr, 80) || id, date: m.date });
    });

    const ts = Array.isArray(raw.tasks) ? raw.tasks.slice(0, 300) : [];
    const taskIds = new Set();
    ts.forEach((t, i) => {
      const id = str(t && t.id, 16);
      const s = parseDate(t && t.start), e = parseDate(t && t.end);
      if (!ID.test(id) || taskIds.has(id) || s === null || e === null || e < s) { errors.push(`task:${i}`); return; }
      if (t.done && parseDate(t.done) === null) { errors.push(`task:${i}:done`); return; }
      taskIds.add(id);
      p.tasks.push({
        id, fr: str(t.fr, 120) || id, en: str(t.en, 120) || str(t.fr, 120) || id,
        phase: phaseIds.has(t.phase) ? t.phase : (p.phases[0] ? p.phases[0].id : ''),
        owner: str(t.owner, 24), start: t.start, end: t.end,
        points: num(t.points, 0, 999, 1),
        progress: t.done ? 100 : num(t.progress, 0, 100, 0),
        done: t.done || '',
        deps: (Array.isArray(t.deps) ? t.deps : []).map(d => str(d, 16)).filter(Boolean).slice(0, 20)
      });
    });
    p.tasks.forEach(t => { t.deps = t.deps.filter(d => taskIds.has(d) && d !== t.id); });
    if (topoOrder(p.tasks) === null) errors.push('cycle');
    return { ok: errors.length === 0, errors, project: p };
  }

  /* Kahn topological sort; null when the dependency graph has a cycle. */
  function topoOrder(tasks) {
    const indeg = new Map(tasks.map(t => [t.id, 0]));
    const succ = new Map(tasks.map(t => [t.id, []]));
    tasks.forEach(t => t.deps.forEach(d => { if (succ.has(d)) { succ.get(d).push(t.id); indeg.set(t.id, indeg.get(t.id) + 1); } }));
    const q = tasks.filter(t => indeg.get(t.id) === 0).map(t => t.id);
    const out = [];
    while (q.length) {
      const id = q.shift(); out.push(id);
      succ.get(id).forEach(s => { indeg.set(s, indeg.get(s) - 1); if (indeg.get(s) === 0) q.push(s); });
    }
    return out.length === tasks.length ? out : null;
  }

  const totalPoints = p => p.tasks.reduce((a, t) => a + t.points, 0);
  function statusTime(p, todayT) {
    const s = parseDate(p.statusDate);
    return s !== null ? s : todayT;
  }
  const donePointsAt = (p, t) => p.tasks.reduce((a, k) => a + (k.done && parseDate(k.done) <= t ? k.points : 0), 0);
  const earned = p => p.tasks.reduce((a, k) => a + k.points * (k.done ? 1 : k.progress / 100), 0);

  /* Planned value at t: each task's points spread linearly over its duration (inclusive days). */
  function plannedAt(p, t) {
    return p.tasks.reduce((a, k) => {
      const s = parseDate(k.start), e = addDays(parseDate(k.end), 1);
      const f = t >= e ? 1 : t < s ? 0 : (addDays(t, 1) - s) / (e - s);
      return a + k.points * Math.min(1, Math.max(0, f));
    }, 0);
  }

  function idealAt(p, t) {
    const s = parseDate(p.start), e = parseDate(p.end), total = totalPoints(p);
    if (t <= s) return total;
    if (t >= e) return 0;
    if (p.workingDays) { const all = workDays(s, e); return all ? total * (1 - workDays(s, t) / all) : 0; }
    return total * (1 - diffDays(s, t) / diffDays(s, e));
  }

  /* Burndown: ideal series over the whole project, actual series up to the status date, and a forecast. */
  /* Remaining work at day t.
     'progress' mode (default): partial progress counts. Each save records a dated snapshot (p.history),
     so the line moves as soon as a task's % changes and keeps that history; days without a snapshot
     carry the last one forward, never above what completed tasks alone give.
     'done' mode: classic agile burndown, only completed tasks count. */
  function burndown(p, todayT) {
    const s = parseDate(p.start), e = parseDate(p.end), total = totalPoints(p);
    const now = Math.max(statusTime(p, todayT), s);
    const prog = p.burnMode !== 'done';
    const hist = Object.entries(p.history || {}).map(([d, v]) => [parseDate(d), v]).filter(([t]) => t !== null).sort((a, b) => a[0] - b[0]);
    const remainingNowProg = total - earned(p);
    const at = t => {
      const doneR = total - donePointsAt(p, t);
      if (!prog) return doneR;
      if (t === now) return Math.min(doneR, remainingNowProg);
      let last = null;
      for (const [ht, v] of hist) { if (ht <= t) last = v; else break; }
      return last === null ? doneR : Math.min(doneR, last);
    };
    const ideal = [], actual = [];
    for (let t = s; t <= e; t = addDays(t, 1)) ideal.push({ t, v: idealAt(p, t) });
    for (let t = s; t <= now; t = addDays(t, 1)) actual.push({ t, v: Math.round(at(t) * 10) / 10 });
    const done = donePointsAt(p, now);
    const remaining = Math.max(0, at(now));
    const burned = total - remaining;
    const elapsed = Math.max(1, diffDays(s, now));
    const velocityDay = burned / elapsed;
    let forecast = null;
    if (remaining <= 0.0001) {
      const dates = p.tasks.filter(k => k.done).map(k => parseDate(k.done));
      forecast = dates.length ? Math.max(...dates) : now;
    } else if (velocityDay > 0) forecast = addDays(now, Math.ceil(remaining / velocityDay));
    const daysLeft = Math.max(1, diffDays(now, e));
    return {
      total, done, remaining, now, ideal, actual, mode: prog ? 'progress' : 'done',
      idealNow: idealAt(p, now),
      velocityWeek: velocityDay * 7,
      requiredWeek: remaining / daysLeft * 7,
      forecast
    };
  }

  /* Snapshot of today's remaining work, kept for the burndown history (max 1000 days). */
  function recordHistory(p, t) {
    const h = { ...(p.history || {}) };
    h[fmt(t)] = Math.round((totalPoints(p) - earned(p)) * 10) / 10;
    const keys = Object.keys(h).sort();
    return Object.fromEntries(keys.slice(-1000).map(k => [k, h[k]]));
  }

  function health(p, todayT) {
    const now = statusTime(p, todayT);
    const pv = plannedAt(p, now), ev = earned(p), total = totalPoints(p);
    // Before the first planned finish nothing is due yet: the project cannot be late.
    const firstEnd = p.tasks.length ? Math.min(...p.tasks.map(k => parseDate(k.end))) : Infinity;
    const spi = now < firstEnd ? 1 : pv > 0 ? ev / pv : 1;
    const status = spi >= 0.95 ? 'on' : spi >= 0.8 ? 'risk' : 'late';
    return { pv, ev, spi, status, pctEarned: total ? ev / total : 0, pctPlanned: total ? pv / total : 0 };
  }

  /* Critical path from fixed dates: float = latest allowed start − planned start (calendar days). */
  function criticalPath(p) {
    const order = topoOrder(p.tasks);
    if (!order || !p.tasks.length) return { critical: new Set(), float: new Map() };
    const byId = new Map(p.tasks.map(t => [t.id, t]));
    const succ = new Map(p.tasks.map(t => [t.id, []]));
    p.tasks.forEach(t => t.deps.forEach(d => succ.get(d).push(t.id)));
    const projEnd = Math.max(parseDate(p.end), ...p.tasks.map(t => parseDate(t.end)));
    const ls = new Map(), fl = new Map();
    // Weekends are not slack: the latest finish snaps back to the previous working day,
    // and float is counted in working days when the project uses them.
    const prevWork = t => { let x = t; while (p.workingDays && isWeekend(x)) x = addDays(x, -1); return x; };
    [...order].reverse().forEach(id => {
      const t = byId.get(id), dur = diffDays(parseDate(t.start), parseDate(t.end));
      const lf = prevWork(succ.get(id).length ? Math.min(...succ.get(id).map(s => addDays(ls.get(s), -1))) : projEnd);
      ls.set(id, addDays(lf, -dur));
      const s0 = parseDate(t.start), l0 = ls.get(id);
      fl.set(id, p.workingDays ? (l0 >= s0 ? workDays(s0, l0) : -workDays(l0, s0)) : diffDays(s0, l0));
    });
    const minFloat = Math.min(...fl.values());
    // Critical = tasks sharing the minimum float, chained to a task without successors.
    const critical = new Set([...fl].filter(([, f]) => f <= Math.max(0, minFloat)).map(([id]) => id));
    return { critical, float: fl };
  }

  function phaseSpans(p) {
    return p.phases.map(ph => {
      const ts = p.tasks.filter(t => t.phase === ph.id);
      if (!ts.length) return { ...ph, start: null, end: null, points: 0, progress: 0, count: 0 };
      const pts = ts.reduce((a, t) => a + t.points, 0);
      const ev = ts.reduce((a, t) => a + t.points * t.progress / 100, 0);
      return {
        ...ph, count: ts.length, points: pts,
        start: fmt(Math.min(...ts.map(t => parseDate(t.start)))),
        end: fmt(Math.max(...ts.map(t => parseDate(t.end)))),
        progress: pts ? ev / pts : ts.every(t => t.done) ? 1 : 0
      };
    });
  }

  /* Wouldn't adding `dep` before `taskId` create a cycle? */
  function createsCycle(tasks, taskId, deps) {
    const copy = tasks.map(t => ({ id: t.id, deps: t.id === taskId ? deps : t.deps }));
    if (!copy.some(t => t.id === taskId)) copy.push({ id: taskId, deps });
    return topoOrder(copy) === null;
  }

  /* Finish-to-start violations: a task starting on/before a predecessor's end. */
  function depViolations(p) {
    const byId = new Map(p.tasks.map(t => [t.id, t]));
    const out = [];
    p.tasks.forEach(t => t.deps.forEach(d => { if (parseDate(t.start) <= parseDate(byId.get(d).end)) out.push([d, t.id]); }));
    return out;
  }

  return { DAY, parseDate, fmt, addDays, diffDays, isWeekend, workDays, validateProject, topoOrder, totalPoints,
    statusTime, donePointsAt, earned, plannedAt, idealAt, burndown, recordHistory, health, criticalPath, phaseSpans, createsCycle, depViolations };
})();
if (typeof module !== 'undefined') module.exports = Core;
</script>
<script>/* Gantt interchange: CSV (Excel / Google Sheets / MS Project / GanttProject exports) and Mermaid gantt.
   Every parser returns a RAW project object that still goes through Core.validateProject. */
const GanttIO = (() => {
  const C = (typeof Core !== 'undefined') ? Core : require('./core.js');
  const PALETTE = ['#4f6bed', '#0f9d8a', '#d9811e', '#c2417a', '#7a5af5', '#5f7182', '#2f8fd6', '#a15c2b'];
  const MAX = 2e6;

  /* ---- dates: 2026-10-05 | 05/10/2026 | 5/10/26 | 05.10.2026 (day first, French/European) ---- */
  function toIso(v) {
    if (typeof v !== 'string') return null;
    const s = v.trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return iso(+m[1], +m[2], +m[3]);
    m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
    if (m) return iso(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2], +m[1]);
    return null;
  }
  function iso(y, mo, d) {
    const s = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    return C.parseDate(s) === null ? null : s;
  }
  const workDur = (s, e) => Math.max(1, C.workDays(C.addDays(C.parseDate(s), -1), C.parseDate(e)));
  const nextWork = t => { let x = t; while (C.isWeekend(x)) x = C.addDays(x, 1); return x; };
  const splitName = n => { const i = n.indexOf(' / '); return i > 0 ? [n.slice(0, i).trim(), n.slice(i + 3).trim()] : [n.trim(), n.trim()]; };
  const safeId = (s, prefix, i) => { const c = String(s || '').trim().replace(/[^A-Za-z0-9_-]/g, '').slice(0, 16); return c || `${prefix}${i}`; };

  /* ---- CSV ---- */
  function parseCSV(text) {
    const first = text.split(/\r?\n/, 1)[0] || '';
    const counts = [';', ',', '\t'].map(d => [d, first.split(d).length]);
    const delim = counts.sort((a, b) => b[1] - a[1])[0][0];
    const rows = []; let row = [], cell = '', q = false;

    const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdFooter" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>${media.map((_, i) => `<Relationship Id="rIdImg${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/figure${i + 1}.png"/>`).join('')}</Relationships>`;

    const files = [
      { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>` },
      { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>` },
      { name: 'docProps/core.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${x(meta.title)}</dc:title><dc:creator>${x(meta.author || '')}</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created></cp:coreProperties>` },
      { name: 'word/document.xml', data: doc },
      { name: 'word/styles.xml', data: STYLES },
      { name: 'word/footer1.xml', data: footer },
      { name: 'word/_rels/document.xml.rels', data: rels },
      ...media.map((m, i) => ({ name: `word/media/figure${i + 1}.png`, data: m }))
    ];
    return zip(files);
  }

  /* ---------- free-text fields → blocks ("- " bullets, "a | b" tables, "## " subheadings) ---------- */
  function textBlocks(text) {
    const out = []; let buf = [], tbl = [];
    const flush = () => { if (buf.length) out.push({ k: 'bullets', items: buf }); buf = []; if (tbl.length) out.push({ k: 'table', rows: tbl }); tbl = []; };
    String(text || '').split(/\r?\n/).forEach(raw => {
      const l = raw.trim();
      if (!l) return flush();
      if (/^#{2,3}\s/.test(l)) { flush(); out.push({ k: 'h2', t: l.replace(/^#+\s*/, '') }); }
      else if (/^[-*•]\s+/.test(l)) { if (tbl.length) flush(); buf.push(l.replace(/^[-*•]\s+/, '')); }
      else if (l.includes(' | ') || /^\|.*\|$/.test(l)) {
        if (buf.length) flush();
        if (/^\|?\s*:?-{2,}/.test(l)) return; // markdown separator row
        tbl.push(l.replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
      } else { flush(); out.push({ k: 'p', t: l }); }
    });
    flush();
    return out;
  }

  const FIELDS = [
    ['context', 'Contexte et problème', 'Context and problem'],
    ['objectives', 'Objectifs et indicateurs', 'Objectives and KPIs'],
    ['scope', 'Périmètre', 'Scope'],
    ['stakeholders', 'Parties prenantes', 'Stakeholders'],
    ['functional', 'Exigences fonctionnelles', 'Functional requirements'],
    ['nonfunctional', 'Exigences non fonctionnelles', 'Non-functional requirements'],
    ['constraints', 'Contraintes et hypothèses', 'Constraints and assumptions'],
    ['architecture', 'Architecture technique', 'Technical architecture'],
    ['stack', 'Stack et choix techniques', 'Stack and technical choices'],
    ['security', 'Sécurité et conformité', 'Security and compliance'],
    ['testing', 'Stratégie de test', 'Test strategy'],
    ['deployment', 'Déploiement et exploitation', 'Deployment and operations'],
    ['risks', 'Risques', 'Risks'],
    ['conclusion', 'Conclusion et prochaines étapes', 'Conclusion and next steps']
  ];
  const DOCS = {
    needs: { fr: 'Cahier des charges', en: 'Requirements specification', fields: ['context', 'objectives', 'scope', 'stakeholders', 'functional', 'nonfunctional', 'constraints'], plan: 'summary', status: false },
    technical: { fr: 'Dossier technique', en: 'Technical document', fields: ['architecture', 'stack', 'security', 'testing', 'deployment', 'risks'], plan: 'full', status: false },
    report: { fr: 'Rapport de projet complet', en: 'Full project report', fields: FIELDS.map(f => f[0]).filter(k => k !== 'conclusion'), plan: 'full', status: true }
  };
  const L = {
    fr: { card: 'Fiche projet', field: 'Champ', value: 'Valeur', name: 'Projet', code: 'Code', period: 'Période', effort: 'Charge', tasks: 'tâches', pts: 'points', phases: 'phases', ms: 'jalons',
      author: 'Auteur / chef de projet', sponsor: 'Sponsor / client', schedule: 'Planning', phaseT: 'Phases', phase: 'Phase', start: 'Début', end: 'Fin', progress: 'Avancement', msT: 'Jalons et livrables', id: 'ID',
      milestone: 'Jalon', date: 'Date', task: 'Tâche', owner: 'Resp.', deps: 'Dépend de', st: 'Statut', summaryG: 'Gantt synthétique', masterG: 'Gantt maître', wbs: 'Structure de découpage (WBS)',
      crit: 'Chemin critique (marge nulle)', critTxt: 'Tout retard sur ces tâches décale la date de fin', exec: 'Résumé', statusT: 'État d’avancement', metric: 'Indicateur', kpiDone: 'Points terminés',
      kpiEarned: 'Avancement acquis / prévu', kpiSpi: 'SPI (valeur acquise ÷ planifiée)', kpiVel: 'Vélocité / requise', kpiFc: 'Fin prévue', perWk: 'pts/sem', bd: 'Burndown', snap: 'Historique hebdomadaire',
      ideal: 'Idéal (reste)', actual: 'Réel (reste)', gap: 'Écart', watch: 'À surveiller', late: 'En retard', inprog: 'En cours', none: 'Aucune', todo: 'À compléter dans Projet → Contenu des documents.',
      statusW: { on: 'dans les temps', risk: 'à risque', late: 'en retard' }, sDone: 'Terminée', sLate: 'En retard', sIn: 'En cours', sTodo: 'À faire', generated: 'Généré le', asOf: 'Date d’état', days: 'jours',
      conclusion: 'Conclusion et prochaines étapes', noVel: 'pas encore de vélocité', fig: 'Figure' },
    en: { card: 'Project card', field: 'Field', value: 'Value', name: 'Project', code: 'Code', period: 'Period', effort: 'Effort', tasks: 'tasks', pts: 'points', phases: 'phases', ms: 'milestones',
      author: 'Author / project manager', sponsor: 'Sponsor / client', schedule: 'Schedule', phaseT: 'Phases', phase: 'Phase', start: 'Start', end: 'End', progress: 'Progress', msT: 'Milestones and deliverables', id: 'ID',
      milestone: 'Milestone', date: 'Date', task: 'Task', owner: 'Owner', deps: 'Depends on', st: 'Status', summaryG: 'Summary Gantt', masterG: 'Master Gantt', wbs: 'Work breakdown structure (WBS)',
      crit: 'Critical path (zero float)', critTxt: 'Any delay on these tasks moves the finish date', exec: 'Executive summary', statusT: 'Status report', metric: 'Metric', kpiDone: 'Points done',
      kpiEarned: 'Earned / planned progress', kpiSpi: 'SPI (earned ÷ planned value)', kpiVel: 'Velocity / required', kpiFc: 'Forecast finish', perWk: 'pts/wk', bd: 'Burndown', snap: 'Weekly history',
      ideal: 'Ideal (remaining)', actual: 'Actual (remaining)', gap: 'Gap', watch: 'Watch list', late: 'Late', inprog: 'In progress', none: 'None', todo: 'To be completed in Project → Document content.',
      statusW: { on: 'on track', risk: 'at risk', late: 'late' }, sDone: 'Done', sLate: 'Late', sIn: 'In progress', sTodo: 'To do', generated: 'Generated on', asOf: 'Status date', days: 'days',
      conclusion: 'Conclusion and next steps', noVel: 'no velocity yet', fig: 'Figure' }
  };
  const dfmt = (t, lang) => new Date(t).toLocaleDateString(lang === 'fr' ? 'fr-FR' : 'en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'UTC' });
  const num = (v, lang, d = 1) => v.toFixed(d).replace('.', lang === 'fr' ? ',' : '.');

  /* Assemble one document. imgs = {summary, master, burndown} each {bytes,w,h} or undefined. */
  function assemble(kind, P, lang, todayT, imgs = {}) {
    const T = L[lang], spec = DOCS[kind], nm = o => (lang === 'fr' ? o.fr : o.en) || o.fr || o.en || o.id;
    const docs = P.docs || {}, now = C.statusTime(P, todayT), b = C.burndown(P, todayT), h = C.health(P, todayT), cp = C.criticalPath(P);
    const st = k => k.done ? T.sDone : C.parseDate(k.end) < now ? T.sLate : C.parseDate(k.start) <= now ? T.sIn : T.sTodo;
    const out = []; let sec = 0, fig = 0;
    const H1 = t => out.push({ k: 'h1', t: `${++sec}. ${t}` });
    const IMG = (img, cap) => { if (img && img.bytes) { out.push({ k: 'img', img }); out.push({ k: 'caption', t: `${T.fig} ${++fig} — ${cap}` }); } };
    out.push({ k: 'title', t: `${P.name} — ${spec[lang]}` });
    out.push({ k: 'subtitle', t: `${P.code ? P.code + ' · ' : ''}${dfmt(C.parseDate(P.start), lang)} → ${dfmt(C.parseDate(P.end), lang)} · ${T.generated} ${dfmt(todayT, lang)}${docs.author ? ' · ' + docs.author : ''}` });
    if (spec.status) {
      out.push({ k: 'h1', t: T.exec });
      const pct = b.total ? Math.round(b.done / b.total * 100) : 0, slip = b.forecast !== null ? C.diffDays(C.parseDate(P.end), b.forecast) : null;
      const firstEnd = P.tasks.length ? Math.min(...P.tasks.map(k => C.parseDate(k.end))) : Infinity;
      if (b.done === 0 && now < firstEnd) out.push({ k: 'p', t: lang === 'fr'
        ? `Le projet démarre le ${dfmt(C.parseDate(P.start), lang)} et se termine le ${dfmt(C.parseDate(P.end), lang)} : ${P.tasks.length} tâches, ${b.total} points d’effort, ${P.milestones.length} jalons. Le suivi (burndown, SPI, fin prévue) se met à jour dès que les premières tâches sont terminées.`
        : `The project starts on ${dfmt(C.parseDate(P.start), lang)} and ends on ${dfmt(C.parseDate(P.end), lang)}: ${P.tasks.length} tasks, ${b.total} effort points, ${P.milestones.length} milestones. Tracking (burndown, SPI, forecast) updates as soon as the first tasks are done.` });
      else out.push({ k: 'p', t: lang === 'fr'
        ? `Au ${dfmt(now, lang)}, ${b.done} points sur ${b.total} sont terminés (${pct} %) ; SPI ${num(h.spi, lang, 2)} : le projet est **${T.statusW[h.status]}**. ${b.forecast !== null ? `La fin prévue au rythme actuel est le ${dfmt(b.forecast, lang)} (${slip > 0 ? '+' : ''}${slip} jours par rapport au ${dfmt(C.parseDate(P.end), lang)}).` : 'Aucune vélocité mesurée pour l’instant.'} Vélocité : ${num(b.velocityWeek, lang)} pts/sem, requise : ${num(b.requiredWeek, lang)} pts/sem.`
        : `As of ${dfmt(now, lang)}, ${b.done} of ${b.total} points are done (${pct}%); SPI ${num(h.spi, lang, 2)}: the project is **${T.statusW[h.status]}**. ${b.forecast !== null ? `At the current pace it finishes on ${dfmt(b.forecast, lang)} (${slip > 0 ? '+' : ''}${slip} days vs ${dfmt(C.parseDate(P.end), lang)}).` : 'No velocity measured yet.'} Velocity: ${num(b.velocityWeek, lang)} pts/wk, required: ${num(b.requiredWeek, lang)} pts/wk.` });
      if (docs.context) out.push(...textBlocks(docs.context).slice(0, 1));
    }
    H1(T.card);
    out.push({ k: 'table', rows: [[T.field, T.value], [T.name, P.name], ...(P.code ? [[T.code, P.code]] : []), ...(docs.author ? [[T.author, docs.author]] : []), ...(docs.sponsor ? [[T.sponsor, docs.sponsor]] : []),
      [T.period, `${dfmt(C.parseDate(P.start), lang)} → ${dfmt(C.parseDate(P.end), lang)}`], [T.effort, `${b.total} ${T.pts} · ${P.tasks.length} ${T.tasks} · ${P.phases.length} ${T.phases} · ${P.milestones.length} ${T.ms}`]] });
    const fieldName = key => { const f = FIELDS.find(f => f[0] === key); return lang === 'fr' ? f[1] : f[2]; };
    const textSection = key => { H1(fieldName(key)); const bl = textBlocks(docs[key]); if (bl.length) out.push(...bl); else out.push({ k: 'note', t: T.todo }); };
    const before = spec.fields.filter(k => k !== 'risks');
    before.forEach(textSection);
    // schedule
    H1(T.schedule);
    const spans = C.phaseSpans(P).filter(s => s.start);
    out.push({ k: 'h2', t: T.phaseT });
    out.push({ k: 'table', rows: [[T.id, T.phase, T.start, T.end, T.pts, T.progress], ...spans.map(s => [s.id, nm(s), dfmt(C.parseDate(s.start), lang), dfmt(C.parseDate(s.end), lang), String(s.points), Math.round(s.progress * 100) + ' %'])] });
    if (P.milestones.length) { out.push({ k: 'h2', t: T.msT }); out.push({ k: 'table', rows: [[T.id, T.milestone, T.date], ...P.milestones.map(m => [m.id, nm(m), dfmt(C.parseDate(m.date), lang)])] }); }
    out.push({ k: 'h2', t: T.summaryG }); IMG(imgs.summary, T.summaryG);
    if (spec.plan === 'full') {
      out.push({ k: 'h2', t: T.masterG }); IMG(imgs.master, T.masterG);
      out.push({ k: 'h2', t: T.wbs });
      out.push({ k: 'table', rows: [[T.id, T.task, T.owner, T.start, T.end, 'Pts', T.deps, T.st], ...P.tasks.map(k => [k.id, nm(k), k.owner, dfmt(C.parseDate(k.start), lang).slice(0, 5), dfmt(C.parseDate(k.end), lang).slice(0, 5), String(k.points), k.deps.join(', ') || '—', st(k)])] });
      const crit = P.tasks.filter(k => cp.critical.has(k.id)).map(k => k.id);
      out.push({ k: 'p', t: `**${T.crit} :** ${crit.join(' · ') || T.none}. ${T.critTxt}.` });
    }
    if (spec.fields.includes('risks')) textSection('risks');
    if (spec.status) {
      H1(T.statusT);
      out.push({ k: 'table', rows: [[T.metric, T.value],
        [T.asOf, dfmt(now, lang)],
        [T.kpiDone, `${b.done} / ${b.total}`],
        [T.kpiEarned, `${num(h.pctEarned * 100, lang)} % / ${num(h.pctPlanned * 100, lang)} %`],
        [T.kpiSpi, `${num(h.spi, lang, 2)} — ${T.statusW[h.status]}`],
        [T.kpiVel, `${num(b.velocityWeek, lang)} / ${num(b.requiredWeek, lang)} ${T.perWk}`],
        [T.kpiFc, b.forecast !== null ? dfmt(b.forecast, lang) : T.noVel]] });
      out.push({ k: 'h2', t: T.bd }); IMG(imgs.burndown, T.bd);
      const snaps = []; let f = C.parseDate(P.start); while (new Date(f).getUTCDay() !== 5) f = C.addDays(f, 1);
      for (; f <= now; f = C.addDays(f, 7)) snaps.push(f);
      if (snaps.at(-1) !== now) snaps.push(now);
      out.push({ k: 'h2', t: T.snap });
      out.push({ k: 'table', rows: [[T.date, T.ideal, T.actual, T.gap], ...snaps.reverse().slice(0, 10).map(s => { const i = C.idealAt(P, s), hit = b.actual.find(x => x.t === s), a = hit ? hit.v : b.total - C.donePointsAt(P, s); return [dfmt(s, lang), num(i, lang), num(a, lang), (a - i >= 0 ? '+' : '') + num(a - i, lang)]; })] });
      out.push({ k: 'h2', t: T.watch });
      const late = P.tasks.filter(k => !k.done && C.parseDate(k.end) < now), prog = P.tasks.filter(k => !k.done && C.parseDate(k.start) <= now && C.parseDate(k.end) >= now);
      out.push({ k: 'p', t: `**${T.late} :** ${late.map(k => `${k.id} ${nm(k)}`).join(' · ') || T.none}` });
      out.push({ k: 'p', t: `**${T.inprog} :** ${prog.map(k => `${k.id} ${nm(k)} (${k.progress} %)`).join(' · ') || T.none}` });
      H1(T.conclusion);
      const bl = textBlocks(docs.conclusion); if (bl.length) out.push(...bl); else out.push({ k: 'note', t: T.todo });
    }
    const fname = `${(P.code || P.name).replace(/[^\w\-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'projet'}-${spec[lang].replace(/[^\w\-]+/g, '-')}.docx`;
    return { bytes: build(out, { title: `${P.name} — ${spec[lang]}`, author: docs.author, footer: `${P.name} — ${spec[lang]}` }), name: fname, blocks: out };
  }
  return { zip, crc32, build, textBlocks, assemble, FIELDS, DOCS };
})();
if (typeof module !== 'undefined') module.exports = DocGen;
</script>

<script>/* Project assistant: plain-language description → full project (phases, tasks, dates, dependencies,
   milestones) + all document content. Pure functions; KB holds the knowledge per project type. */
const Generator = (() => {
  const C = (typeof Core !== 'undefined') ? Core : require('./core.js');
  const K = (typeof KB !== 'undefined') ? KB : require('./kb.js');
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, ' ').replace(/[^a-z0-9+\- ]/g, ' ').replace(/\s+/g, ' ').trim();
  const PHASES = [['P1', 'Cadrage', 'Initiation', '#4f6bed'], ['P2', 'Conception', 'Design', '#0f9d8a'], ['P3', 'Réalisation', 'Build', '#d9811e'],
    ['P4', 'Tests et recette', 'Testing and acceptance', '#c2417a'], ['P5', 'Mise en service', 'Go-live', '#7a5af5'], ['P6', 'Clôture', 'Closure', '#5f7182']];
  const SIZES = { small: { f: 0.7, prios: ['M'], lanes: 2 }, medium: { f: 1, prios: ['M', 'S'], lanes: 2 }, large: { f: 1.35, prios: ['M', 'S', 'C'], lanes: 2 } };

  /* ---- detection: weighted keyword match on the normalised text ---- */
  function detect(text) {
    const t = ' ' + norm(text) + ' ';
    const scores = K.filter(k => k.kw.length).map(k => {
      let s = 0;
      k.kw.forEach(w => { const n = norm(w); if (n && t.includes(' ' + n + ' ') || (n.length > 5 && t.includes(n))) s += 1 + n.split(' ').length; });
      return { id: k.id, score: s };
    }).sort((a, b) => b.score - a.score);
    const best = scores[0];
    return { id: best && best.score > 0 ? best.id : 'software', scores };
  }
  const type = id => K.find(k => k.id === id) || K.find(k => k.id === 'software');

  /* ---- working-day calendar ---- */
  const nextWork = t => { let x = t; while (C.isWeekend(x)) x = C.addDays(x, 1); return x; };
  const endAfter = (start, days) => { let x = nextWork(start), left = Math.max(1, days) - 1; while (left > 0) { x = C.addDays(x, 1); if (!C.isWeekend(x)) left--; } return x; };
  const nextMonday = t => { let x = C.addDays(t, 1); while (new Date(x).getUTCDay() !== 1) x = C.addDays(x, 1); return x; };

  /* ---- cleaned project name from the description ---- */
  function projectName(text, tp, lang) {
    let s = String(text || '').trim().replace(/\s+/g, ' ');
    const lead = /^(je (veux|voudrais|souhaite)|nous (voulons|souhaitons)|i (want|would like|need)( to)?|we (want|need)( to)?|j['’ ]ai besoin d['’ ]?(une?)?|to|creer|créer|create|build|develop|développer|developper|faire|make|realiser|réaliser|un|une|des|le|la|les|a|an|the)\s+/i;
    for (let i = 0; i < 5 && lead.test(s); i++) s = s.replace(lead, '');
    if (!s) return lang === 'fr' ? tp.fr : tp.en;
    s = s.charAt(0).toUpperCase() + s.slice(1);

    const tp = custom && custom.features ? { ...base, features: custom.features } : base;
    const s0 = nextWork(C.parseDate(start) ?? nextMonday(Date.now() - Date.now() % C.DAY));
    const dur = d => Math.max(1, Math.round(d * Z.f)), pts = p => Math.max(1, Math.round(p * (size === 'large' ? 1.3 : size === 'small' ? 0.8 : 1)));
    const tasks = []; let n = 0;
    const add = (phase, fr, en, owner, days, points, deps) => {
      const ds = deps.map(id => tasks.find(t => t.id === id));
      const st = ds.length ? nextWork(C.addDays(Math.max(...ds.map(t => C.parseDate(t.end))), 1)) : s0;
      const t = { id: `T${++n}`, phase, fr, en, owner, start: C.fmt(st), end: C.fmt(endAfter(st, days)), points, progress: 0, done: '', deps };
      tasks.push(t); return t.id;

    const feats = tp.features.filter(f => Z.prios.includes(f[6]));
    const lanes = Array.from({ length: Z.lanes }, () => null), featIds = [];
    feats.forEach((f, i) => {

  function fromAI(raw) {

    const str = (v, m) => typeof v === 'string' ? v.replace(/[|\n\r<>]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, m) : '';

    if (feats.length < 3) return null;
    if (!feats.some(f => f[6] === 'M')) feats.slice(0, 3).forEach(f => { f[6] = 'M'; });
    return { typeId: K.some(k => k.id === raw.typeId) ? raw.typeId : null, name: str(raw.name, 80) || null, features: feats };
  }

  }
  return { detect, build, fromAI, aiPrompt, types: () => K.map(k => ({ id: k.id, fr: k.fr, en: k.en })), norm };

/* ---------- burndown chart ---------- */
function renderBurndown() {
  const box = $('bdBox'), tip = $('bdTip');
  box.querySelectorAll('svg').forEach(s => s.remove());
  const b = C.burndown(P, todayT());
  const s = C.parseDate(P.start), e = C.parseDate(P.end);
  const xEnd = b.forecast !== null && b.forecast > e ? Math.min(b.forecast, C.addDays(e, 60)) : e;
  const W = 820, H = 380, m = { l: 48, r: 20, t: 28, b: 52 };
  const X = tm => m.l + (tm - s) / (xEnd - s) * (W - m.l - m.r);
  const ymax = Math.max(1, b.total) * 1.06;
  const Y = v => m.t + (1 - v / ymax) * (H - m.t - m.b);
  const step = [1, 2, 5, 10, 20, 25, 50, 100, 200, 500].find(x => ymax / x <= 6) || 1000;
  let g = '';
  for (let v = 0; v <= ymax; v += step) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${v}</text>`;
  // weekly x ticks (Mondays)
  let mon = s; while (new Date(mon).getUTCDay() !== 1) mon = C.addDays(mon, 1);
  const wkStep = Math.ceil(((xEnd - s) / C.DAY / 7) / 12);
  for (let tm = mon, i = 0; tm <= xEnd; tm = C.addDays(tm, 7), i++) {
    if (i % wkStep) continue;
    g += `<line x1="${X(tm)}" x2="${X(tm)}" y1="${H - m.b}" y2="${H - m.b + 5}" stroke="var(--line)"/><text x="${X(tm)}" y="${H - m.b + 18}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${esc(dLabel(tm))}</text>`;
  }
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--line)"/>`;
  if (xEnd > e) g += `<rect x="${X(e)}" y="${m.t}" width="${X(xEnd) - X(e)}" height="${H - m.t - m.b}" fill="var(--bad-soft)"/>`;
  // milestones on axis
  P.milestones.forEach(ms => { const tm = C.parseDate(ms.date); if (tm < s || tm > xEnd) return;
    g += `<path d="M${X(tm)} ${H - m.b + 26}l5 5l-5 5l-5 -5z" fill="var(--ink)"><title>${esc(ms.id + ' · ' + nm(ms) + ' · ' + dLabel(tm, true))}</title></path>`; });
  // ideal
  g += `<polyline fill="none" stroke="var(--ideal)" stroke-width="1.6" stroke-dasharray="5 4" points="${b.ideal.map(p => `${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ')}"/>`;
  // actual (step) + area
  if (b.actual.length) {
    let d = `M${X(b.actual[0].t)} ${Y(b.actual[0].v)}`;
    b.actual.forEach((p, i) => { if (i) d += `H${X(p.t).toFixed(1)}V${Y(p.v).toFixed(1)}`; });
    const last = b.actual.at(-1);
    g += `<path d="${d}V${H - m.b}H${X(b.actual[0].t)}Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>`;
    if (b.forecast !== null && b.remaining > 0) {
      const fx = Math.min(b.forecast, xEnd), fv = b.remaining * (1 - (fx - last.t) / (b.forecast - last.t || 1));
      g += `<line x1="${X(last.t)}" y1="${Y(last.v)}" x2="${X(fx)}" y2="${Y(fv)}" stroke="var(--${b.forecast > e ? 'bad' : 'good'})" stroke-width="1.8" stroke-dasharray="2 4" stroke-linecap="round"/>`;
    }
    g += `<circle cx="${X(last.t)}" cy="${Y(last.v)}" r="4.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.4"/>
      <text x="${X(last.t) + 9}" y="${Y(last.v) - 9}" font-size="12" font-weight="600" fill="var(--ink)" font-family="var(--f-mono)">${Math.round(last.v)}</text>`;
  }
  // today
  const nt = b.now;
  if (nt >= s && nt <= xEnd) g += `<line x1="${X(nt)}" x2="${X(nt)}" y1="${m.t - 8}" y2="${H - m.b}" stroke="var(--ink)" stroke-dasharray="3 3" opacity=".55"/><text x="${X(nt)}" y="${m.t - 12}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)" font-family="var(--f-display)">${esc(t('today').toUpperCase())}</text>`;
  g += `<rect id="bdHit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/>`;
  g += `<line id="bdCursor" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" visibility="hidden"/>`;
  lastBurndown = { svg: g, W, H };
  box.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('bdTitle'))}">${g}</svg>`);
  $('bdLegend').innerHTML = `<span><i class="sw" style="border-color:var(--accent);border-top-width:3px"></i>${esc(t('actual'))}</span><span><i class="sw" style="border-color:var(--ideal);border-top-style:dashed"></i>${esc(t('ideal'))}</span><span><i class="sw" style="border-color:var(--${b.forecast !== null && b.forecast > e ? 'bad' : 'good'});border-top-style:dotted"></i>${esc(t('forecastL'))}</span><span><svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 0l5 5l-5 5l-5-5z" fill="var(--ink)"/></svg>${esc(t('milestone'))}</span>`;
  $('bdHint').textContent = t(P.burnMode === 'done' ? 'bdHintD' : 'bdHintP');
  const svg = box.querySelector('svg'), hit = svg.querySelector('#bdHit'), cur = svg.querySelector('#bdCursor');
  const move = ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * W;
    const tm = C.addDays(s, Math.round((sx - m.l) / (W - m.l - m.r) * (xEnd - s) / C.DAY));
    if (tm < s || tm > xEnd) return;
    const a = b.actual.find(p => p.t === tm);
    cur.setAttribute('x1', X(tm)); cur.setAttribute('x2', X(tm)); cur.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.style.left = (X(tm) / W * r.width) + 'px'; tip.style.top = (m.t / H * r.height + 20) + 'px';
    tip.textContent = `${dLabel(tm, true)} · ${t('ideal')} ${Math.round(C.idealAt(P, tm))}${a ? ` · ${t('actual')} ${a.v}` : ''}`;
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerleave', () => { tip.hidden = true; cur.setAttribute('visibility', 'hidden'); });
}

/* ---------- gantt ---------- */
function buildGantt(mode, dw, showDeps, showCrit) {
  const now = nowT(), cp = C.criticalPath(P);
  const allDates = [C.parseDate(P.start), C.parseDate(P.end), ...P.tasks.flatMap(k => [C.parseDate(k.start), C.parseDate(k.end)]), ...P.milestones.map(m => C.parseDate(m.date))];
  let s = Math.min(...allDates), e = Math.max(...allDates);
  while (new Date(s).getUTCDay() !== 1) s = C.addDays(s, -1);
  e = C.addDays(e, 3);
  const days = C.diffDays(s, e) + 1, W = days * dw, RH = 30, HEAD = 46;
  const X = tm => C.diffDays(s, tm) * dw;
  const rows = [];
  rows.push({ kind: 'ms' });
  if (mode === 'summary') C.phaseSpans(P).filter(p => p.start).forEach(p => rows.push({ kind: 'phase', p }));
  else P.phases.forEach(ph => {
    const sp = C.phaseSpans(P).find(x => x.id === ph.id);
    if (!sp.start) return;
    rows.push({ kind: 'phaseHead', p: sp });
    P.tasks.filter(k => k.phase === ph.id).forEach(k => rows.push({ kind: 'task', k }));
  });
  const orphan = P.tasks.filter(k => !P.phases.some(p => p.id === k.phase));
  if (mode === 'master') orphan.forEach(k => rows.push({ kind: 'task', k }));
  const H = HEAD + rows.length * RH + 8;
  const rowY = new Map();
  let L = '', R = '';
  // header: months + weeks
  R += `<rect x="0" y="0" width="${W}" height="${HEAD}" fill="var(--sunk)"/>`;
  for (let tm = s; tm <= e; tm = C.addDays(tm, 1)) {
    const d = new Date(tm);
    if (C.isWeekend(tm) && dw >= 8) R += `<rect x="${X(tm)}" y="${HEAD}" width="${dw}" height="${H - HEAD}" fill="var(--grid)" opacity=".55"/>`;
    if (d.getUTCDate() === 1 || (tm === s && d.getUTCDate() <= 20)) {
      R += `<line x1="${X(tm)}" x2="${X(tm)}" y1="0" y2="22" stroke="var(--line)"/><text x="${X(tm) + 6}" y="15" font-size="11.5" font-weight="600" fill="var(--ink)" font-family="var(--f-display)">${esc(d.toLocaleDateString(UI.lang === 'fr' ? 'fr-FR' : 'en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' }).toUpperCase())}</text>`;
    }
    if (d.getUTCDay() === 1) {
      R += `<line x1="${X(tm)}" x2="${X(tm)}" y1="22" y2="${H}" stroke="var(--line)" opacity=".7"/>`;
      if (dw * 7 >= 84) R += `<text x="${X(tm) + 5}" y="38" font-size="10.5" fill="var(--muted)" font-family="var(--f-mono)">${esc(t('week'))}${isoWeek(tm)} · ${esc(dLabel(tm))}</text>`;
      else R += `<text x="${X(tm) + 3}" y="38" font-size="10.5" fill="var(--muted)" font-family="var(--f-mono)">${isoWeek(tm)}</text>`;
    }
  }
  R += `<line x1="0" x2="${W}" y1="22" y2="22" stroke="var(--line)"/><line x1="0" x2="${W}" y1="${HEAD}" y2="${HEAD}" stroke="var(--line)"/>`;
  L += `<rect x="0" y="0" width="400" height="${HEAD}" fill="var(--sunk)"/><line x1="0" x2="400" y1="${HEAD}" y2="${HEAD}" stroke="var(--line)"/>
    <text x="12" y="30" font-size="11.5" font-weight="600" fill="var(--muted)" font-family="var(--f-display)" letter-spacing=".08em">${esc((mode === 'summary' ? t('phase') : t('task')).toUpperCase())}</text>`;
  rows.forEach((r, i) => {
    const y = HEAD + i * RH, cy = y + RH / 2;
    const zebra = r.kind === 'phaseHead' ? `<rect x="0" y="${y}" width="%W%" height="${RH}" fill="var(--sunk)"/>` : '';
    R += zebra.replace('%W%', W); L += zebra.replace('%W%', 400);
    R += `<line x1="0" x2="${W}" y1="${y + RH}" y2="${y + RH}" stroke="var(--grid)"/>`;
    L += `<line x1="0" x2="400" y1="${y + RH}" y2="${y + RH}" stroke="var(--grid)"/>`;
    if (r.kind === 'ms') {
      L += `<text x="12" y="${cy + 4}" font-size="12.5" font-weight="600" fill="var(--ink)" font-family="var(--f-display)">${esc(t('milestones'))}</text>`;
      P.milestones.forEach(ms => { const x = X(C.parseDate(ms.date)) + dw / 2;
        R += `<g><path d="M${x} ${cy - 8}l8 8l-8 8l-8 -8z" fill="var(--ink)"/><title>${esc(ms.id + ' · ' + nm(ms) + ' · ' + dLabel(C.parseDate(ms.date), true))}</title></g><text x="${x + 11}" y="${cy + 4}" font-size="10.5" font-weight="600" fill="var(--muted)" font-family="var(--f-mono)">${esc(ms.id)}</text>`; });
      return;
    }
    if (r.kind === 'phase' || r.kind === 'phaseHead') {
      const p = r.p, x1 = X(C.parseDate(p.start)), x2 = X(C.parseDate(p.end)) + dw, big = r.kind === 'phase';
      L += `<rect x="10" y="${cy - 5}" width="10" height="10" rx="2" fill="${esc(p.color)}"/><text x="28" y="${cy + 4}" font-size="${big ? 13 : 12.5}" font-weight="600" fill="var(--ink)" font-family="var(--f-display)">${esc(p.id + ' · ' + nm(p))}</text>`;
      if (big) {
        L += `<text x="392" y="${cy + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${Math.round(p.progress * 100)}%</text>`;
        R += `<rect x="${x1}" y="${cy - 9}" width="${x2 - x1}" height="18" rx="4" fill="${esc(p.color)}" fill-opacity=".2" stroke="${esc(p.color)}"/><rect x="${x1}" y="${cy - 9}" width="${(x2 - x1) * p.progress}" height="18" rx="4" fill="${esc(p.color)}"/>
          <text x="${x2 + 8}" y="${cy + 4}" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${esc(dLabel(C.parseDate(p.start)))}–${esc(dLabel(C.parseDate(p.end)))} · ${p.points} ${esc(t('pts'))}</text>`;
      } else {
        R += `<path d="M${x1} ${cy + 6}V${cy - 4}H${x2}V${cy + 6}" fill="none" stroke="${esc(p.color)}" stroke-width="2"/><rect x="${x1}" y="${cy - 4}" width="${(x2 - x1) * p.progress}" height="4" fill="${esc(p.color)}"/>`;
      }
      return;
    }
    const k = r.k, ph = phaseOf(k.phase), x1 = X(C.parseDate(k.start)), x2 = X(C.parseDate(k.end)) + dw;
    const st = taskStatus(k, now), crit = showCrit && cp.critical.has(k.id);
    rowY.set(k.id, { cy, x1, x2 });
    L += `<text x="12" y="${cy + 4}" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${esc(k.id)}</text><text x="52" y="${cy + 4}" font-size="12.5" fill="var(--ink)">${esc(nm(k).length > 38 ? nm(k).slice(0, 37) + '…' : nm(k))}<title>${esc(nm(k))}</title></text>`;
    R += `<g><title>${esc(`${k.id} · ${nm(k)}\n${dLabel(C.parseDate(k.start), true)} → ${dLabel(C.parseDate(k.end), true)}\n${k.owner} · ${k.points} ${t('pts')} · ${k.progress}% · ${t(statusKey[st])}`)}</title>
      <rect x="${x1}" y="${cy - 8}" width="${x2 - x1}" height="16" rx="3" fill="${esc(ph.color)}" fill-opacity=".22" stroke="${crit ? 'var(--bad)' : esc(ph.color)}" stroke-width="${crit ? 2 : 1}"/>
      <rect x="${x1}" y="${cy - 8}" width="${(x2 - x1) * k.progress / 100}" height="16" rx="3" fill="${esc(ph.color)}"/></g>
      <text x="${x2 + 6}" y="${cy + 4}" font-size="10.5" fill="${st === 'late' ? 'var(--bad)' : 'var(--muted)'}" font-family="var(--f-mono)">${esc(k.owner)}${k.owner ? ' · ' : ''}${k.points}${st === 'late' ? ' · !' : ''}</text>`;
  });
  if (mode === 'master' && showDeps) {
    let dp = '';
    P.tasks.forEach(k => k.deps.forEach(d => {
      const a = rowY.get(d), b2 = rowY.get(k.id); if (!a || !b2) return;
      const crit = showCrit && cp.critical.has(k.id) && cp.critical.has(d);
      const midX = Math.max(a.x2 + 4, Math.min(b2.x1 - 6, a.x2 + 10));
      dp += `<path d="M${a.x2} ${a.cy}H${midX}V${b2.cy}H${b2.x1 - 1}" fill="none" stroke="${crit ? 'var(--bad)' : 'var(--muted)'}" stroke-opacity="${crit ? .9 : .5}" stroke-width="1.1" marker-end="url(#arr${crit ? 'C' : ''})"/>`;
    }));
    R = `<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker><marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--bad)"/></marker></defs>` + R + dp;
  }
  if (now >= s && now <= e) R += `<line x1="${X(now) + dw / 2}" x2="${X(now) + dw / 2}" y1="${HEAD - 6}" y2="${H}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="${X(now) + dw / 2 - 42}" y="${HEAD - 14}" width="84" height="14" rx="3" fill="var(--accent)"/><text x="${X(now) + dw / 2}" y="${HEAD - 4}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#fff" font-family="var(--f-display)" letter-spacing=".06em">${esc(t('today').toUpperCase())}</text>`;
  return { L, R, W, H };
}
function renderGantt() {
  const { L, R, W, H } = buildGantt(UI.gMode, UI.zoom, UI.deps, UI.crit);
  $('gLeft').innerHTML = `<svg width="400" height="${H}" viewBox="0 0 400 ${H}" role="img" aria-label="${esc(t(UI.gMode))}">${L}</svg>`;
  $('gRight').innerHTML = `<svg width="${W + 140}" height="${H}" viewBox="0 0 ${W + 140} ${H}" role="img" aria-label="${esc(t(UI.gMode))}">${R}</svg>`;
  $('gLegend').innerHTML = P.phases.map(p => `<span><svg width="12" height="12" viewBox="0 0 12 12"><rect width="12" height="12" rx="2" fill="${esc(p.color)}"/></svg>${esc(p.id + ' ' + nm(p))}</span>`).join('') +
    (UI.crit ? `<span><svg width="18" height="12" viewBox="0 0 18 12"><rect x="1" y="1" width="16" height="10" rx="2" fill="none" stroke="var(--bad)" stroke-width="2"/></svg>${esc(t('showCrit'))}</span>` : '') +
    `<span><svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 0l5 5l-5 5l-5-5z" fill="var(--ink)"/></svg>${esc(t('milestone'))}</span>`;
}

/* ---------- tasks ---------- */
function renderTasks() {
  const now = nowT(), cp = C.criticalPath(P);
  $('taskCount').textContent = `${P.tasks.length} ${t('kTasks')} · ${C.totalPoints(P)} ${t('pts')}`;
  $('tf-phase').innerHTML = P.phases.map(p => `<option value="${esc(p.id)}">${esc(p.id + ' · ' + nm(p))}</option>`).join('');
  $('edTitle').textContent = editing ? `${t('editTask')} ${editing}` : t('addTask');
  $('tfSave').textContent = editing ? t('saveTask') : t('addBtn');
  $('tfCancel').hidden = !editing;
  let rows = '';
  const groups = [...P.phases.map(p => ({ p, ts: P.tasks.filter(k => k.phase === p.id) })), { p: null, ts: P.tasks.filter(k => !P.phases.some(p => p.id === k.phase)) }];

const LIGHT = { bg: '#ffffff', surface: '#ffffff', sunk: '#f7f8fb', ink: '#142033', muted: '#596579', line: '#d7dde6', grid: '#e9edf3', accent: '#1f56f0',

function ganttSvg(mode) {

    catch (e) { if (e && e.code === 'declined') return 'declined'; if (e && e.code === 'rate_limited') return 'busy'; }

const slug = s => String(s).replace(/[^\w\-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'projet';
const DOCX = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
async function download(kind, st = $('dlStatus')) {

  const report = (r, name) => { st.textContent = r === 'saved' ? t('downloaded') + name : r === 'declined' ? t('dlDeclined') : t('dlBusy'); st.className = 'dl-status' + (r === 'saved' ? '' : ' err'); };

$('wzSize').addEventListener('click', ev => { const b = ev.target.closest('[data-size]'); if (!b) return; UI.wzSize = b.dataset.size; persist(); renderAssistant(); });
$('wzGo').addEventListener('click', async () => {
  const desc = $('wz-desc').value.trim(), msgEl = $('wzMsg');
  if (desc.length < 3) { msgEl.textContent = t('wzEmpty'); msgEl.className = 'err'; $('wz-desc').focus(); return; }
  $('wzGo').disabled = true; msgEl.textContent = ''; msgEl.className = '';
  let custom = null;
  try {
    const s = await sampleCap;
    if (s && $('wzAi').checked) {
      msgEl.textContent = t('wzAiRun');
      try { custom = Generator.fromAI(await s.json(Generator.aiPrompt(desc, UI.lang), { modelTier: 'default' })); } catch { custom = null; }
      msgEl.textContent = custom ? '' : t('wzAiFail');
    }
    const typeSel = $('wz-type').value;
    if (custom && typeSel !== 'auto') custom.typeId = typeSel;
    const out = Generator.build({ description: desc, client: $('wz-client').value.trim(), start: $('wz-start').value, size: UI.wzSize,
      typeId: typeSel === 'auto' ? undefined : typeSel, lang: UI.lang, custom });
    const r = C.validateProject(out.project);
    if (!r.ok) throw new Error(r.errors.join(','));
    prevProject = P; lastGen = out.type; P = r.project; editing = null;
    commit(); renderResult();
    $('wzResult').scrollIntoView?.({ behavior: 'smooth', block: 'start' });
  } catch (e) { console.warn('generation failed', e); msgEl.textContent = t('dlError'); msgEl.className = 'err'; }
  finally { $('wzGo').disabled = false; }
});
$('wzUndo').addEventListener('click', () => { if (!prevProject) return; P = prevProject; prevProject = null; lastGen = null; $('wzResult').hidden = true; commit(); $('wzMsg').textContent = t('wzUndone'); $('wzMsg').className = 'ok'; });
$('wzResult').addEventListener('click', ev => { const b = ev.target.closest('[data-wdl]'); if (b) download(b.dataset.wdl, $('wzDlStatus')); });
$('wzSeeGantt').addEventListener('click', () => { UI.tab = 'gantt'; UI.gMode = 'master'; persist(); renderChrome(); renderGantt(); });
$('wzEdit').addEventListener('click', () => { UI.tab = 'project'; persist(); renderChrome(); $('doc-context')?.focus(); });
$('newBtn').addEventListener('click', () => { UI.tab = 'assistant'; persist(); renderChrome(); $('wz-desc').focus(); });

/* ---------- wiring ---------- */
function renderAll() { renderChrome(); renderKpis(); renderBurndown(); renderFocus(); renderGantt(); renderTasks(); renderProject(); renderDocsEditor(); renderAssistant(); if (!editing) fillFormSilent(); }
function fillFormSilent() { const keep = editing; if (!keep && !$('tf-fr').value) { $('tf-id').value = nextId('T', P.tasks); $('tf-id').readOnly = false; } }
function commit() { P.history = C.recordHistory(P, nowT()); persist(); renderAll(); }
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { UI.lang = b.dataset.lang; commit(); }));
$('tabs').addEventListener('click', ev => { const b = ev.target.closest('[data-tab]'); if (!b) return; UI.tab = b.dataset.tab; persist(); renderChrome(); });
$('tabs').addEventListener('keydown', ev => {
  if (!['ArrowRight', 'ArrowLeft'].includes(ev.key)) return;
  const ids = ['assistant', 'burndown', 'gantt', 'tasks', 'project'], i = ids.indexOf(UI.tab);
  UI.tab = ids[(i + (ev.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length]; persist(); renderChrome(); $('tb-' + UI.tab).focus();
});
$('gMode').addEventListener('click', ev => { const b = ev.target.closest('[data-mode]'); if (!b) return; UI.gMode = b.dataset.mode; persist(); renderChrome(); renderGantt(); });
$('gZoom').addEventListener('click', ev => { const b = ev.target.closest('[data-z]'); if (!b) return; UI.zoom = +b.dataset.z; persist(); renderChrome(); renderGantt(); });
$('optDeps').addEventListener('change', ev => { UI.deps = ev.target.checked; persist(); renderGantt(); });
$('optCrit').addEventListener('change', ev => { UI.crit = ev.target.checked; persist(); renderGantt(); });
const hash = (location.hash || '').slice(1);
if (['assistant', 'burndown', 'gantt', 'tasks', 'project'].includes(hash)) UI.tab = hash;
renderAll(); fillForm(null);
})();
</script>

</body>
</html>
