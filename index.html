<title>The Manager</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230E0C0D%22/%3E%3Cg transform=%22translate%285,5%29 scale%28.84%29%22%3E%3Cdefs%3E%3ClinearGradient id=%22f%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23D3AFFE%22/%3E%3Cstop offset=%22.55%22 stop-color=%22%238556F7%22/%3E%3Cstop offset=%221%22 stop-color=%22%23CEAE31%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg fill=%22none%22 stroke=%22url%28%23f%29%22 stroke-width=%223.4%22 stroke-linejoin=%22round%22 stroke-linecap=%22round%22%3E%3Cpolygon points=%2210,39 6,28 10,17 20,9 32,6 44,8 54,15 58,26 55,36 45,41 34,42 29,46 28,57 23,56 22,46 14,46 10,39%22/%3E%3Cline x1=%2222%22 y1=%2221%22 x2=%2237%22 y2=%2218%22/%3E%3Cline x1=%2222%22 y1=%2221%22 x2=%2229%22 y2=%2232%22/%3E%3Cline x1=%2237%22 y1=%2218%22 x2=%2229%22 y2=%2232%22/%3E%3Cline x1=%2237%22 y1=%2218%22 x2=%2247%22 y2=%2228%22/%3E%3Cline x1=%2229%22 y1=%2232%22 x2=%2247%22 y2=%2228%22/%3E%3Cline x1=%2232%22 y1=%226%22 x2=%2222%22 y2=%2221%22/%3E%3Cline x1=%2232%22 y1=%226%22 x2=%2237%22 y2=%2218%22/%3E%3Cline x1=%226%22 y1=%2228%22 x2=%2222%22 y2=%2221%22/%3E%3Cline x1=%2258%22 y1=%2226%22 x2=%2247%22 y2=%2228%22/%3E%3Cline x1=%2229%22 y1=%2232%22 x2=%2234%22 y2=%2242%22/%3E%3C/g%3E%3Cg fill=%22%23EBCA4C%22%3E%3Ccircle cx=%2222%22 cy=%2221%22 r=%223.4%22/%3E%3Ccircle cx=%2237%22 cy=%2218%22 r=%223.4%22/%3E%3Ccircle cx=%2229%22 cy=%2232%22 r=%223.4%22/%3E%3Ccircle cx=%2247%22 cy=%2228%22 r=%223.4%22/%3E%3Ccircle cx=%2217%22 cy=%2235%22 r=%223.4%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark "mission control" world from the client palette — frosted header holding the view switcher,
   glass cards on a midnight field, coral reserved for the single thing that matters on each screen. */
:root{
  color-scheme:dark;
  --bg:#070606; --bg-2:#0D0B0C; --navy:#141112; --slate:#2F2B2C; --rose:#4B2FA8; --coral:#8556F7;
  --gold:#CEAE31; --gold-2:#EBCA4C; --gold-3:#AF8F30; --lav:#D3AFFE; --lav-2:#B28DF0; --cyan:#4FD1E8; --pink:#F28DC7;
  --surface:#141112; --sunk:#0E0C0D; --raise:#2F2B2C;
  --glass:rgba(28,25,26,.62); --glass-strong:rgba(14,12,13,.9);
  --line:rgba(249,250,250,.09); --line-strong:#3A3536; --grid:rgba(47,43,44,.62);
  --ink:#F9FAFA; --muted:#ABA6A8; --faint:#716B6D;
  --accent:#8556F7; --accent-2:#D3AFFE; --accent-soft:rgba(133,86,247,.17); --accent-glow:rgba(133,86,247,.45);
  --ideal:#8E888A; --good:#5DD6A6; --warn:#F0A840; --bad:#F25F7A;
  --good-soft:rgba(93,214,166,.14); --warn-soft:rgba(240,168,64,.15); --bad-soft:rgba(242,95,122,.15);
  --f-display:'Sora','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Manrope','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:16px; --r-sm:10px; --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(1100px 620px at 88% -12%,rgba(133,86,247,.20),transparent 60%),radial-gradient(800px 480px at -8% 6%,rgba(206,174,49,.07),transparent 60%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass-strong)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.35;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass-strong);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 220px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:#0E0C0D;border:1px solid var(--line-strong);box-shadow:0 6px 18px -8px var(--accent-glow)}
.brand-t{display:flex;flex-direction:column;min-width:0}
.eyebrow{font:600 10.5px/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand h1{font:600 16px/1.25 var(--f-display);margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38ch}
.bar-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(7,6,6,.6);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font:600 13px/1 var(--f-body);color:var(--muted);white-space:nowrap;transition:color .2s,background .25s var(--ease)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--raise);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 4px 14px -6px rgba(0,0,0,.6)}
@media (max-width:1060px){.tabs{order:3;flex:1 1 100%}}
/* signed in: 8 views, so the switcher gets its own row under the brand and actions */
.bar-in:has(#tabs > :nth-child(7)) .tabs{order:3;flex:1 1 100%;width:max-content;max-width:100%}
.bar-in:has(#tabs > :nth-child(7)) .brand{flex:1 1 220px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(7,6,6,.6);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font:600 12px/1 var(--f-body);color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.kbd-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(7,6,6,.5);color:var(--muted);border-radius:999px;padding:6px 10px 6px 12px;cursor:pointer;font-size:12.5px}
.kbd-btn:hover{color:var(--ink);border-color:var(--line-strong)}
kbd{font:500 11px var(--f-mono);padding:2px 6px;border-radius:6px;background:var(--raise);color:var(--muted);border:1px solid var(--line)}

/* page head */
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:18px 0}
.meta{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;font:600 12px/1.2 var(--f-body);letter-spacing:.02em;border:1px solid currentColor}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.st-on{color:var(--good);background:var(--good-soft)} .st-risk{color:var(--warn);background:var(--warn-soft)} .st-late{color:var(--bad);background:var(--bad-soft)}

/* glass surfaces with a cursor spotlight */
.card,.kpi,.wiz-main,.wiz-steps li{position:relative;isolation:isolate}
.card::after,.kpi::after,.wiz-main::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .35s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(133,86,247,.10),transparent 45%)}
.card:hover::after,.kpi:hover::after,.wiz-main:hover::after{opacity:1}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font:600 15px/1.3 var(--f-display);margin:0;letter-spacing:.005em}
.card-b{padding:16px 18px}
.hint{font-size:12.5px;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;box-shadow:var(--shadow);transition:transform .35s var(--ease),border-color .3s}
.kpi:hover{transform:translateY(-2px);border-color:rgba(133,86,247,.35)}
.kpi .k{font:600 10.5px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:600 26px/1.15 var(--f-display);margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v small{font:500 12px var(--f-body);color:var(--muted);letter-spacing:0}
.kpi .s{font-size:12px;color:var(--muted);margin-top:3px}
.meter{height:5px;background:rgba(7,6,6,.8);border-radius:3px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--coral));border-radius:3px;box-shadow:0 0 12px var(--accent-glow)}
.ring{display:flex;align-items:center;gap:12px;margin-top:6px}
.ring svg{flex:none}
.ring .v{margin-top:0}

/* panels */
.panel{padding-block:18px 48px}
.panel:not([hidden]){animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px}

/* chart */
.chart-box{position:relative}
.chart-box svg{display:block;width:100%;height:auto}
.chart-box svg path.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s var(--ease) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top:2px solid}
.tip{position:absolute;pointer-events:none;background:var(--glass-strong);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line-strong);color:var(--ink);font:12px/1.4 var(--f-mono);padding:7px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-110%);box-shadow:var(--shadow)}
.bd-hint{margin:0;padding:0 18px 14px}

/* lists */
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mini li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.mini li:last-child{border-bottom:0}
.tid{font:500 11.5px var(--f-mono);color:var(--faint)}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font:600 11px/1.4 var(--f-body);white-space:nowrap}
.c-done{background:var(--good-soft);color:var(--good)} .c-late{background:var(--bad-soft);color:var(--bad)}
.c-inprog{background:var(--accent-soft);color:var(--accent)} .c-todo{background:rgba(47,43,44,.5);color:var(--muted)}
.sec-t{font:600 10.5px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.sec-t:first-child{margin-top:0}

/* gantt */
.g-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.g-tools label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.gantt{display:grid;grid-template-columns:minmax(150px,var(--lw,300px)) minmax(0,1fr)}
.g-left{border-right:1px solid var(--line);overflow:hidden}
.g-right{overflow-x:auto;scrollbar-color:var(--slate) transparent}
.g-left svg,.g-right svg{display:block}
@media (max-width:640px){.gantt{--lw:150px}}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 10.5px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:rgba(7,6,6,.35)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(47,43,44,.25)}
tr.phase-row td{background:rgba(7,6,6,.4);font:600 12.5px var(--f-display)}
tr.total-row td{font-weight:700;border-top:1px solid var(--line-strong)}
td.r,th.r{text-align:right}
.pbar{width:84px;height:6px;background:rgba(7,6,6,.8);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.pbar i{display:block;height:100%;border-radius:3px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:rgba(47,43,44,.35);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;font:600 13px/1.2 var(--f-body);transition:transform .2s var(--ease),background .2s,border-color .2s,box-shadow .25s}
.btn:hover{background:rgba(47,43,44,.6);border-color:#4A4445}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#9C74FA,var(--coral));border-color:transparent;color:#fff;box-shadow:0 8px 22px -10px var(--accent-glow),0 1px 0 rgba(255,255,255,.25) inset}
.btn.pri:hover{box-shadow:0 10px 28px -8px var(--accent-glow),0 1px 0 rgba(255,255,255,.25) inset;filter:brightness(1.05)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.55;cursor:progress}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.lbl{font:600 10.5px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea,.edit-row input,.extra-row input,.extra-row select,.rate-in{border:1px solid var(--line);background:rgba(7,6,6,.55);border-radius:var(--r-sm);padding:9px 11px;min-width:0;width:100%;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.f input:focus,.f select:focus,.f textarea:focus,.edit-row input:focus,.extra-row input:focus,.extra-row select:focus,.rate-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f input[type=range]{padding:0;accent-color:var(--coral)}
input[type=checkbox]{accent-color:var(--coral)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
.f.wide{grid-column:1/-1}
.f textarea{font:12px/1.55 var(--f-mono);min-height:160px;resize:vertical}
.doc-ta{min-height:96px !important;font:13px/1.55 var(--f-body) !important}
.err{color:var(--bad);font-size:12.5px;min-height:1em}
.ok{color:var(--good);font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.edit-rows{display:flex;flex-direction:column;gap:8px}
.edit-row{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr) 120px auto;gap:8px;align-items:center}
.edit-row input[type=color]{padding:2px;height:36px}
@media (max-width:640px){.edit-row{grid-template-columns:1fr 1fr}}
.doc-lang{margin:0 0 12px;padding:10px 14px;border-radius:var(--r-sm);background:var(--accent-soft);border:1px solid rgba(133,86,247,.3);font-size:13px}

/* download menu */
.dl{position:relative}
.dl-btn{padding:8px 16px}
.dl-menu{position:absolute;right:0;top:calc(100% + 10px);z-index:40;width:300px;max-width:calc(100vw - 32px);background:var(--glass-strong);-webkit-backdrop-filter:saturate(1.4) blur(20px);backdrop-filter:saturate(1.4) blur(20px);border:1px solid var(--line-strong);border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);padding:6px;animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.dl-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left;font-size:13.5px;color:var(--ink)}
.dl-menu button:hover,.dl-menu button:focus-visible{background:rgba(133,86,247,.14)}
.dl-menu small{font:500 11px var(--f-mono);color:var(--muted)}
.dl-h{font:600 10.5px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 12px 4px}
.dl-note{font-size:11.5px;color:var(--muted);margin:6px 12px 2px}
.dl-status{font-size:12px;margin:4px 12px 6px;color:var(--good);overflow-wrap:anywhere}
.dl-status:empty{display:none}
.dl-status.err{color:var(--bad)}

/* assistant */
.wiz{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.wiz{grid-template-columns:minmax(0,1fr)}}
.wiz-main{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow:hidden;box-shadow:var(--shadow)}
.wiz-main::before{content:"";position:absolute;z-index:-2;width:520px;height:520px;right:-180px;top:-260px;border-radius:50%;filter:blur(60px);opacity:.55;
  background:conic-gradient(from 0deg,var(--coral),var(--rose),var(--slate),var(--coral));animation:orb 14s linear infinite}
@keyframes orb{to{transform:rotate(360deg)}}
.wiz-h{font:700 clamp(24px,3.2vw,36px)/1.08 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance;max-width:20ch}
.wiz-h em{font-style:normal;background:linear-gradient(90deg,var(--coral),#EBCA4C);-webkit-background-clip:text;background-clip:text;color:transparent}
.wiz-lead{margin:0;color:var(--muted);max-width:62ch;font-size:15px}
.wiz-input{width:100%;border:1px solid var(--line-strong);border-radius:16px;background:rgba(7,6,6,.6);padding:16px 18px;font:17px/1.5 var(--f-body);resize:vertical;min-height:96px;color:var(--ink);transition:border-color .25s,box-shadow .3s}
.wiz-input::placeholder{color:var(--faint)}
.wiz-input:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 4px var(--accent-soft),0 12px 40px -12px var(--accent-glow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

code{font:12px var(--f-mono);background:rgba(7,6,6,.6);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}

/* toasts */
.toasts{position:fixed;z-index:120;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}

<script>/* Core planning logic — pure functions, no DOM. Tested in core.test.js */
const Core = (() => {
  const DAY = 86400000;
  const ISO = /^\d{4}-\d{2}-\d{2}$/;
  const ID = /^[A-Za-z0-9_-]{1,16}$/;
  const HEX = /^#[0-9a-fA-F]{6}$/;

  function parseDate(s) {
    if (typeof s !== 'string' || !ISO.test(s)) return null;
    const [y, m, d] = s.split('-').map(Number);
    const t = Date.UTC(y, m - 1, d);
    const dt = new Date(t);
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
    return t;
  }
  const fmt = t => new Date(t).toISOString().slice(0, 10);
  const addDays = (t, n) => t + n * DAY;
  const diffDays = (a, b) => Math.round((b - a) / DAY);
  const isWeekend = t => { const w = new Date(t).getUTCDay(); return w === 0 || w === 6; };
  function workDays(a, b) { // working days in (a, b]
    let n = 0;
    for (let t = addDays(a, 1); t <= b; t = addDays(t, 1)) if (!isWeekend(t)) n++;
    return n;
  }
  const str = (v, max) => (typeof v === 'string' ? v.trim().slice(0, max) : '');
  const num = (v, lo, hi, dflt) => { const n = Number(v); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : dflt; };

  /* Validate + normalise an untrusted project object. Returns {ok, errors, project}. */
  function validateProject(raw) {
    const errors = [];
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return { ok: false, errors: ['root'], project: null };
    const p = {
      name: str(raw.name, 120) || 'Untitled project',
      code: str(raw.code, 24),
      start: str(raw.start, 10), end: str(raw.end, 10),
      statusDate: str(raw.statusDate, 10),
      workingDays: raw.workingDays !== false,
      phases: [], milestones: [], tasks: [], docs: { fr: {}, en: {} },
      burnMode: raw.burnMode === 'done' ? 'done' : 'progress', history: {}
    };
    if (raw.history && typeof raw.history === 'object' && !Array.isArray(raw.history))
      Object.keys(raw.history).filter(k => parseDate(k) !== null).sort().slice(-1000).forEach(k => {
        const v = Number(raw.history[k]); if (Number.isFinite(v) && v >= 0 && v <= 1e6) p.history[k] = Math.round(v * 10) / 10;
      });
    const DOC_KEYS = ['author', 'sponsor', 'context', 'objectives', 'scope', 'stakeholders', 'functional', 'nonfunctional', 'constraints',
      'architecture', 'stack', 'security', 'testing', 'deployment', 'risks', 'conclusion'];
    // Document texts are kept per language: docs = { fr: {...}, en: {...} }.
    // Older files with one flat set of texts are accepted and used for both languages.
    const pick = src => { const o = {}; if (src && typeof src === 'object' && !Array.isArray(src)) DOC_KEYS.forEach(k => { if (typeof src[k] === 'string' && src[k].trim()) o[k] = src[k].slice(0, 20000); }); return o; };
    if (raw.docs && typeof raw.docs === 'object' && !Array.isArray(raw.docs)) {
      if (raw.docs.fr || raw.docs.en) p.docs = { fr: pick(raw.docs.fr), en: pick(raw.docs.en) };
      else { const flat = pick(raw.docs); p.docs = { fr: { ...flat }, en: { ...flat } }; }
    } else p.docs = { fr: {}, en: {} };
    // Team day rates and budget settings (validated by budget.js, loaded lazily to avoid a require cycle)
    const B = typeof Budget !== 'undefined' ? Budget : (typeof require === 'function' ? require('./budget.js') : null);
    if (B) { const tb = B.clean(raw.team, raw.budget); p.team = tb.team; p.budget = tb.budget; }
    // Project-management registers (charter, stakeholders, RACI, risks, …) validated by pm.js
    const PMx = typeof PM !== 'undefined' ? PM : (typeof require === 'function' ? require('./pm.js') : null);
    if (PMx) p.pm = PMx.clean(raw.pm);
    const ps = parseDate(p.start), pe = parseDate(p.end);
    if (ps === null) errors.push('start');
    if (pe === null) errors.push('end');
    if (ps !== null && pe !== null && pe <= ps) errors.push('range');
    if (p.statusDate && parseDate(p.statusDate) === null) errors.push('statusDate');

    const phases = Array.isArray(raw.phases) ? raw.phases.slice(0, 30) : [];
    const phaseIds = new Set();
    phases.forEach((ph, i) => {
      const id = str(ph && ph.id, 16);
      if (!ID.test(id) || phaseIds.has(id)) { errors.push(`phase:${i}`); return; }
      phaseIds.add(id);
      p.phases.push({ id, fr: str(ph.fr, 80) || id, en: str(ph.en, 80) || str(ph.fr, 80) || id, color: HEX.test(ph.color) ? ph.color : '#5b6cff' });
    });

    const ms = Array.isArray(raw.milestones) ? raw.milestones.slice(0, 50) : [];
    ms.forEach((m, i) => {
      const id = str(m && m.id, 16);
      if (!ID.test(id) || parseDate(m.date) === null) { errors.push(`milestone:${i}`); return; }
      p.milestones.push({ id, fr: str(m.fr, 80) || id, en: str(m.en, 80) || str(m.fr, 80) || id, date: m.date });
    });

    const ts = Array.isArray(raw.tasks) ? raw.tasks.slice(0, 300) : [];
    const taskIds = new Set();
    ts.forEach((t, i) => {
      const id = str(t && t.id, 16);
      const s = parseDate(t && t.start), e = parseDate(t && t.end);
      if (!ID.test(id) || taskIds.has(id) || s === null || e === null || e < s) { errors.push(`task:${i}`); return; }
      if (t.done && parseDate(t.done) === null) { errors.push(`task:${i}:done`); return; }
      taskIds.add(id);
      p.tasks.push({
        id, fr: str(t.fr, 120) || id, en: str(t.en, 120) || str(t.fr, 120) || id,
        phase: phaseIds.has(t.phase) ? t.phase : (p.phases[0] ? p.phases[0].id : ''),
        owner: str(t.owner, 24), start: t.start, end: t.end,
        points: num(t.points, 0, 999, 1),
        progress: t.done ? 100 : num(t.progress, 0, 100, 0),
        done: t.done || '',
        deps: (Array.isArray(t.deps) ? t.deps : []).map(d => str(d, 16)).filter(Boolean).slice(0, 20)
      });
    });
    p.tasks.forEach(t => { t.deps = t.deps.filter(d => taskIds.has(d) && d !== t.id); });
    if (topoOrder(p.tasks) === null) errors.push('cycle');
    return { ok: errors.length === 0, errors, project: p };

<script>/* Team and budget, derived from the schedule.
   A task is worked by one person of its owner's role, full time, on each working day of the task.
   → person-days per role, people needed per role (person-days over the active period, capped by peak overlap),
     labour cost (person-days × day rate), fixed costs, contingency, earned and planned value in €. */
const Budget = (() => {
  const C = (typeof Core !== 'undefined') ? Core : require('./core.js');
  const DEFAULT_TEAM = [
    ['PM', 'Chef de projet', 'Project manager', 550], ['ARCH', 'Architecte logiciel', 'Software architect', 650],
    ['UX', 'Designer UX/UI', 'UX/UI designer', 500], ['DEV', 'Développeur', 'Developer', 500],
    ['FE', 'Développeur front-end', 'Front-end developer', 500], ['BE', 'Développeur back-end', 'Back-end developer', 500],
    ['DATA', 'Data engineer', 'Data engineer', 550], ['ML', 'Data scientist', 'Data scientist', 600],
    ['QA', 'Testeur QA', 'QA tester', 450], ['SEC', 'Expert cybersécurité', 'Security expert', 650], ['OPS', 'Ingénieur DevOps', 'DevOps engineer', 550]
  ].map(([id, fr, en, rate]) => ({ id, fr, en, rate }));
  const FALLBACK_RATE = 500;
  const roleOf = owner => String(owner || '').trim().toUpperCase().replace(/\d+$/, '') || 'DEV';
  const workDaysOf = k => C.workDays(C.addDays(C.parseDate(k.start), -1), C.parseDate(k.end)) || 1;

  function team(p) {
    const list = Array.isArray(p.team) && p.team.length ? p.team : DEFAULT_TEAM;
    const byId = new Map(list.map(r => [r.id, r]));
    // any role used by a task but missing from the list gets a line with the fallback rate
    p.tasks.forEach(k => { const id = roleOf(k.owner); if (!byId.has(id)) byId.set(id, { id, fr: k.owner || id, en: k.owner || id, rate: FALLBACK_RATE }); });
    return byId;
  }

  function staffing(p) {
    const roles = team(p), out = new Map();
    p.tasks.forEach(k => {
      const id = roleOf(k.owner), r = roles.get(id), d = workDaysOf(k);
      const o = out.get(id) || { id, fr: r.fr, en: r.en, rate: r.rate, personDays: 0, start: k.start, end: k.end, days: new Map(), tasks: 0 };
      o.personDays += d; o.tasks++;
      if (k.start < o.start) o.start = k.start;
      if (k.end > o.end) o.end = k.end;
      for (let t = C.parseDate(k.start); t <= C.parseDate(k.end); t = C.addDays(t, 1)) if (!C.isWeekend(t)) o.days.set(t, (o.days.get(t) || 0) + 1);
      out.set(id, o);
    });
    return [...out.values()].map(o => {
      // People needed = person-days spread over the role's active period, rounded up,
      // never more than the peak number of tasks this role has running on the same day.
      const span = C.workDays(C.addDays(C.parseDate(o.start), -1), C.parseDate(o.end)) || 1;
      const people = Math.max(1, Math.min(Math.max(1, ...o.days.values()), Math.ceil(o.personDays / span)));
      return { id: o.id, fr: o.fr, en: o.en, rate: o.rate, people, personDays: o.personDays, tasks: o.tasks, start: o.start, end: o.end,
        load: Math.min(1, o.personDays / (span * people)), cost: o.personDays * o.rate };
    }).sort((a, b) => b.cost - a.cost);
  }

  function compute(p, todayT) {
    const roles = team(p), cfg = p.budget || {};
    const taskCost = k => workDaysOf(k) * (roles.get(roleOf(k.owner)) || { rate: FALLBACK_RATE }).rate;
    const staff = staffing(p);
    const labour = staff.reduce((a, r) => a + r.cost, 0);
    // Fixed costs follow the plan: monthly items × project months, per-person items × team size.
    const months = Math.max(1, Math.ceil((C.diffDays(C.parseDate(p.start), C.parseDate(p.end)) + 1) / 30.44));
    const people = staff.reduce((a, r) => a + r.people, 0);
    const qtyOf = per => per === 'month' ? months : per === 'person' ? people : per === 'personMonth' ? people * months : 1;
    const extras = (Array.isArray(cfg.extras) ? cfg.extras : []).filter(x => x.amount > 0).map(x => ({ ...x, per: x.per || 'once', qty: qtyOf(x.per), total: x.amount * qtyOf(x.per) }));
    const extrasTotal = extras.reduce((a, x) => a + x.total, 0);
    // Contingency: automatic from schedule risk, or a fixed rate chosen by the user.
    const auto = autoContingency(p, todayT, months);
    const contingencyRate = cfg.contMode === 'manual' && Number.isFinite(cfg.contingency) ? cfg.contingency : auto.rate;
    const subtotal = labour + extrasTotal, contingency = Math.round(subtotal * contingencyRate);
    const byPhase = p.phases.map(ph => ({ id: ph.id, fr: ph.fr, en: ph.en, color: ph.color, cost: p.tasks.filter(k => k.phase === ph.id).reduce((a, k) => a + taskCost(k), 0) })).filter(x => x.cost > 0);
    const now = C.statusTime(p, todayT);
    const ev = p.tasks.reduce((a, k) => a + taskCost(k) * (k.done ? 1 : k.progress / 100), 0);
    const pv = p.tasks.reduce((a, k) => {
      const s = C.parseDate(k.start), e = C.addDays(C.parseDate(k.end), 1);
      const f = now >= e ? 1 : now < s ? 0 : (C.addDays(now, 1) - s) / (e - s);

      months, contMode: cfg.contMode === 'manual' ? 'manual' : 'auto', autoContingency: auto,

  /* Automatic contingency: 10 % base, more when the schedule is at risk, when much of the plan is
     critical (no slack) and when the project is long. Each part is listed so the figure can be explained. */
  function autoContingency(p, todayT, months) {
    const parts = [{ fr: 'Base', en: 'Base', rate: 0.10 }];
    const h = C.health(p, todayT);

    if (h.status === 'late') parts.push({ fr: 'Planning en retard (SPI < 0,80)', en: 'Schedule late (SPI < 0.80)', rate: 0.10 });
    const cp = C.criticalPath(p), share = p.tasks.length ? cp.critical.size / p.tasks.length : 0;
    const crit = Math.round(Math.min(0.05, share * 0.08) * 100) / 100;
    if (crit > 0) parts.push({ fr: `Tâches sans marge (${Math.round(share * 100)} % du plan)`, en: `Tasks with no slack (${Math.round(share * 100)} % of the plan)`, rate: crit });
    if (months > 4) parts.push({ fr: 'Projet long (plus de 4 mois)', en: 'Long project (over 4 months)', rate: 0.02 });
    return { rate: Math.round(parts.reduce((a, x) => a + x.rate, 0) * 100) / 100, parts };
  }

  /* Validate untrusted team / budget settings (used by Core.validateProject through the app). */
  function clean(rawTeam, rawBudget) {
    const str = (v, m) => typeof v === 'string' ? v.trim().slice(0, m) : '';
    const num = (v, lo, hi, d) => { const n = Number(v); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };
    const seen = new Set();
    const t = (Array.isArray(rawTeam) ? rawTeam : []).slice(0, 40).map(r => r && ({ id: str(r.id, 16).toUpperCase().replace(/[^A-Z0-9_-]/g, ''), fr: str(r.fr, 60), en: str(r.en, 60), rate: Math.round(num(r.rate, 0, 10000, FALLBACK_RATE)) }))
      .filter(r => r && r.id && !seen.has(r.id) && seen.add(r.id)).map(r => ({ ...r, fr: r.fr || r.id, en: r.en || r.fr || r.id }));
    const b = rawBudget && typeof rawBudget === 'object' ? rawBudget : {};
    const extras = (Array.isArray(b.extras) ? b.extras : []).slice(0, 40).map(x => x && ({ fr: str(x.fr, 120), en: str(x.en, 120), amount: Math.round(num(x.amount, 0, 1e8, 0)),
      per: ['once', 'month', 'person', 'personMonth'].includes(x.per) ? x.per : 'once' }))
      .filter(x => x && (x.fr || x.en || x.amount > 0)).map(x => ({ ...x, fr: x.fr || x.en, en: x.en || x.fr }));
    return { team: t.length ? t : DEFAULT_TEAM.map(r => ({ ...r })), budget: { contMode: b.contMode === 'manual' ? 'manual' : 'auto', contingency: num(b.contingency, 0, 1, 0.15), extras } };
  }
  return { DEFAULT_TEAM, roleOf, staffing, compute, clean, autoContingency };
})();
if (typeof module !== 'undefined') module.exports = Budget;
</script>

  const REG = {

    decisions: [['date', 'date'], ['decision', 'text', 200, true], ['by', 'text', 60], ['rationale', 'text', 240]],
    changes: [['title', 'text', 160, true], ['requestedBy', 'text', 60], ['date', 'date'], ['impactDays', 'int', [-365, 365]], ['impactCost', 'int', [-1e8, 1e8]], ['status', 'enum', E.cstatus]],
    comms: [['what', 'text', 120, true], ['audience', 'text', 120], ['freq', 'enum', E.freq], ['channel', 'text', 60], ['owner', 'text', 40]],
    quality: [['deliverable', 'text', 120, true], ['criteria', 'text', 240], ['method', 'text', 120], ['status', 'enum', E.qstatus]],

    lessons: [['date', 'date'], ['category', 'enum', E.lcat], ['lesson', 'text', 300, true], ['action', 'text', 240]]
  };
  const RACI = ['R', 'A', 'C', 'I'];
  const str = (v, m) => (typeof v === 'string' ? v.trim().slice(0, m) : '');
  const okId = v => typeof v === 'string' && /^[A-Za-z0-9_-]{1,16}$/.test(v);

  function cleanRow(cols, raw, i) {
    if (!raw || typeof raw !== 'object') return null;
    const row = { id: okId(raw.id) ? raw.id : 'r' + (i + 1) };
    for (const [k, type, lim, req] of cols) {
      const v = raw[k];
      if (type === 'text') row[k] = str(v, lim);

  /* Validate an untrusted pm object (from storage, import or the network). */

    }
    const c = r.charter && typeof r.charter === 'object' ? r.charter : {};
    out.charter = { purpose: str(c.purpose, 600), sponsor: str(c.sponsor, 120), manager: str(c.manager, 120), success: str(c.success, 600), approved: c.approved === true, approvedOn: typeof c.approvedOn === 'string' && C.parseDate(c.approvedOn) !== null ? c.approvedOn : '' };

  /* ---- generate a full PM kit from any project (generated, imported or typed) ---- */
  function generate(P, lang = 'fr', typeRisks = []) {
    const fr = lang === 'fr', L = (a, b) => (fr ? a : b);
    const docs = (P.docs && (P.docs[lang] || P.docs.fr || P.docs.en)) || {};
    const ms = id => { const v = (P.milestones.find(m => m.id === id) || {}).date || P.end; return new Date(C.parseDate(v)).toLocaleDateString(fr ? 'fr-FR' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }); };
    const phaseEnd = id => { const ts = P.tasks.filter(t => t.phase === id); return ts.length ? ts.reduce((m, t) => (t.end > m ? t.end : m), ts[0].end) : P.start; };
    const roles = [...new Set(P.tasks.map(t => BG().roleOf(t.owner)))].filter(r => r && r !== 'PM').slice(0, 8);
    roles.unshift('CLIENT', 'PM');
    const sponsor = docs.sponsor || L('Sponsor', 'Sponsor'), manager = docs.author || L('Chef de projet', 'Project manager');
    const firstLine = s => String(s || '').split('\n').map(x => x.trim()).find(x => x && !x.includes(' | ') && !x.startsWith('#')) || '';
    let n = 0; const id = p => `${p}${++n}`;

    const risks = (typeRisks.length ? typeRisks : [
      [L('Retard sur les livrables clés', 'Key deliverables late'), 3, 4, L('Suivi hebdomadaire du burndown, marge sur le chemin critique', 'Weekly burndown review, buffer on the critical path')],
      [L('Besoins qui changent en cours de projet', 'Requirements change mid-project'), 3, 3, L('Demandes de changement chiffrées et validées par le sponsor', 'Change requests costed and approved by the sponsor')],
      [L('Indisponibilité d’une personne clé', 'Key person unavailable'), 2, 4, L('Binômes et documentation des tâches critiques', 'Pairing and documentation of critical tasks')]
    ]).map(([t, p, i, resp]) => ({ id: id('R'), title: t, p, i, owner: 'PM', strategy: p * i >= 15 ? 'avoid' : 'mitigate', response: resp, status: 'open' }));
    risks.push({ id: id('R'), title: L('Dérive du budget', 'Budget overrun'), p: 2, i: 4, owner: 'PM', strategy: 'mitigate', response: L('Revue mensuelle valeur acquise / planifiée, marge pour imprévus', 'Monthly earned vs planned value review, contingency reserve'), status: 'open' });

    const deliverables = P.phases.map(ph => ({ ph, ts: P.tasks.filter(t => t.phase === ph.id) })).filter(x => x.ts.length);
    const raciRows = deliverables.map((x, i) => ({ id: 'D' + (i + 1), item: `${x.ph.id} · ${fr ? x.ph.fr : x.ph.en}` }));
    const cells = {};
    deliverables.forEach((x, i) => {
      const rid = 'D' + (i + 1), owners = [...new Set(x.ts.map(t => BG().roleOf(t.owner)))];
      const pmOnly = owners.every(o => o === 'PM');
      roles.forEach(r => { cells[`${rid}|${r}`] = owners.includes(r) && r !== 'PM' ? 'R' : 'I'; });
      // the PM approves the team's work; when the PM does the work (scoping, closure), the client approves it
      cells[`${rid}|PM`] = pmOnly ? 'R' : 'A';
      cells[`${rid}|CLIENT`] = pmOnly ? 'A' : ['P2', 'P4'].includes(x.ph.id) ? 'C' : 'I';
      const reviewer = roles.find(r => ['ARCH', 'SEC', 'QA'].includes(r) && !owners.includes(r));

    });

    return clean({
      charter: {
        purpose: firstLine(docs.context) || L(`Livrer « ${P.name} » dans les délais, le budget et la qualité attendus.`, `Deliver “${P.name}” on time, on budget and to the expected quality.`),
        sponsor, manager,
        success: L(`Mise en service le ${ms('M5')}, toutes les exigences indispensables validées en recette, budget respecté à ±10 %.`, `Go-live on ${ms('M5')}, all must-have requirements accepted, budget within ±10 %.`)
      },
      stakeholders: [
        { id: id('S'), name: sponsor, role: L('Sponsor / client', 'Sponsor / client'), influence: 5, interest: 5, strategy: 'manage' },
        { id: id('S'), name: manager, role: L('Chef de projet', 'Project manager'), influence: 4, interest: 5, strategy: 'manage' },
        { id: id('S'), name: L('Utilisateurs finaux', 'End users'), role: L('Utilisent le produit', 'Use the product'), influence: 2, interest: 5, strategy: 'inform' },

        { id: id('S'), name: L('Support / exploitation', 'Support / operations'), role: L('Reprend le produit après la mise en service', 'Takes over after go-live'), influence: 2, interest: 2, strategy: 'monitor' }
      ],

      comms: [
        { id: id('C'), what: L('Point d’équipe (stand-up)', 'Team stand-up'), audience: L('Équipe projet', 'Project team'), freq: 'daily', channel: 'Teams / Slack', owner: 'PM' },
        { id: id('C'), what: L('Rapport d’avancement (burndown, SPI, budget)', 'Status report (burndown, SPI, budget)'), audience: L('Sponsor, client', 'Sponsor, client'), freq: 'weekly', channel: 'E-mail', owner: 'PM' },
        { id: id('C'), what: L('Revue de sprint / démonstration', 'Sprint review / demo'), audience: L('Client, utilisateurs clés', 'Client, key users'), freq: 'biweekly', channel: L('Visio', 'Video call'), owner: 'PM' },
        { id: id('C'), what: L('Comité de pilotage', 'Steering committee'), audience: L('Sponsor, direction', 'Sponsor, management'), freq: 'milestone', channel: L('Réunion', 'Meeting'), owner: 'PM' },

        { id: id('Q'), deliverable: L('Code et application', 'Code and application'), criteria: L('Tests automatiques au vert, couverture ≥ 70 %, 0 faille critique', 'Automated tests green, coverage ≥ 70 %, 0 critical flaw'), method: L('Intégration continue + revue de code', 'CI + code review'), status: 'todo' }

  }

  /* ---- the ten PM knowledge areas (PMBOK), with live status for the brain ---- */
  const AREAS = [
    { id: 'integration', fr: 'Intégration', en: 'Integration', go: 'pm:charter', does: ['Tient la charte, arbitre les changements et décide', 'Owns the charter, arbitrates changes and decides'] },
    { id: 'scope', fr: 'Périmètre', en: 'Scope', go: 'tasks', does: ['Définit ce qui est inclus, découpe en tâches (WBS)', 'Defines what is in, breaks it into tasks (WBS)'] },
    { id: 'schedule', fr: 'Délais', en: 'Schedule', go: 'gantt', does: ['Planifie, suit le Gantt et le chemin critique', 'Plans, tracks the Gantt and critical path'] },
    { id: 'cost', fr: 'Coûts', en: 'Cost', go: 'budget', does: ['Estime, budgétise et suit la valeur acquise', 'Estimates, budgets and tracks earned value'] },
    { id: 'quality', fr: 'Qualité', en: 'Quality', go: 'pm:quality', does: ['Fixe les critères d’acceptation et les contrôle', 'Sets acceptance criteria and checks them'] },
    { id: 'resources', fr: 'Ressources', en: 'Resources', go: 'budget', does: ['Constitue l’équipe, répartit la charge', 'Builds the team, balances the workload'] },
    { id: 'communication', fr: 'Communication', en: 'Communication', go: 'pm:comms', does: ['Informe la bonne personne au bon moment', 'Informs the right people at the right time'] },
    { id: 'risk', fr: 'Risques', en: 'Risk', go: 'pm:risks', does: ['Anticipe, évalue et traite les risques', 'Anticipates, scores and treats risks'] },
    { id: 'procurement', fr: 'Achats', en: 'Procurement', go: 'pm:procurement', does: ['Achète licences, services et matériel', 'Buys licences, services and hardware'] },

  function areas(P, todayT, lang = 'fr') {

    const openRisks = pm.risks.filter(r => r.status !== 'closed'), worst = openRisks.reduce((m, r) => Math.max(m, r.p * r.i), 0);
    const openIssues = pm.issues.filter(x => x.status !== 'resolved'), critical = openIssues.filter(x => x.severity === 'critical' || x.severity === 'high').length;

    const eur = v => new Intl.NumberFormat(fr ? 'fr-FR' : 'en-GB', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(v);

      resources: { status: lvl(false, overload > 0), value: `${B.people} ${T('personnes', 'people')}`, detail: overload ? `${overload} ${T('rôle(s) surchargé(s)', 'overloaded role(s)')}` : `${B.personDays} ${T('jours-homme', 'person-days')}` },

  /* ---- weekly status report, written from the live data ---- */
  function statusReport(P, todayT, lang = 'fr') {
    const fr = lang === 'fr', T = (a, e) => (fr ? a : e), pm = P.pm || empty(), now = C.statusTime(P, todayT);

    const word = { on: T('dans les temps', 'on track'), risk: T('à risque', 'at risk'), late: T('en retard', 'late') }[h.status];

      `${T('Terminé cette semaine', 'Done this week')} :`, ...(done.length ? done.map(t => `  • ${t.id} ${nm(t)}`) : [`  • ${T('Aucune tâche clôturée', 'No task closed')}`]), '',
      `${T('Prévu la semaine prochaine', 'Planned next week')} :`, ...(next.length ? next.slice(0, 8).map(t => `  • ${t.id} ${nm(t)} (${t.progress} %)`) : [`  • —`]), '',
      `${T('Principaux risques', 'Top risks')} :`, ...(risks.length ? risks.map(r => `  • ${r.title} — ${r.p}×${r.i}=${r.p * r.i} — ${r.response}`) : [`  • —`]), '',

      ...(pm.changes.some(c => c.status === 'pending') || pm.issues.some(i => i.status !== 'resolved' && ['high', 'critical'].includes(i.severity)) ? [] : [`  • ${T('Aucune', 'None')}`])
    ].join('\n');
  }

<script>/* Project assistant: plain-language description → full project (phases, tasks, dates, dependencies,
   milestones) + all document content. Pure functions; KB holds the knowledge per project type. */
const Generator = (() => {
  const C = (typeof Core !== 'undefined') ? Core : require('./core.js');
  const K = (typeof KB !== 'undefined') ? KB : require('./kb.js');
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, ' ').replace(/[^a-z0-9+\- ]/g, ' ').replace(/\s+/g, ' ').trim();
  const PHASES = [['P1', 'Cadrage', 'Initiation', '#8556F7'], ['P2', 'Conception', 'Design', '#CEAE31'], ['P3', 'Réalisation', 'Build', '#D3AFFE'],
    ['P4', 'Tests et recette', 'Testing and acceptance', '#4FD1E8'], ['P5', 'Mise en service', 'Go-live', '#F28DC7'], ['P6', 'Clôture', 'Closure', '#B28DF0']];
  const SIZES = { small: { f: 0.7, prios: ['M'], lanes: 2 }, medium: { f: 1, prios: ['M', 'S'], lanes: 2 }, large: { f: 1.35, prios: ['M', 'S', 'C'], lanes: 2 } };

  /* ---- detection: weighted keyword match on the normalised text ---- */
  function detect(text) {
    const t = ' ' + norm(text) + ' ';
    const scores = K.filter(k => k.kw.length).map(k => {
      let s = 0;
      k.kw.forEach(w => { const n = norm(w); if (n && t.includes(' ' + n + ' ') || (n.length > 5 && t.includes(n))) s += 1 + n.split(' ').length; });
      return { id: k.id, score: s };
    }).sort((a, b) => b.score - a.score);
    const best = scores[0];
    return { id: best && best.score > 0 ? best.id : 'software', scores };
  }
  const type = id => K.find(k => k.id === id) || K.find(k => k.id === 'software');

  /* ---- working-day calendar ---- */
  const nextWork = t => { let x = t; while (C.isWeekend(x)) x = C.addDays(x, 1); return x; };
  const endAfter = (start, days) => { let x = nextWork(start), left = Math.max(1, days) - 1; while (left > 0) { x = C.addDays(x, 1); if (!C.isWeekend(x)) left--; } return x; };
  const nextMonday = t => { let x = C.addDays(t, 1); while (new Date(x).getUTCDay() !== 1) x = C.addDays(x, 1); return x; };

  /* ---- cleaned project name from the description ---- */
  function projectName(text, tp, lang) {
    let s = String(text || '').trim().replace(/\s+/g, ' ');
    const lead = /^(je (veux|voudrais|souhaite)|nous (voulons|souhaitons)|i (want|would like|need)( to)?|we (want|need)( to)?|j['’ ]ai besoin d['’ ]?(une?)?|to|creer|créer|create|build|develop|développer|developper|faire|make|realiser|réaliser|un|une|des|le|la|les|a|an|the)\s+/i;
    for (let i = 0; i < 5 && lead.test(s); i++) s = s.replace(lead, '');
    if (!s) return lang === 'fr' ? tp.fr : tp.en;
    s = s.charAt(0).toUpperCase() + s.slice(1);
    return s.length > 70 ? s.slice(0, 67).replace(/\s+\S*$/, '') + '…' : s.replace(/[.!]+$/, '');
  }

  /* ---- build the schedule ---- */
  function build({ description, client = '', start, size = 'medium', typeId, lang = 'fr', author = '', custom = null }) {
    const det = detect(description), base = type((custom && custom.typeId) || typeId || det.id), Z = SIZES[size] || SIZES.medium;
    const tp = custom && custom.features ? { ...base, features: custom.features } : base;
    const s0 = nextWork(C.parseDate(start) ?? nextMonday(Date.now() - Date.now() % C.DAY));
    const dur = d => Math.max(1, Math.round(d * Z.f)), pts = p => Math.max(1, Math.round(p * (size === 'large' ? 1.3 : size === 'small' ? 0.8 : 1)));
    const tasks = []; let n = 0;
    const add = (phase, fr, en, owner, days, points, deps) => {
      const ds = deps.map(id => tasks.find(t => t.id === id));
      const st = ds.length ? nextWork(C.addDays(Math.max(...ds.map(t => C.parseDate(t.end))), 1)) : s0;
      const t = { id: `T${++n}`, phase, fr, en, owner, start: C.fmt(st), end: C.fmt(endAfter(st, days)), points, progress: 0, done: '', deps };
      tasks.push(t); return t.id;
    };
    // P1 initiation
    const kick = add('P1', 'Réunion de lancement et recueil des besoins', 'Kick-off and needs gathering', 'PM', dur(3), pts(3), []);
    const spec = add('P1', 'Rédaction et validation du cahier des charges', 'Requirements specification and sign-off', 'PM', dur(4), pts(5), [kick]);
    add('P1', 'Planning, budget et registre des risques', 'Schedule, budget and risk register', 'PM', dur(2), pts(2), [kick]);
    // P2 design (type may override)
    const design = (tp.design || [['Architecture technique', 'Technical architecture', 'ARCH', 4, 5], ['Maquettes et parcours utilisateur', 'Mock-ups and user journeys', 'UX', 6, 5]])
      .map(([fr, en, o, d, p]) => add('P2', fr, en, o, dur(d), pts(p), [spec]));
    const dataModel = tp.design ? null : add('P2', 'Modèle de données', 'Data model', 'ARCH', dur(3), pts(3), [design[0]]);
    const designEnd = dataModel ? [...design, dataModel] : design;
    // P3 build: environment, then features on parallel lanes
    const env = add('P3', 'Environnement de développement et CI/CD', 'Development environment and CI/CD', 'OPS', dur(2), pts(2), [design[0]]);
    const feats = tp.features.filter(f => Z.prios.includes(f[6]));
    const lanes = Array.from({ length: Z.lanes }, () => null), featIds = [];
    feats.forEach((f, i) => {
      const lane = i % Z.lanes, prev = lanes[lane];
      const id = add('P3', f[0], f[1], `DEV${lane + 1}`, dur(f[4]), pts(f[5]), prev ? [prev] : [env, ...designEnd.filter(d => d !== design[0])]);
      lanes[lane] = id; featIds.push(id);
    });
    const buildEnd = lanes.filter(Boolean);
    // P4 tests
    let accept;
    if (tp.test) {
      const ids = tp.test.map(([fr, en, o, d, p], i) => add('P4', fr, en, o, dur(d), pts(p), i === 0 ? buildEnd : [`T${n}`]));
      accept = ids.at(-1);
    } else {
      const unit = add('P4', 'Tests unitaires et d’intégration', 'Unit and integration tests', 'QA', dur(5), pts(5), buildEnd);
      const sec = add('P4', 'Tests de sécurité', 'Security testing', 'SEC', dur(4), pts(3), buildEnd);
      const uat = add('P4', 'Recette avec le client', 'Client acceptance testing', 'QA', dur(4), pts(3), [unit]);
      accept = add('P4', 'Corrections avant mise en ligne', 'Fixes before go-live', 'DEV1', dur(3), pts(3), [uat, sec]);
    }
    // P5 go-live, P6 closure
    const live = add('P5', tp.id === 'security' ? 'Restitution et remise du rapport d’audit' : 'Mise en production', tp.id === 'security' ? 'Debrief and audit report handover' : 'Production go-live', tp.id === 'security' ? 'SEC' : 'OPS', dur(2), pts(3), [accept]);
    const train = add('P5', 'Formation et guide utilisateur', 'Training and user guide', 'PM', dur(3), pts(2), [accept]);
    const close = add('P6', 'Bilan, rapport final et transfert', 'Final review, report and handover', 'PM', dur(3), pts(3), [live, train]);
    const endOf = ids => C.fmt(Math.max(...ids.map(id => C.parseDate(tasks.find(t => t.id === id).end))));
    const phaseEnd = p => endOf(tasks.filter(t => t.phase === p).map(t => t.id));
    const milestones = [
      ['M1', 'Cahier des charges validé', 'Requirements signed off', endOf([spec])],
      ['M2', 'Conception validée', 'Design approved', phaseEnd('P2')],
      ['M3', tp.id === 'security' ? 'Fin des tests techniques' : 'Version complète livrée (MVP)', tp.id === 'security' ? 'Technical testing complete' : 'Complete version delivered (MVP)', phaseEnd('P3')],
      ['M4', 'Recette validée', 'Acceptance passed', phaseEnd('P4')],
      ['M5', tp.id === 'security' ? 'Rapport remis' : 'Mise en ligne', tp.id === 'security' ? 'Report delivered' : 'Go-live', endOf([live])],
      ['M6', 'Clôture du projet', 'Project closure', endOf([close])]
    ].map(([id, fr, en, date]) => ({ id, fr, en, date }));
    const name = (custom && custom.name) || projectName(description, tp, lang);
    const project = {
      name, code: `${tp.code}-${new Date(s0).getUTCFullYear()}`, start: C.fmt(s0), end: endOf([close]), statusDate: '', workingDays: true,
      phases: PHASES.map(([id, fr, en, color]) => ({ id, fr, en, color })), milestones, tasks,
      budget: { contMode: 'auto', contingency: 0.15, extras: [...(tp.costs || []).map(([fr, en, amount, per]) => ({ fr, en, amount, per })),
        { fr: 'Outils collaboratifs et licences de développement', en: 'Collaboration tools and developer licences', amount: 15, per: 'personMonth' }] },
      docs: { fr: docs({ description, client, author, lang: 'fr', tp, feats, tasks, milestones, name, size }),
              en: docs({ description, client, author, lang: 'en', tp, feats, tasks, milestones, name, size }) }
    };
    // the project manager's registers (charter, stakeholders, RACI, risks, communication plan…), written for this project
    const PMx = typeof PM !== 'undefined' ? PM : (typeof require === 'function' ? require('./pm.js') : null);
    if (PMx) {
      const base = C.validateProject(project).project, fr = lang === 'fr';
      project.pm = PMx.generate(base, lang, (tp.risks || []).map(r => [fr ? r[0] : r[1], r[2], r[3], fr ? r[4] : r[5]]));
    }
    return { project, type: tp, detection: det };
  }

  /* ---- document text, in plain language for a non-technical client ---- */
  function docs({ description, client, author, lang, tp, feats, tasks, milestones, name, size }) {
    const fr = lang === 'fr', L = (a, b) => fr ? a : b, row = cells => cells.join(' | ');
    const d = s => new Date(C.parseDate(s)).toLocaleDateString(fr ? 'fr-FR' : 'en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'UTC' });
    const ms = id => milestones.find(m => m.id === id).date, weeks = Math.ceil((C.diffDays(C.parseDate(tasks[0].start), C.parseDate(ms('M6'))) + 1) / 7);
    const sizeW = { small: L('réduite (fonctions essentielles)', 'reduced (essential features)'), medium: L('standard', 'standard'), large: L('étendue (toutes les options)', 'extended (all options)') }[size];
    const later = tp.features.filter(f => !feats.includes(f));

    o.context = [
      L(`Demande du client : « ${String(description).trim()} ».`, `Client request: "${String(description).trim()}".`),
      L(`Ce projet est de type **${tp.fr}**. Il s’adresse aux ${tp.users[0].toLowerCase()} et sera porté par ${o.sponsor}.`, `This is a **${tp.en}** project. It serves ${tp.users[1].toLowerCase()} and is sponsored by ${o.sponsor}.`),
      L(`Ce document traduit la demande en besoins précis, propose une solution technique et un planning de ${weeks} semaines (portée ${sizeW}). Les termes techniques sont expliqués dans le lexique en fin de rapport.`,
        `This document turns the request into precise needs, proposes a technical solution and a ${weeks}-week schedule (${sizeW} scope). Technical terms are explained in the glossary at the end of the report.`)
    ].join('\n');
    o.objectives = [row(['#', L('Objectif', 'Objective'), L('Indicateur', 'Indicator'), L('Cible', 'Target')]),
      ...tp.objectives.map((x, i) => row([`O${i + 1}`, fr ? x[0] : x[1], fr ? x[2] : x[3], x[4]])),
      row([`O${tp.objectives.length + 1}`, L('Livrer à temps', 'Deliver on time'), L('Mise en service', 'Go-live'), d(ms('M5'))])].join('\n');
    o.scope = [L('## Inclus', '## Included'), ...feats.map(f => `- ${fr ? f[0] : f[1]}`),
      L('## Prévu pour une phase 2', '## Planned for a phase 2'), ...(later.length ? later.map(f => `- ${fr ? f[0] : f[1]}`) : [L('- Aucune fonction reportée', '- No feature postponed')]),
      L('## Exclu', '## Excluded'), ...tp.out.map(x => `- ${fr ? x[0] : x[1]}`)].join('\n');
    o.stakeholders = [row([L('Partie prenante', 'Stakeholder'), L('Rôle', 'Role'), L('Attente', 'Expectation')]),
      row([o.sponsor, L('Client / sponsor : valide les étapes', 'Client / sponsor: approves each stage'), L('Un résultat conforme, dans les délais', 'A compliant result, on time')]),
      row([fr ? tp.users[0] : tp.users[1], L('Utilisateurs finaux', 'End users'), L('Un outil simple et rapide', 'A simple, fast tool')]),
      row([L('Chef de projet', 'Project manager'), L('Pilote le planning et les risques', 'Runs schedule and risks'), L('Décisions rapides du client', 'Fast client decisions')]),

      ...feats.map((f, i) => row([`EF${i + 1}`, fr ? f[0] : f[1], fr ? f[2] : f[3], { M: L('Indispensable', 'Must'), S: L('Important', 'Should'), C: L('Optionnel', 'Could') }[f[6]]]))].join('\n');

        [L('Sécurité', 'Security'), L('Bonnes pratiques OWASP, données chiffrées en transit (HTTPS)', 'OWASP good practice, data encrypted in transit (HTTPS)')],

<script>/* Particle brain on a canvas: a slowly turning 3-D cloud of points shaped like a brain (two hemispheres,
   cerebellum, brain stem), with faint synapses and travelling pulses. Anchors mark the ten areas of a

   back to link them. Decorative only (aria-hidden): every action lives in real buttons. */

  const COLORS = { violet: '#8556F7', lav: '#D3AFFE', white: '#F9FAFA', gold: '#EBCA4C', pink: '#F28DC7', cyan: '#4FD1E8', good: '#5DD6A6', warn: '#F0A840', bad: '#F25F7A' };
  // where each knowledge area sits on the brain (x forward, y up), roughly following what that part of the brain does

    integration: [0.98, 0.18], scope: [0.62, 0.62], schedule: [0.1, 0.8], cost: [-0.42, 0.66], quality: [-0.92, 0.2],
    resources: [0.38, -0.12], communication: [0.82, -0.2], risk: [-0.35, 0.18], procurement: [-0.74, -0.52], stakeholders: [-0.02, -0.32]

      noProjT: 'Aucun projet ouvert', noProjL: 'Créez votre premier projet : décrivez-le en une phrase, et le planning, le budget, les documents et tout le kit du chef de projet sont préparés pour vous.' },
    en: { tabBrain: 'PM brain', tabPm: 'PM toolkit', brEyebrow: 'The project manager’s brain', brTitle: 'Everything a project manager does, wired to your project',
      brLead: 'Each area is one part of the job (the 10 PMBOK knowledge areas). Its colour follows the real state of the project; click to act.',
      brDoes: 'The project manager', brOpen: 'Open', brGood: 'Under control', brWarn: 'Watch', brBad: 'Action needed',
      pmAdd: 'Add a row', pmDel: 'Delete row', pmNew: 'New item', pmEmptyT: 'This project has no management registers yet',
      pmEmptyL: 'Generate the charter, stakeholders, RACI matrix, risks, communication plan and quality criteria from the schedule. Everything stays editable.',
      pmGen: 'Generate the project manager kit', pmGenDone: 'Management kit generated.', pmRoles: 'Roles (comma-separated)', pmItem: 'Deliverable',
      pmCopy: 'Copy', pmDl: 'Download (.txt)', pmCopied: 'Report copied.', pmReq: 'Required field', pmRows: 'rows', pmCount: 'item(s)',
      noProjT: 'No project open', noProjL: 'Create your first project: describe it in one sentence, and the schedule, budget, documents and the full project-manager kit are prepared for you.' }
  };
  const LONG = new Set(['response', 'rationale', 'criteria', 'notes', 'actions', 'lesson', 'action']);

  function init(App) {
    App.addStrings(STR.fr, STR.en);
    const { t, esc } = App, $ = id => document.getElementById(id);
    const L = () => PM.LBL[App.ui.lang];
    if (!App.ui.pmSec || !PM.SECTIONS.includes(App.ui.pmSec)) App.ui.pmSec = 'charter';
    const pBrain = $('tab-brain'), pPm = $('tab-pm');
    if (!pBrain || !pPm) return;

    /* ------------------------------ brain ------------------------------ */
    pBrain.innerHTML = `<div class="brain">
      <div class="brain-head"><p class="eyebrow" data-i="brEyebrow"></p><h2 class="brain-h" id="brTitle"></h2><p class="brain-lead" data-i="brLead"></p></div>
      <div class="brain-stage" id="brainStage"><canvas class="brain-cv" id="brainCv" aria-hidden="true"></canvas>
        <ul class="bn-col bn-l" id="bnL" role="list"></ul><ul class="bn-col bn-r" id="bnR" role="list"></ul></div>
      <div class="brain-foot"><div class="card brain-detail" id="brainDetail" aria-live="polite"></div>
        <ul class="brain-legend" aria-hidden="true"><li class="st-good" data-i="brGood"></li><li class="st-risk" data-i="brWarn"></li><li class="st-late" data-i="brBad"></li></ul></div></div>`;
    const stage = $('brainStage'), cv = $('brainCv');
    let areas = [], focusId = null, hoverId = null;
    const narrow = () => window.innerWidth < 820;
    const brain = Brain.create(cv, {
      offsetX: 0.5, scale: 0.36, count: 2200,
      targets() {
        if (narrow()) return [];
        const c = cv.getBoundingClientRect();
        return [...stage.querySelectorAll('[data-area]')].map(b => {
          const r = b.getBoundingClientRect(), left = b.closest('.bn-l');
          return { id: b.dataset.area, x: (left ? r.right : r.left) - c.left, y: r.top + r.height / 2 - c.top };
        });
      }
    });
    const stCls = s => (s === 'good' ? 'st-good' : s === 'warn' ? 'st-risk' : 'st-late');
    const ANCH = Brain.ANCHORS;
    function renderBrain() {
      const [h1, h2] = t('brTitle').split(/,\s*/);
      $('brTitle').innerHTML = h2 ? `${esc(h1)}, <em>${esc(h2)}</em>` : esc(h1);
      areas = PM.areas(App.project, App.today(), App.ui.lang);
      const node = a => `<li><button type="button" class="bn ${stCls(a.status)}${a.id === focusId ? ' on' : ''}" data-area="${esc(a.id)}" aria-describedby="brainDetail">
        <span class="bn-dot" aria-hidden="true"></span><span class="bn-t"><b>${esc(a.name)}</b><small>${esc(a.value)}</small></span></button></li>`;
      const byY = (a, b) => ANCH[b.id][1] - ANCH[a.id][1];
      $('bnR').innerHTML = areas.filter(a => ANCH[a.id][0] > 0).sort(byY).map(node).join('');
      $('bnL').innerHTML = areas.filter(a => ANCH[a.id][0] <= 0).sort(byY).map(node).join('');
      brain.status(Object.fromEntries(areas.map(a => [a.id, a.status])));
      if (!focusId || !areas.some(a => a.id === focusId)) focusId = (areas.find(a => a.status === 'bad') || areas.find(a => a.status === 'warn') || areas[0]).id;
      showDetail(hoverId || focusId);
    }
    function showDetail(id) {
      const a = areas.find(x => x.id === id); if (!a) return;
      stage.querySelectorAll('[data-area]').forEach(b => b.classList.toggle('on', b.dataset.area === id));
      brain.focus(id);
      const modName = a.go.startsWith('pm:') ? PM.LBL[App.ui.lang][a.go.slice(3)][0] : t({ tasks: 'tabTasks', gantt: 'tabGantt', budget: 'tabBudget' }[a.go]);
      $('brainDetail').innerHTML = `<div class="bd-in"><span class="pill ${stCls(a.status)}">${esc(t(a.status === 'good' ? 'brGood' : a.status === 'warn' ? 'brWarn' : 'brBad'))}</span>
        <h3>${esc(a.name)}</h3><p class="hint"><b>${esc(t('brDoes'))}</b> ${esc(a.does.charAt(0).toLowerCase() + a.does.slice(1))}.</p>
        <p class="bd-val"><b>${esc(a.value)}</b><span>${esc(a.detail)}</span></p>
        <button class="btn pri" type="button" data-go="${esc(a.id)}">${esc(t('brOpen'))} · ${esc(modName)} →</button></div>`;
    }
    function go(id) {
      const a = areas.find(x => x.id === id); if (!a) return;
      if (a.go.startsWith('pm:')) { App.ui.pmSec = a.go.slice(3); App.goTab('pm'); renderPm(); }
      else App.goTab(a.go);
    }
    pBrain.addEventListener('click', ev => {
      const b = ev.target.closest('[data-area]'); if (b) { if (focusId === b.dataset.area || narrow()) go(b.dataset.area); else { focusId = b.dataset.area; showDetail(focusId); } return; }
      const g = ev.target.closest('[data-go]'); if (g) go(g.dataset.go);
    });
    pBrain.addEventListener('dblclick', ev => { const b = ev.target.closest('[data-area]'); if (b) go(b.dataset.area); });
    const hover = id => { hoverId = id; showDetail(id || focusId); };
    pBrain.addEventListener('pointerover', ev => { const b = ev.target.closest('[data-area]'); if (b && b.dataset.area !== hoverId) hover(b.dataset.area); });
    pBrain.addEventListener('pointerleave', () => hover(null));
    pBrain.addEventListener('focusin', ev => { const b = ev.target.closest('[data-area]'); if (b) { focusId = b.dataset.area; showDetail(focusId); } });

    /* --------------------------- PM toolkit --------------------------- */
    pPm.innerHTML = `<div class="pm-wrap"><nav class="pm-nav" id="pmNav" aria-label="${esc(t('tabPm'))}"></nav><div id="pmMain"></div></div>`;
    const pm = () => App.project.pm;
    let pending = null;
    const flush = () => { if (!pending) return; clearTimeout(pending); pending = null; App.mutate(() => {}); };
    const soon = () => { clearTimeout(pending); pending = setTimeout(() => { pending = null; App.mutate(() => {}); }, 450); };
    const count = k => k === 'charter' ? (pm().charter.purpose ? 1 : 0) : k === 'raci' ? pm().raci.rows.length : k === 'report' ? '' : pm()[k].length;
    const fmtD = v => v ? App.dLabel(App.Core.parseDate(v), true) : '';
    function cell(reg, i, row, [k, type, lim, req]) {
      const id = `pm-${reg}-${i}-${k}`, lab = esc(L().col[k] || k), v = row[k], ro = App.readOnly ? ' disabled' : '';
      if (type === 'enum') return `<select id="${id}" data-reg="${reg}" data-row="${i}" data-col="${k}" aria-label="${lab}"${ro}>${lim.map(o => `<option value="${o}"${o === v ? ' selected' : ''}>${esc(L().en_[o] || o)}</option>`).join('')}</select>`;
      if (type === 'int') return `<input id="${id}" type="number" class="pm-num" min="${lim[0]}" max="${lim[1]}" step="1" value="${esc(v)}" data-reg="${reg}" data-row="${i}" data-col="${k}" aria-label="${lab}"${ro}>`;
      if (type === 'date') return `<input id="${id}" type="date" value="${esc(v)}" data-reg="${reg}" data-row="${i}" data-col="${k}" aria-label="${lab}"${ro}>`;
      return `<textarea id="${id}" rows="1" class="grow${LONG.has(k) ? ' long' : ' short'}" maxlength="${lim}" data-reg="${reg}" data-row="${i}" data-col="${k}" aria-label="${lab}"${req ? ' data-req="1"' : ''}${ro}>${esc(v)}</textarea>`;
    }
    const scoreCls = s => (s >= 15 ? 'sc-bad' : s >= 10 ? 'sc-hi' : s >= 5 ? 'sc-mid' : 'sc-low');
    function table(reg) {
      const cols = PM.REG[reg], rows = pm()[reg];
      const sc = r => `<td class="c-score" data-label="${esc(L().col.score)}"><span class="score ${scoreCls(r.p * r.i)}">${r.p * r.i}</span></td>`;
      const head = (reg === 'stakeholders' ? '<th class="c-n">#</th>' : '') + cols.map(([k]) => `<th class="c-${k}">${esc(L().col[k] || k)}</th>${reg === 'risks' && k === 'i' ? `<th class="c-score">${esc(L().col.score)}</th>` : ''}`).join('') + '<th></th>';
      const body = rows.map((r, i) => `<tr>${reg === 'stakeholders' ? `<td class="c-n"><span class="num-dot">${i + 1}</span></td>` : ''}${cols.map(c => `<td class="c-${c[0]}" data-label="${esc(L().col[c[0]] || c[0])}">${cell(reg, i, r, c)}</td>${reg === 'risks' && c[0] === 'i' ? sc(r) : ''}`).join('')}
        <td class="r">${App.readOnly ? '' : `<button type="button" class="icon-btn" data-del="${i}" aria-label="${esc(t('pmDel'))} ${i + 1}">×</button>`}</td></tr>`).join('');
      return `<div class="tbl-wrap pm-tbl"><table class="pm-t pm-cards t-${reg}"><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length + 3}" class="hint empty-row">${esc(L().none)}</td></tr>`}</tbody></table></div>`;
    }
    function heatmap() {
      const open = pm().risks.filter(r => r.status !== 'closed');
      let h = `<div class="heat" role="img" aria-label="${esc(L().heat)}"><span class="heat-y">${esc(L().probability)}</span><div class="heat-g">`;
      for (let p = 5; p >= 1; p--) for (let i = 1; i <= 5; i++) {
        const here = open.filter(r => r.p === p && r.i === i);
        h += `<div class="hc ${scoreCls(p * i)}${here.length ? ' has' : ''}" title="${p}×${i}=${p * i}">${here.length ? `<b>${here.length}</b>` : ''}</div>`;
      }
      return h + `</div><span class="heat-x">${esc(L().impact)}</span></div>`;
    }
    function grid() {
      const q = L().grid;
      return `<div class="pi-grid" role="img" aria-label="${esc(PM.LBL[App.ui.lang].stakeholders[0])}"><span class="pi-y">${esc(L().col.influence)} ↑</span>
        <div class="pi-box"><div class="pi-q">${esc(q[0])}</div><div class="pi-q">${esc(q[1])}</div><div class="pi-q">${esc(q[2])}</div><div class="pi-q">${esc(q[3])}</div>
        ${pm().stakeholders.map((s, n) => { const same = pm().stakeholders.slice(0, n).filter(o => o.interest === s.interest && o.influence === s.influence).length;
          return `<span class="pi-dot" style="left:calc(${(s.interest - 1) / 4 * 76 + 12}% + ${same * 14}px);bottom:${(s.influence - 1) / 4 * 60 + 20}%" title="${esc(s.name)}">${n + 1}</span>`; }).join('')}</div>
        <span class="pi-x">${esc(L().col.interest)} →</span></div>`;
    }
    function topRisks() {
      const top = pm().risks.filter(r => r.status !== 'closed').sort((a, b) => b.p * b.i - a.p * a.i).slice(0, 4);
      return `<ol class="pm-side">${top.map(r => `<li><span class="score ${scoreCls(r.p * r.i)}">${r.p * r.i}</span><span><b>${esc(r.title)}</b><small>${esc(r.response || '—')}</small></span></li>`).join('') || `<li class="hint">${esc(L().none)}</li>`}</ol>`;
    }
    function legendSh() {
      return `<ol class="pm-side">${pm().stakeholders.map((s, n) => `<li><span class="num-dot">${n + 1}</span><span><b>${esc(s.name)}</b><small>${esc(L().en_[s.strategy] || s.strategy)} · ${esc(L().col.influence)} ${s.influence}/5 · ${esc(L().col.interest)} ${s.interest}/5</small></span></li>`).join('') || `<li class="hint">${esc(L().none)}</li>`}</ol>`;
    }
    function raci() {
      const R = pm().raci, issues = new Map(PM.raciIssues(R, App.ui.lang).map(x => [x.id, x.msg])), ro = App.readOnly ? ' disabled' : '';
      return `<p class="hint">${esc(L().raciLegend)}</p>
        <div class="f pm-roles"><label for="pm-raci-roles">${esc(t('pmRoles'))}</label><input id="pm-raci-roles" maxlength="200" value="${esc(R.roles.join(', '))}"${ro}></div>
        <div class="tbl-wrap pm-tbl"><table class="pm-t t-raci"><thead><tr><th>${esc(t('pmItem'))}</th>${R.roles.map(r => `<th class="c">${esc(r)}</th>`).join('')}<th></th></tr></thead><tbody>
        ${R.rows.map((r, i) => `<tr><td><input id="pm-raci-item-${i}" data-raci-item="${i}" maxlength="120" value="${esc(r.item)}" aria-label="${esc(t('pmItem'))}"${ro}>${issues.has(r.id) ? `<span class="chip c-late raci-warn">${esc(issues.get(r.id))}</span>` : ''}</td>
          ${R.roles.map(ro2 => { const v = R.cells[`${r.id}|${ro2}`] || ''; return `<td class="c"><select id="pm-raci-${i}-${esc(ro2)}" class="raci-sel rc-${v || 'n'}" data-raci="${esc(r.id)}|${esc(ro2)}" aria-label="${esc(r.item)} · ${esc(ro2)}"${ro}><option value="">·</option>${PM.RACI.map(x => `<option${x === v ? ' selected' : ''}>${x}</option>`).join('')}</select></td>`; }).join('')}
          <td class="r">${App.readOnly ? '' : `<button type="button" class="icon-btn" data-raci-del="${i}" aria-label="${esc(t('pmDel'))} ${i + 1}">×</button>`}</td></tr>`).join('')}</tbody></table></div>`;
    }
    function charter() {
      const c = pm().charter, ro = App.readOnly ? ' disabled' : '', col = L().col;
      const ta = k => `<div class="f wide"><label for="pm-ch-${k}">${esc(col[k])}</label><textarea id="pm-ch-${k}" class="doc-ta" data-ch="${k}" rows="3" maxlength="600"${ro}>${esc(c[k])}</textarea></div>`;
      const inp = k => `<div class="f"><label for="pm-ch-${k}">${esc(col[k])}</label><input id="pm-ch-${k}" data-ch="${k}" maxlength="120" value="${esc(c[k])}"${ro}></div>`;
      return `<div class="form pm-charter">${ta('purpose')}${inp('sponsor')}${inp('manager')}${ta('success')}
        <div class="f"><label class="chk"><input type="checkbox" id="pm-ch-approved" data-ch="approved"${c.approved ? ' checked' : ''}${ro}> <span>${esc(col.approved)}</span></label></div>
        <div class="f"><label for="pm-ch-approvedOn">${esc(col.approvedOn)}</label><input type="date" id="pm-ch-approvedOn" data-ch="approvedOn" value="${esc(c.approvedOn)}"${ro}></div></div>`;
    }
    function report() {
      return `<textarea class="report-box" id="pmReport" readonly rows="18" aria-label="${esc(L().report[0])}">${esc(PM.statusReport(App.project, App.today(), App.ui.lang))}</textarea>
        <div class="actions"><button class="btn pri" type="button" id="pmCopy">${esc(t('pmCopy'))}</button><button class="btn" type="button" id="pmDlRep">${esc(t('pmDl'))}</button></div>`;
    }
    function renderPm() {
      const sec = App.ui.pmSec;
      $('pmNav').innerHTML = PM.SECTIONS.map(k => { const n = count(k); return `<button type="button" data-sec="${k}" aria-current="${k === sec}">${esc(L()[k][0])}${n !== '' ? `<span class="n">${n}</span>` : ''}</button>`; }).join('');
      if (PM.isEmpty(pm()) && App.project.tasks.length && !App.readOnly) {
        $('pmMain').innerHTML = `<div class="card onboard pm-empty"><div class="card-b"><p class="eyebrow">${esc(t('tabPm'))}</p><h2 class="wiz-h">${esc(t('pmEmptyT'))}</h2><p class="hint">${esc(t('pmEmptyL'))}</p>
          <div class="actions"><button class="btn pri" type="button" id="pmGen">${esc(t('pmGen'))}</button></div></div></div>`;
        return;
      }
      const canAdd = !App.readOnly && !['charter', 'report'].includes(sec);
      const body = sec === 'charter' ? charter() : sec === 'raci' ? raci() : sec === 'report' ? report()
        : sec === 'risks' ? `<div class="pm-top">${heatmap()}${topRisks()}</div>${table('risks')}`
        : sec === 'stakeholders' ? `<div class="pm-top">${grid()}${legendSh()}</div>${table('stakeholders')}` : table(sec);
      queueMicrotask(autosize);
      $('pmMain').innerHTML = `<div class="card pm-card"><div class="card-h"><div class="pm-h"><h2>${esc(L()[sec][0])}</h2><p class="hint">${esc(L()[sec][1])}</p></div>
        ${canAdd ? `<button class="btn sm" type="button" id="pmAdd">+ ${esc(t('pmAdd'))}</button>` : ''}</div><div class="card-b">${body}</div></div>`;
    }
    function autosize(el) {
      const list = el && el.nodeType ? [el] : pPm.querySelectorAll('textarea.grow');
      list.forEach(t => { t.style.height = 'auto'; if (t.scrollHeight) t.style.height = t.scrollHeight + 2 + 'px'; });
    }
    pPm.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('textarea.short')) ev.preventDefault(); });
    function newRow(reg) {
      const r = { id: 'n' + Date.now().toString(36).slice(-6) };
      for (const [k, type, lim, req] of PM.REG[reg]) r[k] = type === 'enum' ? lim[0] : type === 'int' ? Math.max(lim[0], Math.min(lim[1], k === 'p' || k === 'i' || k === 'influence' || k === 'interest' ? 3 : 0)) : type === 'date' ? App.Core.fmt(App.today()) : req ? t('pmNew') : '';
      return r;
    }
    pPm.addEventListener('click', ev => {
      const s = ev.target.closest('[data-sec]');
      if (s) { flush(); App.ui.pmSec = s.dataset.sec; App.persist(); renderPm(); document.querySelector(`#pmNav [data-sec="${s.dataset.sec}"]`)?.focus(); return; }
      if (App.readOnly) { if (ev.target.closest('#pmCopy')) copyReport(); return; }
      if (ev.target.closest('#pmGen')) { App.mutate(P => { P.pm = PM.generate(App.Core.validateProject(P).project, App.ui.lang, []); }); App.toast(t('pmGenDone')); return; }
      if (ev.target.closest('#pmAdd')) {
        const sec = App.ui.pmSec; flush();
        App.mutate(P => { if (sec === 'raci') { const id = 'D' + Date.now().toString(36).slice(-5); P.pm.raci.rows.push({ id, item: t('pmNew') }); if (P.pm.raci.roles.includes('PM')) P.pm.raci.cells[`${id}|PM`] = 'A'; } else P.pm[sec].push(newRow(sec)); });
        const last = pPm.querySelector('tbody tr:last-child input, tbody tr:last-child textarea'); last && (last.focus(), last.select && last.select());
        return;
      }
      const d = ev.target.closest('[data-del]'); if (d) { flush(); const sec = App.ui.pmSec, i = +d.dataset.del; App.mutate(P => { P.pm[sec].splice(i, 1); }); return; }
      const rd = ev.target.closest('[data-raci-del]'); if (rd) { flush(); const i = +rd.dataset.raciDel; App.mutate(P => { P.pm.raci.rows.splice(i, 1); }); return; }
      if (ev.target.closest('#pmCopy')) copyReport();
      if (ev.target.closest('#pmDlRep')) { const txt = $('pmReport').value; App.saveFile(new TextEncoder().encode(txt), `${(App.project.code || 'projet').replace(/[^\w-]+/g, '-')}-status.txt`, 'text/plain').then(r => r === 'saved' && App.toast(t('downloaded') + 'status.txt')); }
    });
    function copyReport() {
      const box = $('pmReport'); if (!box) return;
      try { navigator.clipboard.writeText(box.value).then(() => App.toast(t('pmCopied')), () => { box.focus(); box.select(); }); } catch { box.focus(); box.select(); }
    }
    function onEdit(ev, immediate) {
      if (App.readOnly) return;
      const el = ev.target, P = App.project;
      if (el.dataset.reg) {
        const row = P.pm[el.dataset.reg][+el.dataset.row]; if (!row) return;
        const v = el.type === 'number' ? Number(el.value) : el.value;
        if (el.dataset.req && !String(v).trim()) { el.setAttribute('aria-invalid', 'true'); el.title = t('pmReq'); return; }
        el.removeAttribute('aria-invalid'); row[el.dataset.col] = v;
      } else if (el.dataset.ch) P.pm.charter[el.dataset.ch] = el.type === 'checkbox' ? el.checked : el.value;
      else if (el.dataset.raci) { const [rid, role] = el.dataset.raci.split('|'); if (el.value) P.pm.raci.cells[`${rid}|${role}`] = el.value; else delete P.pm.raci.cells[`${rid}|${role}`]; }
      else if (el.dataset.raciItem) { const r = P.pm.raci.rows[+el.dataset.raciItem]; if (!r || !el.value.trim()) return; r.item = el.value; }
      else if (el.id === 'pm-raci-roles') { P.pm.raci.roles = el.value.split(',').map(x => x.trim()).filter(Boolean); }
      else return;
      immediate ? (clearTimeout(pending), pending = null, App.mutate(() => {})) : soon();
    }
    pPm.addEventListener('input', ev => { if (ev.target.matches && ev.target.matches('textarea.grow')) autosize(ev.target); if (ev.target.tagName !== 'SELECT' && ev.target.type !== 'checkbox' && ev.target.type !== 'date') onEdit(ev, false); });
    pPm.addEventListener('change', ev => { const el = ev.target; onEdit(ev, el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'date'); });

    /* --------------------- render + empty state ---------------------- */
    App.on('render', () => {
      if (App.empty) return;
      renderBrain();
      if (!pending) renderPm();
    });
    App.on('tab', id => { if (id === 'brain' && !App.empty) { brain.redraw(); brain.start(); } else brain.stop(); });
    window.addEventListener('resize', () => { if (App.ui.tab === 'brain') brain.redraw(); });
    return { brain };
  }
  return { init, STR };
})();
if (typeof module !== 'undefined') module.exports = PMUI;
</script>
<script>/* Account layer: sign-in, workspaces, portfolio, team, client share links, activity, live saving.
   Runs only when the build provides CLOUD_CONFIG (Supabase URL + anon key) and supabase-js is loaded;
   otherwise the tracker stays in local demo mode, exactly as before. */
const CloudUI = (() => {
  const STR = {
    fr: {

    const rel = iso => { const s = (Date.now() - Date.parse(iso)) / 1000; if (!(s >= 0)) return ''; if (s < 60) return t('now'); if (s < 3600) return `${Math.floor(s / 60)} ${t('min')}`; if (s < 86400) return `${Math.floor(s / 3600)} ${t('h')}`; return `${Math.floor(s / 86400)} ${t('d')}`; };

    /* ---------- sign-in gate: the first screen in cloud mode ---------- */
    const gate = $('gate'), gateCard = $('gateCard');

      $('lpMore').innerHTML = `<section class="wrap lp-sec" id="lp-features">${head('lpFeatEy', 'lpFeatH', 'lpFeatL')}
          <div class="lp-grid">${L.lpFeats.map(([ic, h, d]) => `<article class="lp-feat"><span class="lp-ic" aria-hidden="true">${esc(ic)}</span><h3>${esc(h)}</h3><p>${esc(d)}</p></article>`).join('')}</div></section>

    function showGate(card) {
      document.body.classList.add('gated'); gate.hidden = false; renderGateCopy();

      if (typeof Brain !== 'undefined' && !gateBrain) { gateBrain = Brain.create($('gateCv'), { count: 2400, place: (W, H) => W > 900 ? { offsetX: 0.57, offsetY: 0.5, scale: 0.34 } : { offsetX: 0.5, cy: 185, scale: 120 / Math.min(W, H) } }); }

    function gateLoading() { showGate({ html: `<p class="gate-load">${esc(t('loading'))}</p>` }); }
    gate.addEventListener('click', ev => {
      const j = ev.target.closest('[data-jump]'); if (j) { $(j.dataset.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      const c = ev.target.closest('[data-cta]');

    function openAuth(mode = 'in', note) {
