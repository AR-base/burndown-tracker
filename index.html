<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bilingual FR/EN burndown and Gantt tracker for any project">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Project Burndown Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark "mission control" world from the client palette — frosted header holding the view switcher,
   glass cards on a midnight field, coral reserved for the single thing that matters on each screen. */
:root{
  color-scheme:dark;
  --bg:#11151C; --bg-2:#141A24; --navy:#212D40; --slate:#364156; --rose:#7D4E57; --coral:#D66853;
  --surface:#1A2332; --sunk:#161D29; --raise:#253148;
  --glass:rgba(33,45,64,.58); --glass-strong:rgba(26,35,50,.86);
  --line:rgba(140,156,186,.16); --line-strong:#364156; --grid:rgba(54,65,86,.62);
  --ink:#F3EEE9; --muted:#A3ACBD; --faint:#6E798D;
  --accent:#D66853; --accent-2:#B3707D; --accent-soft:rgba(214,104,83,.16); --accent-glow:rgba(214,104,83,.42);
  --ideal:#8B97AF; --good:#5CC9A1; --warn:#EDB45B; --bad:#F2657D;
  --good-soft:rgba(92,201,161,.14); --warn-soft:rgba(237,180,91,.15); --bad-soft:rgba(242,101,125,.15);
  --f-display:'Sora','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Manrope','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:14px; --r-sm:10px; --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -18px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(1200px 600px at 85% -10%,rgba(125,78,87,.22),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(33,45,64,.9),transparent 60%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass-strong)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.35;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass-strong);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 220px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,var(--coral),var(--rose));box-shadow:0 6px 18px -6px var(--accent-glow)}
.brand-t{display:flex;flex-direction:column;min-width:0}
.eyebrow{font:600 10.5px/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand h1{font:600 16px/1.25 var(--f-display);margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38ch}
.bar-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(17,21,28,.6);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font:600 13px/1 var(--f-body);color:var(--muted);white-space:nowrap;transition:color .2s,background .25s var(--ease)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--raise);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 4px 14px -6px rgba(0,0,0,.6)}
@media (max-width:1060px){.tabs{order:3;flex:1 1 100%}}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(17,21,28,.6);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font:600 12px/1 var(--f-body);color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.kbd-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(17,21,28,.5);color:var(--muted);border-radius:999px;padding:6px 10px 6px 12px;cursor:pointer;font-size:12.5px}
.kbd-btn:hover{color:var(--ink);border-color:var(--line-strong)}
kbd{font:500 11px var(--f-mono);padding:2px 6px;border-radius:6px;background:var(--raise);color:var(--muted);border:1px solid var(--line)}

/* page head */
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:18px 0}
.meta{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;font:600 12px/1.2 var(--f-body);letter-spacing:.02em;border:1px solid currentColor}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.st-on{color:var(--good);background:var(--good-soft)} .st-risk{color:var(--warn);background:var(--warn-soft)} .st-late{color:var(--bad);background:var(--bad-soft)}

/* glass surfaces with a cursor spotlight */
.card,.kpi,.wiz-main,.wiz-steps li{position:relative;isolation:isolate}
.card::after,.kpi::after,.wiz-main::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .35s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(214,104,83,.10),transparent 45%)}
.card:hover::after,.kpi:hover::after,.wiz-main:hover::after{opacity:1}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font:600 15px/1.3 var(--f-display);margin:0;letter-spacing:.005em}
.card-b{padding:16px 18px}
.hint{font-size:12.5px;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;box-shadow:var(--shadow);transition:transform .35s var(--ease),border-color .3s}
.kpi:hover{transform:translateY(-2px);border-color:rgba(214,104,83,.35)}
.kpi .k{font:600 10.5px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:600 26px/1.15 var(--f-display);margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v small{font:500 12px var(--f-body);color:var(--muted);letter-spacing:0}
.kpi .s{font-size:12px;color:var(--muted);margin-top:3px}
.meter{height:5px;background:rgba(17,21,28,.8);border-radius:3px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--coral));border-radius:3px;box-shadow:0 0 12px var(--accent-glow)}
.ring{display:flex;align-items:center;gap:12px;margin-top:6px}
.ring svg{flex:none}
.ring .v{margin-top:0}

/* panels */
.panel{padding-block:18px 48px}
.panel:not([hidden]){animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px}

/* chart */
.chart-box{position:relative}
.chart-box svg{display:block;width:100%;height:auto}
.chart-box svg path.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s var(--ease) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top:2px solid}
.tip{position:absolute;pointer-events:none;background:var(--glass-strong);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line-strong);color:var(--ink);font:12px/1.4 var(--f-mono);padding:7px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-110%);box-shadow:var(--shadow)}
.bd-hint{margin:0;padding:0 18px 14px}

/* lists */
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mini li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.mini li:last-child{border-bottom:0}
.tid{font:500 11.5px var(--f-mono);color:var(--faint)}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font:600 11px/1.4 var(--f-body);white-space:nowrap}
.c-done{background:var(--good-soft);color:var(--good)} .c-late{background:var(--bad-soft);color:var(--bad)}
.c-inprog{background:var(--accent-soft);color:var(--accent)} .c-todo{background:rgba(54,65,86,.5);color:var(--muted)}
.sec-t{font:600 10.5px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.sec-t:first-child{margin-top:0}

/* gantt */
.g-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.g-tools label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.gantt{display:grid;grid-template-columns:minmax(150px,var(--lw,300px)) minmax(0,1fr)}
.g-left{border-right:1px solid var(--line);overflow:hidden}
.g-right{overflow-x:auto;scrollbar-color:var(--slate) transparent}
.g-left svg,.g-right svg{display:block}
@media (max-width:640px){.gantt{--lw:150px}}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 10.5px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:rgba(17,21,28,.35)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(54,65,86,.25)}
tr.phase-row td{background:rgba(17,21,28,.4);font:600 12.5px var(--f-display)}
tr.total-row td{font-weight:700;border-top:1px solid var(--line-strong)}
td.r,th.r{text-align:right}
.pbar{width:84px;height:6px;background:rgba(17,21,28,.8);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.pbar i{display:block;height:100%;border-radius:3px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:rgba(54,65,86,.35);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;font:600 13px/1.2 var(--f-body);transition:transform .2s var(--ease),background .2s,border-color .2s,box-shadow .25s}
.btn:hover{background:rgba(54,65,86,.6);border-color:#4A5874}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#E0735E,var(--coral));border-color:transparent;color:#fff;box-shadow:0 8px 22px -10px var(--accent-glow),0 1px 0 rgba(255,255,255,.25) inset}
.btn.pri:hover{box-shadow:0 10px 28px -8px var(--accent-glow),0 1px 0 rgba(255,255,255,.25) inset;filter:brightness(1.05)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.55;cursor:progress}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.lbl{font:600 10.5px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea,.edit-row input,.extra-row input,.extra-row select,.rate-in{border:1px solid var(--line);background:rgba(17,21,28,.55);border-radius:var(--r-sm);padding:9px 11px;min-width:0;width:100%;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.f input:focus,.f select:focus,.f textarea:focus,.edit-row input:focus,.extra-row input:focus,.extra-row select:focus,.rate-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f input[type=range]{padding:0;accent-color:var(--coral)}
input[type=checkbox]{accent-color:var(--coral)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
.f.wide{grid-column:1/-1}
.f textarea{font:12px/1.55 var(--f-mono);min-height:160px;resize:vertical}
.doc-ta{min-height:96px !important;font:13px/1.55 var(--f-body) !important}
.err{color:var(--bad);font-size:12.5px;min-height:1em}
.ok{color:var(--good);font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.edit-rows{display:flex;flex-direction:column;gap:8px}
.edit-row{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr) 120px auto;gap:8px;align-items:center}
.edit-row input[type=color]{padding:2px;height:36px}
@media (max-width:640px){.edit-row{grid-template-columns:1fr 1fr}}
.doc-lang{margin:0 0 12px;padding:10px 14px;border-radius:var(--r-sm);background:var(--accent-soft);border:1px solid rgba(214,104,83,.3);font-size:13px}

/* download menu */
.dl{position:relative}
.dl-btn{padding:8px 16px}
.dl-menu{position:absolute;right:0;top:calc(100% + 10px);z-index:40;width:300px;max-width:calc(100vw - 32px);background:var(--glass-strong);-webkit-backdrop-filter:saturate(1.4) blur(20px);backdrop-filter:saturate(1.4) blur(20px);border:1px solid var(--line-strong);border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);padding:6px;animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.dl-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left;font-size:13.5px;color:var(--ink)}
.dl-menu button:hover,.dl-menu button:focus-visible{background:rgba(214,104,83,.14)}
.dl-menu small{font:500 11px var(--f-mono);color:var(--muted)}
.dl-h{font:600 10.5px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 12px 4px}
.dl-note{font-size:11.5px;color:var(--muted);margin:6px 12px 2px}
.dl-status{font-size:12px;margin:4px 12px 6px;color:var(--good);overflow-wrap:anywhere}
.dl-status:empty{display:none}
.dl-status.err{color:var(--bad)}

/* assistant */
.wiz{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.wiz{grid-template-columns:minmax(0,1fr)}}
.wiz-main{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow:hidden;box-shadow:var(--shadow)}
.wiz-main::before{content:"";position:absolute;z-index:-2;width:520px;height:520px;right:-180px;top:-260px;border-radius:50%;filter:blur(60px);opacity:.55;
  background:conic-gradient(from 0deg,var(--coral),var(--rose),var(--slate),var(--coral));animation:orb 14s linear infinite}
@keyframes orb{to{transform:rotate(360deg)}}
.wiz-h{font:700 clamp(24px,3.2vw,36px)/1.08 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance;max-width:20ch}
.wiz-h em{font-style:normal;background:linear-gradient(90deg,var(--coral),#F0A08C);-webkit-background-clip:text;background-clip:text;color:transparent}
.wiz-lead{margin:0;color:var(--muted);max-width:62ch;font-size:15px}
.wiz-input{width:100%;border:1px solid var(--line-strong);border-radius:16px;background:rgba(17,21,28,.6);padding:16px 18px;font:17px/1.5 var(--f-body);resize:vertical;min-height:96px;color:var(--ink);transition:border-color .25s,box-shadow .3s}
.wiz-input::placeholder{color:var(--faint)}
.wiz-input:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 4px var(--accent-soft),0 12px 40px -12px var(--accent-glow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:rgba(17,21,28,.45);border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--muted);transition:all .2s var(--ease)}
.chips button:hover{border-color:var(--coral);color:var(--ink);transform:translateY(-1px)}
.wiz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.wiz-grid .seg{width:100%}.wiz-grid .seg button{flex:1;padding:9px 6px}
.wiz-detect{margin:0;font-size:13px;color:var(--muted);min-height:1.4em}
.wiz-detect b{color:var(--ink);padding:2px 10px;border-radius:999px;background:var(--accent-soft);border:1px solid rgba(214,104,83,.35);margin-left:4px}
.wiz-go{padding:12px 22px;font-size:15px}
.wiz-ai{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.wiz-steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.wiz-steps li{counter-increment:s;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 16px 58px;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.wiz-steps li::before{content:counter(s);position:absolute;left:16px;top:16px;width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,var(--coral),var(--rose));color:#fff;font:600 13px/28px var(--f-mono);text-align:center;box-shadow:0 6px 16px -6px var(--accent-glow)}
.wiz-steps b{color:var(--ink);font:600 14.5px var(--f-display)}
.wiz-res{margin-top:16px;border-color:rgba(214,104,83,.45);box-shadow:0 0 0 1px rgba(214,104,83,.15),0 24px 60px -24px var(--accent-glow)}
.wiz-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:0 0 4px}
.wiz-stats div{min-width:0;padding:12px 14px;border-radius:12px;background:rgba(17,21,28,.4);border:1px solid var(--line)}
.wiz-stats dt{font:600 10.5px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wiz-stats dd{margin:6px 0 0;font:600 17px/1.3 var(--f-display);overflow-wrap:anywhere}

/* budget */
.bud-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bud-kpis .kpi.total{background:linear-gradient(150deg,rgba(214,104,83,.22),rgba(125,78,87,.18));border-color:rgba(214,104,83,.4)}
.bud-kpis .kpi.total .v{color:#F6B4A5}
.rate-in{width:96px;padding:5px 8px;text-align:right;font:500 13px var(--f-mono)}
.pc-row{display:grid;grid-template-columns:minmax(120px,1.3fr) minmax(0,2fr) auto;gap:12px;align-items:center;padding:8px 0;font-size:13px}
.pc-row>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-bar{height:10px;background:rgba(17,21,28,.8);border-radius:5px;overflow:hidden}.pc-bar i{display:block;height:100%;border-radius:5px;transition:width .6s var(--ease)}
.extra-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.4fr) 92px minmax(0,1fr) 96px auto;gap:8px;align-items:center}
@media (max-width:760px){.extra-row{grid-template-columns:1fr 1fr}}
.ex-tot{text-align:right;font-size:13px}
.cont-why{margin:12px 0 0;font-size:13px;color:var(--muted)}.cont-why b{color:var(--ink)}
.bud-form{margin-top:12px;max-width:560px}

/* command bar */
.cmdk{position:fixed;inset:0;z-index:100;display:grid;place-items:start center;padding:12vh 16px 16px}
.cmdk-back{position:absolute;inset:0;background:rgba(8,10,14,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.cmdk-box{position:relative;width:min(620px,100%);background:var(--glass-strong);-webkit-backdrop-filter:saturate(1.5) blur(24px);backdrop-filter:saturate(1.5) blur(24px);border:1px solid var(--line-strong);border-radius:18px;box-shadow:0 40px 90px -30px rgba(0,0,0,.8),0 0 0 1px rgba(214,104,83,.08);overflow:hidden;animation:pop .22s var(--ease)}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdk-in input{flex:1;border:0;background:none;outline:none;font:16px var(--f-body);color:var(--ink);min-width:0}
.cmdk-in input::placeholder{color:var(--faint)}
.cmdk ul{list-style:none;margin:0;padding:6px;max-height:min(52vh,420px);overflow-y:auto}
.cmdk li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px}
.cmdk li .ci{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(54,65,86,.5);color:var(--muted);flex:none;font:600 12px var(--f-mono)}
.cmdk li small{margin-left:auto;color:var(--faint);font:500 11px var(--f-mono)}
.cmdk li[aria-selected="true"]{background:rgba(214,104,83,.16)}
.cmdk li[aria-selected="true"] .ci{background:var(--coral);color:#fff}
.cmdk-empty{padding:18px;color:var(--muted);font-size:13px}

/* toasts */
.toasts{position:fixed;z-index:120;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:min(380px,calc(100vw - 32px));padding:11px 16px;border-radius:14px;background:var(--glass-strong);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line-strong);box-shadow:0 20px 40px -18px rgba(0,0,0,.7);font-size:13.5px;animation:toast .35s var(--ease)}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);flex:none}
.toast.err::before{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.toast.out{animation:toastOut .3s var(--ease) forwards}
@keyframes toast{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}

/* phone */
@media (max-width:640px){
  .brand{flex:1 1 0}
  .brand h1{font-size:15px;max-width:none}
  .eyebrow{display:none}
  .bar-act{flex-wrap:nowrap;gap:6px}
  #newBtn span[data-i],.dl-btn span[data-i],.kbd-btn kbd{display:none}
  #newBtn,.dl-btn{padding:8px 11px}
  .kbd-btn{padding:8px 10px}
  .seg button{padding:6px 9px}
  .kpis{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin-inline:-16px;padding:0 16px 6px;scrollbar-width:none}
  .kpis::-webkit-scrollbar{display:none}
  .kpi{flex:0 0 68%;scroll-snap-align:start}
  .wiz-main{padding:20px;border-radius:18px}
  .hero-meta{padding-block:14px 0}
}
@media (max-width:380px){.seg[aria-label="Language"]{display:none}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.chart-box svg path.draw{stroke-dasharray:none;stroke-dashoffset:0}}

<script>/* Core planning logic — pure functions, no DOM. Tested in core.test.js */
const Core = (() => {
  const DAY = 86400000;
  const ISO = /^\d{4}-\d{2}-\d{2}$/;
  const ID = /^[A-Za-z0-9_-]{1,16}$/;
  const HEX = /^#[0-9a-fA-F]{6}$/;

  function parseDate(s) {
    if (typeof s !== 'string' || !ISO.test(s)) return null;
    const [y, m, d] = s.split('-').map(Number);
    const t = Date.UTC(y, m - 1, d);
    const dt = new Date(t);
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
    return t;
  }
  const fmt = t => new Date(t).toISOString().slice(0, 10);
  const addDays = (t, n) => t + n * DAY;
  const diffDays = (a, b) => Math.round((b - a) / DAY);
  const isWeekend = t => { const w = new Date(t).getUTCDay(); return w === 0 || w === 6; };
  function workDays(a, b) { // working days in (a, b]
    let n = 0;
    for (let t = addDays(a, 1); t <= b; t = addDays(t, 1)) if (!isWeekend(t)) n++;
    return n;
  }
  const str = (v, max) => (typeof v === 'string' ? v.trim().slice(0, max) : '');
  const num = (v, lo, hi, dflt) => { const n = Number(v); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : dflt; };

  /* Validate + normalise an untrusted project object. Returns {ok, errors, project}. */

    out.push({ k: 'h2', t: T.teamT });
    out.push({ k: 'table', rows: kind === 'needs'

    }

    if (BB.extras.length) { out.push({ k: 'h2', t: T.fixed }); out.push({ k: 'table', rows: [[T.item, T.basisL, T.amount], ...BB.extras.map(x => [nm(x), basis(x), eur(x.total)])] }); }
    out.push({ k: 'h2', t: T.summaryB });
    out.push({ k: 'table', rows: [[T.item, T.amount], [T.labour, eur(BB.labour)], [T.fixedT, eur(BB.extrasTotal)], [`${T.contingencyL} (${Math.round(BB.contingencyRate * 100)} %${BB.contMode === 'auto' ? ', ' + T.autoU : ''})`, eur(BB.contingency)], [`**${T.totalB}**`, `**${eur(BB.total)}**`],
      ...(spec.status ? [[T.pvL, eur(BB.plannedValue)], [T.evL, eur(BB.earnedValue)]] : [])] });
    if (BB.contMode === 'auto') out.push({ k: 'p', t: `**${T.contWhy} :** ${BB.autoContingency.parts.map(x => `${nm(x)} ${Math.round(x.rate * 100)} %`).join(' + ')} = ${Math.round(BB.contingencyRate * 100)} %` });
    out.push({ k: 'note', t: T.budgetNote });
    // schedule
    H1(T.schedule);
    const spans = C.phaseSpans(P).filter(s => s.start);
    out.push({ k: 'h2', t: T.phaseT });
    out.push({ k: 'table', rows: [[T.id, T.phase, T.start, T.end, T.pts, T.progress], ...spans.map(s => [s.id, nm(s), dfmt(C.parseDate(s.start), lang), dfmt(C.parseDate(s.end), lang), String(s.points), Math.round(s.progress * 100) + ' %'])] });
    if (P.milestones.length) { out.push({ k: 'h2', t: T.msT }); out.push({ k: 'table', rows: [[T.id, T.milestone, T.date], ...P.milestones.map(m => [m.id, nm(m), dfmt(C.parseDate(m.date), lang)])] }); }
    out.push({ k: 'h2', t: T.summaryG }); IMG(imgs.summary, T.summaryG);

      out.push({ k: 'h2', t: T.masterG }); IMG(imgs.master, T.masterG);
      out.push({ k: 'h2', t: T.wbs });
      out.push({ k: 'table', rows: [[T.id, T.task, T.owner, T.start, T.end, 'Pts', T.deps, T.st], ...P.tasks.map(k => [k.id, nm(k), k.owner, dfmt(C.parseDate(k.start), lang).slice(0, 5), dfmt(C.parseDate(k.end), lang).slice(0, 5), String(k.points), k.deps.join(', ') || '—', st(k)])] });
      const crit = P.tasks.filter(k => cp.critical.has(k.id)).map(k => k.id);
      out.push({ k: 'p', t: `**${T.crit} :** ${crit.join(' · ') || T.none}. ${T.critTxt}.` });
    }
    if (spec.fields.includes('risks')) textSection('risks');
    if (spec.status) {
      H1(T.statusT);
      out.push({ k: 'table', rows: [[T.metric, T.value],
        [T.asOf, dfmt(now, lang)],
        [T.kpiDone, `${b.done} / ${b.total}`],
        [T.kpiEarned, `${num(h.pctEarned * 100, lang)} % / ${num(h.pctPlanned * 100, lang)} %`],
        [T.kpiSpi, `${num(h.spi, lang, 2)} — ${T.statusW[h.status]}`],
        [T.kpiVel, `${num(b.velocityWeek, lang)} / ${num(b.requiredWeek, lang)} ${T.perWk}`],

      out.push({ k: 'table', rows: [[T.date, T.ideal, T.actual, T.gap], ...snaps.reverse().slice(0, 10).map(s => { const i = C.idealAt(P, s), hit = b.actual.find(x => x.t === s), a = hit ? hit.v : b.total - C.donePointsAt(P, s); return [dfmt(s, lang), num(i, lang), num(a, lang), (a - i >= 0 ? '+' : '') + num(a - i, lang)]; })] });

      out.push({ k: 'p', t: `**${T.inprog} :** ${prog.map(k => `${k.id} ${nm(k)} (${k.progress} %)`).join(' · ') || T.none}` });

<script>/* Team and budget, derived from the schedule.
   A task is worked by one person of its owner's role, full time, on each working day of the task.
   → person-days per role, people needed per role (person-days over the active period, capped by peak overlap),
     labour cost (person-days × day rate), fixed costs, contingency, earned and planned value in €. */
const Budget = (() => {
  const C = (typeof Core !== 'undefined') ? Core : require('./core.js');
  const DEFAULT_TEAM = [
    ['PM', 'Chef de projet', 'Project manager', 550], ['ARCH', 'Architecte logiciel', 'Software architect', 650],
    ['UX', 'Designer UX/UI', 'UX/UI designer', 500], ['DEV', 'Développeur', 'Developer', 500],
    ['FE', 'Développeur front-end', 'Front-end developer', 500], ['BE', 'Développeur back-end', 'Back-end developer', 500],
    ['DATA', 'Data engineer', 'Data engineer', 550], ['ML', 'Data scientist', 'Data scientist', 600],
    ['QA', 'Testeur QA', 'QA tester', 450], ['SEC', 'Expert cybersécurité', 'Security expert', 650], ['OPS', 'Ingénieur DevOps', 'DevOps engineer', 550]
  ].map(([id, fr, en, rate]) => ({ id, fr, en, rate }));
  const FALLBACK_RATE = 500;
  const roleOf = owner => String(owner || '').trim().toUpperCase().replace(/\d+$/, '') || 'DEV';
  const workDaysOf = k => C.workDays(C.addDays(C.parseDate(k.start), -1), C.parseDate(k.end)) || 1;

  function team(p) {
    const list = Array.isArray(p.team) && p.team.length ? p.team : DEFAULT_TEAM;
    const byId = new Map(list.map(r => [r.id, r]));
    // any role used by a task but missing from the list gets a line with the fallback rate
    p.tasks.forEach(k => { const id = roleOf(k.owner); if (!byId.has(id)) byId.set(id, { id, fr: k.owner || id, en: k.owner || id, rate: FALLBACK_RATE }); });
    return byId;
  }

  function staffing(p) {
    const roles = team(p), out = new Map();
    p.tasks.forEach(k => {
      const id = roleOf(k.owner), r = roles.get(id), d = workDaysOf(k);
      const o = out.get(id) || { id, fr: r.fr, en: r.en, rate: r.rate, personDays: 0, start: k.start, end: k.end, days: new Map(), tasks: 0 };
      o.personDays += d; o.tasks++;
      if (k.start < o.start) o.start = k.start;
      if (k.end > o.end) o.end = k.end;
      for (let t = C.parseDate(k.start); t <= C.parseDate(k.end); t = C.addDays(t, 1)) if (!C.isWeekend(t)) o.days.set(t, (o.days.get(t) || 0) + 1);
      out.set(id, o);
    });
    return [...out.values()].map(o => {
      // People needed = person-days spread over the role's active period, rounded up,
      // never more than the peak number of tasks this role has running on the same day.
      const span = C.workDays(C.addDays(C.parseDate(o.start), -1), C.parseDate(o.end)) || 1;
      const people = Math.max(1, Math.min(Math.max(1, ...o.days.values()), Math.ceil(o.personDays / span)));
      return { id: o.id, fr: o.fr, en: o.en, rate: o.rate, people, personDays: o.personDays, tasks: o.tasks, start: o.start, end: o.end,
        load: Math.min(1, o.personDays / (span * people)), cost: o.personDays * o.rate };
    }).sort((a, b) => b.cost - a.cost);
  }

  function compute(p, todayT) {
    const roles = team(p), cfg = p.budget || {};
    const taskCost = k => workDaysOf(k) * (roles.get(roleOf(k.owner)) || { rate: FALLBACK_RATE }).rate;
    const staff = staffing(p);
    const labour = staff.reduce((a, r) => a + r.cost, 0);
    // Fixed costs follow the plan: monthly items × project months, per-person items × team size.
    const months = Math.max(1, Math.ceil((C.diffDays(C.parseDate(p.start), C.parseDate(p.end)) + 1) / 30.44));
    const people = staff.reduce((a, r) => a + r.people, 0);
    const qtyOf = per => per === 'month' ? months : per === 'person' ? people : per === 'personMonth' ? people * months : 1;
    const extras = (Array.isArray(cfg.extras) ? cfg.extras : []).filter(x => x.amount > 0).map(x => ({ ...x, per: x.per || 'once', qty: qtyOf(x.per), total: x.amount * qtyOf(x.per) }));
    const extrasTotal = extras.reduce((a, x) => a + x.total, 0);
    // Contingency: automatic from schedule risk, or a fixed rate chosen by the user.
    const auto = autoContingency(p, todayT, months);
    const contingencyRate = cfg.contMode === 'manual' && Number.isFinite(cfg.contingency) ? cfg.contingency : auto.rate;
    const subtotal = labour + extrasTotal, contingency = Math.round(subtotal * contingencyRate);
    const byPhase = p.phases.map(ph => ({ id: ph.id, fr: ph.fr, en: ph.en, color: ph.color, cost: p.tasks.filter(k => k.phase === ph.id).reduce((a, k) => a + taskCost(k), 0) })).filter(x => x.cost > 0);
    const now = C.statusTime(p, todayT);
    const ev = p.tasks.reduce((a, k) => a + taskCost(k) * (k.done ? 1 : k.progress / 100), 0);
    const pv = p.tasks.reduce((a, k) => {
      const s = C.parseDate(k.start), e = C.addDays(C.parseDate(k.end), 1);
      const f = now >= e ? 1 : now < s ? 0 : (C.addDays(now, 1) - s) / (e - s);
      return a + taskCost(k) * Math.min(1, Math.max(0, f));
    }, 0);
    return {
      currency: 'EUR', staff, labour, extras, extrasTotal, contingencyRate, contingency, subtotal, total: subtotal + contingency, byPhase,
      months, contMode: cfg.contMode === 'manual' ? 'manual' : 'auto', autoContingency: auto,
      people, personDays: staff.reduce((a, r) => a + r.personDays, 0),
      earnedValue: Math.round(ev), plannedValue: Math.round(pv)
    };
  }

  /* Automatic contingency: 10 % base, more when the schedule is at risk, when much of the plan is
     critical (no slack) and when the project is long. Each part is listed so the figure can be explained. */
  function autoContingency(p, todayT, months) {
    const parts = [{ fr: 'Base', en: 'Base', rate: 0.10 }];
    const h = C.health(p, todayT);
    if (h.status === 'risk') parts.push({ fr: 'Planning à risque (SPI < 0,95)', en: 'Schedule at risk (SPI < 0.95)', rate: 0.05 });
    if (h.status === 'late') parts.push({ fr: 'Planning en retard (SPI < 0,80)', en: 'Schedule late (SPI < 0.80)', rate: 0.10 });
    const cp = C.criticalPath(p), share = p.tasks.length ? cp.critical.size / p.tasks.length : 0;
    const crit = Math.round(Math.min(0.05, share * 0.08) * 100) / 100;
    if (crit > 0) parts.push({ fr: `Tâches sans marge (${Math.round(share * 100)} % du plan)`, en: `Tasks with no slack (${Math.round(share * 100)} % of the plan)`, rate: crit });

<script>/* Project assistant: plain-language description → full project (phases, tasks, dates, dependencies,

    ['P4', 'Tests et recette', 'Testing and acceptance', '#8FA6D1'], ['P5', 'Mise en service', 'Go-live', '#B7A3D9'], ['P6', 'Clôture', 'Closure', '#9AA7BD']];
  const SIZES = { small: { f: 0.7, prios: ['M'], lanes: 2 }, medium: { f: 1, prios: ['M', 'S'], lanes: 2 }, large: { f: 1.35, prios: ['M', 'S', 'C'], lanes: 2 } };

    const t = ' ' + norm(text) + ' ';

      let s = 0;
      k.kw.forEach(w => { const n = norm(w); if (n && t.includes(' ' + n + ' ') || (n.length > 5 && t.includes(n))) s += 1 + n.split(' ').length; });
      return { id: k.id, score: s };
    }).sort((a, b) => b.score - a.score);
    const best = scores[0];
    return { id: best && best.score > 0 ? best.id : 'software', scores };

  const nextWork = t => { let x = t; while (C.isWeekend(x)) x = C.addDays(x, 1); return x; };

  function projectName(text, tp, lang) {

/* ---------- state ---------- */
const load = () => { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch { return null; } };
const persist = () => { try { localStorage.setItem(STORE, JSON.stringify({ project: P, ui: UI })); } catch { /* storage unavailable: session-only */ } };
const saved = load();
let P = (saved && C.validateProject(saved.project).project) || C.validateProject(SAMPLE).project;
const UI = Object.assign({ lang: 'fr', tab: 'assistant', wzSize: 'medium', gMode: 'master', zoom: 14, deps: true, crit: true }, saved && saved.ui || {});
let editing = null, lastBurndown = null;
const t = k => I18N[UI.lang][k] ?? k;
const nm = o => (UI.lang === 'fr' ? o.fr : o.en) || o.fr || o.en || o.id;
const todayT = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); };
const nowT = () => C.statusTime(P, todayT());
const dLabel = (tm, long) => new Date(tm).toLocaleDateString(UI.lang === 'fr' ? 'fr-FR' : 'en-GB', long ? { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' } : { day: '2-digit', month: '2-digit', timeZone: 'UTC' });
const isoWeek = tm => { const d = new Date(tm); const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day + 3); const f = new Date(Date.UTC(d.getUTCFullYear(), 0, 4)); return 1 + Math.round(((d - f) / C.DAY - 3 + ((f.getUTCDay() + 6) % 7)) / 7); };
const phaseOf = id => P.phases.find(p => p.id === id) || { id: '', fr: '—', en: '—', color: '#8f9bb0' };
function taskStatus(k, now) {
  if (k.done) return 'done';
  if (C.parseDate(k.end) < now) return 'late';
  if (C.parseDate(k.start) <= now) return 'inprog';
  return 'todo';
}
const statusKey = { done: 'sDone', late: 'sLate', inprog: 'sInprog', todo: 'sTodo' };

/* ---------- chrome ---------- */
function renderChrome() {
  document.documentElement.lang = UI.lang;
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  $('eyebrow').textContent = t('eyebrow') + (P.code ? ' · ' + P.code : '');
  $('pName').textContent = P.name;
  $('pMeta').textContent = `${dLabel(C.parseDate(P.start), true)} → ${dLabel(C.parseDate(P.end), true)} · ${P.tasks.length} ${t('kTasks')} · ${C.totalPoints(P)} ${t('pts')}`;
  ['fr', 'en'].forEach(l => $('lang-' + l).setAttribute('aria-pressed', UI.lang === l));
  const tabs = [['assistant', 'tabAssistant'], ['burndown', 'tabBurndown'], ['gantt', 'tabGantt'], ['tasks', 'tabTasks'], ['budget', 'tabBudget'], ['project', 'tabProject']];
  $('tabs').innerHTML = tabs.map(([id, k]) => `<button type="button" role="tab" id="tb-${id}" data-tab="${id}" aria-selected="${UI.tab === id}" aria-controls="tab-${id}">${esc(t(k))}</button>`).join('');
  tabs.forEach(([id]) => { $('tab-' + id).hidden = UI.tab !== id; });
  $('kpis').hidden = UI.tab === 'assistant';
  $('g-summary').textContent = t('summary'); $('g-master').textContent = t('master');
  $('g-summary').setAttribute('aria-pressed', UI.gMode === 'summary'); $('g-master').setAttribute('aria-pressed', UI.gMode === 'master');
  document.querySelectorAll('#gZoom button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.z === UI.zoom));
  $('optDeps').checked = UI.deps; $('optCrit').checked = UI.crit;
}

function renderKpis() {
  setTimeout(() => countUp($('kpis')), 0);
  const BG = Budget.compute(P, todayT());
  const b = C.burndown(P, todayT()), h = C.health(P, todayT()), cp = C.criticalPath(P);
  const end = C.parseDate(P.end);
  const st = $('pStatus'); st.className = 'pill st-' + h.status; st.textContent = t(h.status);
  const fcLate = b.forecast !== null && b.forecast > end;
  const slip = b.forecast !== null ? C.diffDays(end, b.forecast) : null;
  const pct = x => Math.round(x * 100) + '%';
  const ring = (v, plan) => { const R = 19, L = 2 * Math.PI * R; return `<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="${R}" fill="none" stroke="var(--grid)" stroke-width="5"/>
    <circle cx="24" cy="24" r="${R}" fill="none" stroke="var(--ideal)" stroke-opacity=".5" stroke-width="5" stroke-dasharray="${(L * Math.min(1, plan)).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 24 24)"/>
    <circle class="ring-v" cx="24" cy="24" r="${R}" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(L * Math.min(1, v)).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 24 24)"/></svg>`; };
  $('kpis').innerHTML = `
    <div class="kpi"><div class="k">${esc(t('kRemaining'))}</div><div class="v"><span data-to="${Math.round(b.remaining)}">${Math.round(b.remaining)}</span> <small>${esc(t('pts'))}</small></div>
      <div class="s">${b.done} ${esc(t('kDone'))} ${b.total}</div><div class="meter"><i style="width:${b.total ? b.done / b.total * 100 : 0}%"></i></div></div>
    <div class="kpi"><div class="k">${esc(t('kEarned'))}</div><div class="ring">${ring(h.pctEarned, h.pctPlanned)}<div><div class="v"><span data-to="${Math.round(h.pctEarned * 100)}" data-suffix="%">${pct(h.pctEarned)}</span></div>
      <div class="s">${pct(h.pctPlanned)} ${esc(t('kPlanned'))}</div></div></div></div>
    <div class="kpi"><div class="k">${esc(t('kVelocity'))}</div><div class="v">${b.velocityWeek.toFixed(1)} <small>${esc(t('perWeek'))}</small></div>
      <div class="s" style="color:${b.velocityWeek + 0.05 < b.requiredWeek ? 'var(--warn)' : 'var(--muted)'}">${b.requiredWeek.toFixed(1)} ${esc(t('perWeek'))} ${esc(t('kRequired'))}</div></div>
    <div class="kpi"><div class="k">${esc(t('kSpi'))}</div><div class="v" style="color:var(--${h.status === 'on' ? 'good' : h.status === 'risk' ? 'warn' : 'bad'})">${h.spi.toFixed(2)}</div><div class="s">${esc(t('kSpiS'))}</div></div>
    <div class="kpi"><div class="k">${esc(t('kForecast'))}</div><div class="v" style="font-size:19px;${fcLate ? 'color:var(--bad)' : ''}">${b.forecast !== null ? esc(dLabel(b.forecast, true)) : esc(t('none'))}</div>
      <div class="s">${b.forecast !== null ? `${slip > 0 ? '+' : ''}${slip} ${esc(t('d'))} · ` : esc(t('noVelocity')) + ' · '}${esc(t('kPlannedEnd'))} ${esc(dLabel(end))}</div></div>
    <div class="kpi"><div class="k">${esc(t('kBudget'))}</div><div class="v" style="font-size:19px">${esc(eurF(BG.total))}</div><div class="s">${BG.people} ${esc(t('persons'))} · ${BG.personDays} ${esc(t('bPd'))}</div></div>
    <div class="kpi"><div class="k">${esc(t('kCritical'))}</div><div class="v">${cp.critical.size} <small>${esc(t('kTasks'))}</small></div>
      <div class="s mono">${esc([...cp.critical].filter(id => !P.tasks.find(k => k.id === id).done).slice(0, 6).join(' → ') || t('none'))}</div></div>`;
}

const eurF = v => new Intl.NumberFormat(UI.lang === 'fr' ? 'fr-FR' : 'en-GB', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(v);

/* ---------- budget and team ---------- */
function renderBudget() {
  const B = Budget.compute(P, todayT());
  const tile = (k, v, s, cls = '') => `<div class="kpi ${cls}"><div class="k">${esc(t(k))}</div><div class="v" style="font-size:20px">${esc(v)}</div>${s ? `<div class="s">${esc(s)}</div>` : ''}</div>`;
  $('budKpis').innerHTML = tile('bTotal', eurF(B.total), `${B.personDays} ${t('bPd')}`, 'total') + tile('bLabour', eurF(B.labour)) + tile('bFixed', eurF(B.extrasTotal)) +
    tile('bCont', eurF(B.contingency), Math.round(B.contingencyRate * 100) + ' %') + tile('bTeam', `${B.people} ${t('persons')}`, `${B.staff.length} ${t('role').toLowerCase()}s`) +
    tile('bEV', eurF(B.earnedValue), `${t('bPV')} : ${eurF(B.plannedValue)}`);
  $('teamTable').innerHTML = `<thead><tr><th>${esc(t('role'))}</th><th class="r">${esc(t('people'))}</th><th class="r">${esc(t('pdays'))}</th><th>${esc(t('period'))}</th><th class="r">${esc(t('load'))}</th><th class="r">${esc(t('rate'))}</th><th class="r">${esc(t('cost'))}</th></tr></thead><tbody>` +
    B.staff.map(r => `<tr><td>${esc(nm(r))} <span class="tid">${esc(r.id)}</span></td><td class="r num">${r.people}</td><td class="r num">${r.personDays}</td>
      <td class="num">${esc(dLabel(C.parseDate(r.start)))} → ${esc(dLabel(C.parseDate(r.end)))}</td><td class="r num">${Math.round(r.load * 100)} %</td>
      <td class="r"><input class="rate-in" type="number" min="0" max="10000" step="10" id="rate-${esc(r.id)}" data-role="${esc(r.id)}" value="${r.rate}" aria-label="${esc(t('rate'))} ${esc(nm(r))}"></td>
      <td class="r num">${esc(eurF(r.cost))}</td></tr>`).join('') +
    `<tr class="total-row"><td>${esc(t('total'))}</td><td class="r num">${B.people}</td><td class="r num">${B.personDays}</td><td></td><td></td><td></td><td class="r num">${esc(eurF(B.labour))}</td></tr></tbody>`;
  const max = Math.max(1, ...B.byPhase.map(x => x.cost));
  $('phaseCost').innerHTML = B.byPhase.map(x => `<div class="pc-row"><span>${esc(x.id + ' · ' + nm(x))}</span><span class="pc-bar"><i style="width:${x.cost / max * 100}%;background:${esc(x.color)}"></i></span><span class="num">${esc(eurF(x.cost))}</span></div>`).join('');
  const totals = new Map(B.extras.map(x => [x, x.total]));
  $('extraRows').innerHTML = (P.budget.extras || []).map((x, i) => { const hit = B.extras.find(y => y.fr === x.fr && y.en === x.en && y.amount === x.amount && (y.per || 'once') === (x.per || 'once')); return extraRow({ ...x, total: hit ? hit.total : 0 }, i); }).join('');
  $('bud-mode').innerHTML = `<option value="auto">${esc(t('contAuto'))}</option><option value="manual">${esc(t('contManual'))}</option>`;
  $('bud-mode').value = B.contMode;
  $('bud-cont').value = Math.round(B.contingencyRate * 100);
  $('bud-cont').disabled = B.contMode === 'auto';
  $('contWhy').innerHTML = B.contMode === 'auto' ? `<b>${esc(t('contWhy'))}</b> ${B.autoContingency.parts.map(x => `${esc(nm(x))} <span class="num">${Math.round(x.rate * 100)} %</span>`).join(' + ')} = <b class="num">${Math.round(B.contingencyRate * 100)} %</b>` : '';
  $('fixedSum').textContent = `${t('bFixed')} : ${eurF(B.extrasTotal)} · ${B.months} ${t('monthsU')} · ${B.people} ${t('persons')}`;

const slug = s => String(s).replace(/[^\w\-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'projet';

  if (!$('wz-start').value) { let x = C.addDays(todayT(), 1); while (new Date(x).getUTCDay() !== 1) x = C.addDays(x, 1); $('wz-start').value = C.fmt(x); }
  showDetect();
  if (lastGen) renderResult();
}
function showDetect() {
  const v = $('wz-desc').value.trim(), el = $('wzDetect');
  if (!v) { el.textContent = t('wzNone'); return; }
  const id = $('wz-type').value !== 'auto' ? $('wz-type').value : Generator.detect(v).id, tp = Generator.types().find(x => x.id === id);
  el.innerHTML = `${esc(t('wzDetected'))}<b>${esc(UI.lang === 'fr' ? tp.fr : tp.en)}</b>`;
}
function renderResult() {
  const p = P, weeks = Math.ceil((C.diffDays(C.parseDate(p.start), C.parseDate(p.end)) + 1) / 7);
  $('wzResult').hidden = false;
  $('wzResTitle').textContent = t('wzDone') + p.name;
  const st = (k, v) => `<div><dt>${esc(t(k))}</dt><dd>${esc(v)}</dd></div>`;
  $('wzStats').innerHTML = st('wzStType', UI.lang === 'fr' ? lastGen.fr : lastGen.en) + st('wzStDur', `${weeks} ${t('weeksU')}`) +
    st('wzStDates', `${dLabel(C.parseDate(p.start))} → ${dLabel(C.parseDate(p.end), true)}`) + st('wzStTasks', String(p.tasks.length)) +
    st('wzStPts', String(C.totalPoints(p))) + st('wzStMs', String(p.milestones.length)) +
    (B => st('kBudget', eurF(B.total)) + st('bTeam', `${B.people} ${t('persons')} · ${B.personDays} ${t('bPd')}`))(Budget.compute(p, todayT()));
  $('wzUndo').hidden = !prevProject;
}
$('wz-desc').addEventListener('input', showDetect);
$('wz-type').addEventListener('change', showDetect);
$('wzChips').addEventListener('click', ev => { const b = ev.target.closest('[data-chip]'); if (!b) return; $('wz-desc').value = b.dataset.chip; showDetect(); $('wz-desc').focus(); });
$('wzSize').addEventListener('click', ev => { const b = ev.target.closest('[data-size]'); if (!b) return; UI.wzSize = b.dataset.size; persist(); renderAssistant(); });
$('wzGo').addEventListener('click', async () => {
  const desc = $('wz-desc').value.trim(), msgEl = $('wzMsg');
  if (desc.length < 3) { msgEl.textContent = t('wzEmpty'); msgEl.className = 'err'; $('wz-desc').focus(); return; }
  $('wzGo').disabled = true; msgEl.textContent = ''; msgEl.className = '';
  let custom = null;
  try {
    const s = await sampleCap;
    if (s && $('wzAi').checked) {
      msgEl.textContent = t('wzAiRun');
      try { custom = Generator.fromAI(await s.json(Generator.aiPrompt(desc, UI.lang), { modelTier: 'default' })); } catch { custom = null; }
      msgEl.textContent = custom ? '' : t('wzAiFail');
    }
    const typeSel = $('wz-type').value;
    if (custom && typeSel !== 'auto') custom.typeId = typeSel;
    const out = Generator.build({ description: desc, client: $('wz-client').value.trim(), start: $('wz-start').value, size: UI.wzSize,
      typeId: typeSel === 'auto' ? undefined : typeSel, lang: UI.lang, custom });
    const r = C.validateProject(out.project);
    if (!r.ok) throw new Error(r.errors.join(','));
    prevProject = P; lastGen = out.type; P = r.project; editing = null;
    commit(); renderResult(); toast(t('wzDone') + P.name);
    $('wzResult').scrollIntoView?.({ behavior: 'smooth', block: 'start' });
  } catch (e) { console.warn('generation failed', e); msgEl.textContent = t('dlError'); msgEl.className = 'err'; }
  finally { $('wzGo').disabled = false; }
});
$('wzUndo').addEventListener('click', () => { if (!prevProject) return; P = prevProject; prevProject = null; lastGen = null; $('wzResult').hidden = true; commit(); $('wzMsg').textContent = t('wzUndone'); $('wzMsg').className = 'ok'; });
$('wzResult').addEventListener('click', ev => { const b = ev.target.closest('[data-wdl]'); if (b) download(b.dataset.wdl, $('wzDlStatus')); });
$('wzSeeGantt').addEventListener('click', () => { UI.tab = 'gantt'; UI.gMode = 'master'; persist(); renderChrome(); renderGantt(); });
$('wzEdit').addEventListener('click', () => { UI.tab = 'project'; persist(); renderChrome(); $('doc-context')?.focus(); });
$('newBtn').addEventListener('click', () => { UI.tab = 'assistant'; persist(); renderChrome(); $('wz-desc').focus(); });

/* ---------- toasts ---------- */
function toast(msg, err) {
  const el = document.createElement('div'); el.className = 'toast' + (err ? ' err' : ''); el.setAttribute('role', 'status'); el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 3200);
}

/* ---------- command bar (⌘K / Ctrl K) ---------- */
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
let cmdItems = [], cmdSel = 0, cmdReturn = null;
function cmdActions() {
  const go = (id, k, ic) => ({ label: `${t('cmdGo')} ${t(k)}`, ic, run: () => { UI.tab = id; if (id === 'burndown') animateBd = true; persist(); renderChrome(); if (id === 'burndown') renderBurndown(); } });
  return [
    { label: t('newProject'), ic: '+', hint: '', run: () => { UI.tab = 'assistant'; persist(); renderChrome(); $('wz-desc').focus(); } },
    go('assistant', 'tabAssistant', 'A'), go('burndown', 'tabBurndown', 'B'), go('gantt', 'tabGantt', 'G'), go('tasks', 'tabTasks', 'T'), go('budget', 'tabBudget', '€'), go('project', 'tabProject', 'P'),
    ...[['needs', 'dlNeeds', '.docx'], ['technical', 'dlTech', '.docx'], ['report', 'dlReport', '.docx'], ['gs', 'dlGs', '.png'], ['gm', 'dlGm', '.png'], ['bd', 'dlBd', '.png'], ['csv', 'dlCsv', '.csv'], ['json', 'dlJson', '.json']]
      .map(([kind, k, ext]) => ({ label: `${t('download')} · ${t(k)}`, ic: '↓', hint: ext, run: () => download(kind) })),
    { label: t('cmdLang'), ic: UI.lang === 'fr' ? 'EN' : 'FR', run: () => { UI.lang = UI.lang === 'fr' ? 'en' : 'fr'; commit(); } },
    { label: `${t('tabGantt')} · ${t('summary')}`, ic: 'G', run: () => { UI.tab = 'gantt'; UI.gMode = 'summary'; persist(); renderChrome(); renderGantt(); } },
    { label: `${t('tabGantt')} · ${t('master')}`, ic: 'G', run: () => { UI.tab = 'gantt'; UI.gMode = 'master'; persist(); renderChrome(); renderGantt(); } },
    { label: t('addTask'), ic: '+', run: () => { UI.tab = 'tasks'; persist(); renderChrome(); fillForm(null); $('tf-fr').focus(); } }
  ];
}
const fold = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function renderCmd() {
  const q = fold($('cmdkIn').value.trim());
  cmdItems = cmdActions().filter(a => !q || q.split(/\s+/).every(w => fold(a.label).includes(w)));
  cmdSel = Math.min(cmdSel, Math.max(0, cmdItems.length - 1));
  $('cmdkList').innerHTML = cmdItems.length ? cmdItems.map((a, i) => `<li role="option" id="cmd-${i}" data-i2="${i}" aria-selected="${i === cmdSel}"><span class="ci">${esc(a.ic)}</span>${esc(a.label)}${a.hint ? `<small>${esc(a.hint)}</small>` : ''}</li>`).join('')
    : `<li class="cmdk-empty" role="option" aria-disabled="true">${esc(t('cmdEmpty'))}</li>`;
  $('cmdkIn').setAttribute('aria-activedescendant', cmdItems.length ? 'cmd-' + cmdSel : '');
  $('cmd-' + cmdSel)?.scrollIntoView?.({ block: 'nearest' });
}
function openCmd() { cmdReturn = document.activeElement; $('cmdk').hidden = false; $('cmdkIn').value = ''; $('cmdkIn').placeholder = t('cmdPh'); cmdSel = 0; renderCmd(); $('cmdkIn').focus(); }
function closeCmd() { $('cmdk').hidden = true; cmdReturn?.focus?.(); }
function runCmd(i) { const a = cmdItems[i]; if (!a) return; closeCmd(); a.run(); }
$('cmdKey').textContent = isMac ? '⌘K' : 'Ctrl K';
$('cmdBtn').addEventListener('click', openCmd);
$('cmdkIn').addEventListener('input', () => { cmdSel = 0; renderCmd(); });
$('cmdkIn').addEventListener('keydown', ev => {
  if (ev.key === 'ArrowDown') { ev.preventDefault(); cmdSel = (cmdSel + 1) % Math.max(1, cmdItems.length); renderCmd(); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); cmdSel = (cmdSel - 1 + cmdItems.length) % Math.max(1, cmdItems.length); renderCmd(); }
  else if (ev.key === 'Enter') { ev.preventDefault(); runCmd(cmdSel); }
  else if (ev.key === 'Tab') ev.preventDefault();
});
$('cmdkList').addEventListener('click', ev => { const li = ev.target.closest('[data-i2]'); if (li) runCmd(Number(li.dataset.i2)); });
$('cmdk').addEventListener('click', ev => { if (ev.target.closest('[data-close]')) closeCmd(); });
document.addEventListener('keydown', ev => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); $('cmdk').hidden ? openCmd() : closeCmd(); }
  else if (ev.key === 'Escape' && !$('cmdk').hidden) closeCmd();
});

/* ---------- cursor spotlight on glass cards ---------- */
let spotRaf = 0;
document.addEventListener('pointermove', ev => {
  if (reduceMotion || spotRaf) return;
  spotRaf = requestAnimationFrame(() => {
    spotRaf = 0;
    const el = ev.target.closest && ev.target.closest('.card, .kpi, .wiz-main'); if (!el) return;
    const r = el.getBoundingClientRect(); el.style.setProperty('--mx', (ev.clientX - r.left) + 'px'); el.style.setProperty('--my', (ev.clientY - r.top) + 'px');
  });
}, { passive: true });

/* ---------- wiring ---------- */
function renderAll() {
  const fa = document.activeElement, fid = fa && fa.id, sel = fa && typeof fa.selectionStart === 'number' ? [fa.selectionStart, fa.selectionEnd] : null;
  renderAllInner();
  if (fid && document.activeElement !== $(fid) && $(fid)) { const el = $(fid); el.focus({ preventScroll: true }); if (sel && typeof el.setSelectionRange === 'function') try { el.setSelectionRange(sel[0], sel[1]); } catch { /* number inputs */ } }
}
function renderAllInner() { renderChrome(); renderKpis(); renderBurndown(); renderFocus(); renderGantt(); renderTasks(); renderProject(); renderDocsEditor(); renderAssistant(); renderBudget(); if (!editing) fillFormSilent(); }
function fillFormSilent() { const keep = editing; if (!keep && !$('tf-fr').value) { $('tf-id').value = nextId('T', P.tasks); $('tf-id').readOnly = false; } }
function commit() { P.history = C.recordHistory(P, nowT()); persist(); renderAll(); }
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { UI.lang = b.dataset.lang; commit(); }));
$('tabs').addEventListener('click', ev => { const b = ev.target.closest('[data-tab]'); if (!b) return; UI.tab = b.dataset.tab; persist(); renderChrome(); if (UI.tab === 'burndown') { animateBd = true; renderBurndown(); } });
$('tabs').addEventListener('keydown', ev => {
  if (!['ArrowRight', 'ArrowLeft'].includes(ev.key)) return;
  const ids = ['assistant', 'burndown', 'gantt', 'tasks', 'budget', 'project'], i = ids.indexOf(UI.tab);
  UI.tab = ids[(i + (ev.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length]; persist(); renderChrome(); $('tb-' + UI.tab).focus();
});
$('gMode').addEventListener('click', ev => { const b = ev.target.closest('[data-mode]'); if (!b) return; UI.gMode = b.dataset.mode; persist(); renderChrome(); renderGantt(); });
$('gZoom').addEventListener('click', ev => { const b = ev.target.closest('[data-z]'); if (!b) return; UI.zoom = +b.dataset.z; persist(); renderChrome(); renderGantt(); });
$('optDeps').addEventListener('change', ev => { UI.deps = ev.target.checked; persist(); renderGantt(); });
$('optCrit').addEventListener('change', ev => { UI.crit = ev.target.checked; persist(); renderGantt(); });
const hash = (location.hash || '').slice(1);
if (['assistant', 'burndown', 'gantt', 'tasks', 'budget', 'project'].includes(hash)) UI.tab = hash;
renderAll(); fillForm(null);
})();
</script>
